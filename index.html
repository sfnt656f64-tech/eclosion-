<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3EFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Éclosion">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}
#installBtn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;border:0;border-radius:99px;padding:12px 20px;font:800 15px "Nunito",system-ui,sans-serif;background:#FF5D86;color:#fff;box-shadow:0 6px 20px rgba(70,45,140,.3);cursor:pointer}</style>
<title>Éclosion</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout : une colonne d'app mobile (max 560px) centrée, barre d'onglets fixe en bas, feuilles modales qui montent du bas. */
:root{
  --bg:#F3EFFF; --bg-glow1:#FFE3EC; --bg-glow2:#DDF3FF;
  --surface:#FFFFFF; --surface2:#F6F2FF; --line:#E7E0FA;
  --ink:#2B2350; --muted:#6F6893;
  --accent:#FF5D86; --accent-soft:#FFE4EC; --on-accent:#FFFFFF;
  --gold:#FFB52E; --gold-soft:#FFF1D2; --mint:#22C38E; --sky:#3F8CFF; --violet:#9B6BFF; --orange:#FF8A3D;
  --shadow:0 8px 24px rgba(70,45,140,.10), 0 1px 2px rgba(70,45,140,.08);
  --font-display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --font-body:"Nunito", "Segoe UI", system-ui, sans-serif;
  --r:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16122A; --bg-glow1:#2B1838; --bg-glow2:#13243A;
  --surface:#231D3F; --surface2:#2C2550; --line:#3A3266;
  --ink:#F4F0FF; --muted:#ABA3D1;
  --accent:#FF7298; --accent-soft:#4A2440; --on-accent:#FFFFFF;
  --gold:#FFC24D; --gold-soft:#4A3A1A; --mint:#38D9A2; --sky:#69A6FF; --violet:#B08CFF; --orange:#FF9A55;
  --shadow:0 8px 24px rgba(0,0,0,.35), 0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#16122A; --bg-glow1:#2B1838; --bg-glow2:#13243A;
  --surface:#231D3F; --surface2:#2C2550; --line:#3A3266;
  --ink:#F4F0FF; --muted:#ABA3D1;
  --accent:#FF7298; --accent-soft:#4A2440; --on-accent:#FFFFFF;
  --gold:#FFC24D; --gold-soft:#4A3A1A; --mint:#38D9A2; --sky:#69A6FF; --violet:#B08CFF; --orange:#FF9A55;
  --shadow:0 8px 24px rgba(0,0,0,.35), 0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{min-height:100%}
body{
  background:var(--bg);
  background-image:radial-gradient(60vmax 50vmax at 0% 0%, var(--bg-glow1), transparent 60%),radial-gradient(60vmax 50vmax at 100% 30%, var(--bg-glow2), transparent 60%);
  background-attachment:fixed;
  color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.45;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface2);border:2px solid var(--line);border-radius:14px;padding:10px 12px;width:100%}
textarea{min-height:110px;resize:vertical;font-size:12px;font-family:ui-monospace,monospace}
h1,h2,h3{font-family:var(--font-display);line-height:1.1;margin:0;text-wrap:balance}
.app{max-width:560px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:10px calc(96px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.top{display:flex;align-items:center;gap:10px;padding-top:6px}
.brand{font-family:var(--font-display);font-weight:800;font-size:24px;letter-spacing:-.5px;flex:1;display:flex;align-items:center;gap:6px}
.brand svg{width:30px;height:30px}
.top h1{flex:1;font-size:22px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pills{display:flex;gap:5px}
.pill{display:inline-flex;align-items:center;gap:4px;background:var(--surface);box-shadow:var(--shadow);border-radius:999px;padding:5px 9px 5px 7px;font-weight:800;font-variant-numeric:tabular-nums}
.pill svg{width:18px;height:18px}
.pill.streak.off{opacity:.55}
.icon-btn{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);flex:none}
.icon-btn svg{width:20px;height:20px}
.icon-btn.flat{box-shadow:none;background:transparent;width:34px;height:34px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:16px;padding:12px 18px;font-weight:800;background:var(--surface2);border:2px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent;box-shadow:0 4px 0 color-mix(in srgb, var(--accent) 70%, #000)}
.btn.primary:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb, var(--accent) 70%, #000)}
.btn.danger{color:#fff;background:#E5484D;border-color:transparent}
.btn.block{width:100%}
.btn svg{width:18px;height:18px}
.muted{color:var(--muted)}
.tiny{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gc,var(--accent)),color-mix(in srgb,var(--gc,var(--accent)) 60%, #fff));transition:width .6s cubic-bezier(.2,.9,.3,1.2)}
.bar.small{height:7px}
.section-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.section-h h2{font-size:20px;flex:1}
.section-h{flex-wrap:wrap}
.section-h .tiny{flex:0 1 auto;min-width:0;text-align:right}

/* Quête du jour */
.quest{background:linear-gradient(135deg,var(--surface),var(--gold-soft))}
.qrow{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:8px;padding:5px 0}
.qrow .chk{width:22px;height:22px;border-radius:8px;border:2px solid color-mix(in srgb,var(--muted) 60%,transparent);display:grid;place-items:center;background:var(--surface)}
.qrow.done .chk{background:var(--mint);border-color:var(--mint);color:#fff}
.qrow.done .qtxt{text-decoration:line-through;color:var(--muted)}
.qrow .chk svg{width:14px;height:14px}
.qtxt{font-weight:700;min-width:0}
.quest-body{display:flex;gap:12px;align-items:center}
.quest-list{flex:1;min-width:0}
.chest-btn{width:86px;flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;font-size:12px;border-radius:16px;padding:6px 4px}
.chest-btn svg{width:70px;height:58px}
.chest-btn.ready{animation:chestReady 1.1s ease-in-out infinite;background:var(--gold-soft)}
.chest-btn.ready .chest-lbl{color:var(--orange)}
.chest-btn:disabled{cursor:default}
.chest-btn.locked svg{filter:grayscale(.7);opacity:.7}
@keyframes chestReady{0%,100%{transform:rotate(0) scale(1)}20%{transform:rotate(-6deg) scale(1.06)}40%{transform:rotate(6deg) scale(1.06)}60%{transform:rotate(0) scale(1)}}

/* Cartes objectifs */
.gcard{--gc:var(--accent);background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.gcard::before{content:"";position:absolute;inset:0 0 auto 0;height:96px;background:radial-gradient(120px 90px at 56px 50px, color-mix(in srgb,var(--gc) 26%, transparent), transparent 70%);pointer-events:none}
.gtop{display:flex;gap:12px;align-items:center;position:relative}
.ginfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;text-align:left;cursor:pointer}
.ginfo h3{font-size:18px}
.sub{font-size:13px;font-weight:700;color:var(--muted)}
.stage-badge{display:inline-block;padding:1px 8px;border-radius:99px;background:color-mix(in srgb,var(--gc) 18%, transparent);color:color-mix(in srgb,var(--gc) 70%, var(--ink));font-weight:800;font-size:12px}
.mood{font-size:12.5px;font-weight:700;color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;border-radius:14px;padding:9px 12px;font-weight:800;font-size:14px;color:#fff;background:var(--dc);box-shadow:0 3px 0 color-mix(in srgb,var(--dc) 65%, #000);transition:transform .08s;max-width:100%;text-align:left}
.chip span{min-width:0;overflow-wrap:anywhere}
.chip b{background:rgba(255,255,255,.25);border-radius:8px;padding:1px 6px;font-size:12px;flex:none;font-variant-numeric:tabular-nums}
.chip:active{transform:translateY(3px);box-shadow:0 0 0 transparent}
.chip.locked{background:var(--surface2);color:var(--muted);box-shadow:none;border:2px dashed var(--line)}
.chip.locked svg{width:14px;height:14px}
.d-facile{--dc:var(--mint)} .d-moyen{--dc:var(--sky)} .d-difficile{--dc:var(--orange)} .d-epique{--dc:var(--violet)}
.add-goal{border:3px dashed var(--line);border-radius:var(--r);padding:18px;font-weight:800;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px;background:color-mix(in srgb,var(--surface) 50%, transparent)}
.add-goal svg{width:20px;height:20px}
.empty{text-align:center;padding:14px;color:var(--muted)}

/* Créatures */
.cr-wrap{position:relative;flex:none;cursor:pointer;touch-action:manipulation}
.cr-wrap.sm{width:92px;height:92px}
.cr-wrap.md{width:120px;height:120px}
.cr-wrap.lg{width:min(250px,64vw);height:min(250px,64vw);margin:0 auto}
.cr{width:100%;height:100%;display:block;overflow:visible}
.cr-root{transform-box:fill-box;transform-origin:50% 100%}
.cr-root.tap{animation:crTap .65s cubic-bezier(.3,.7,.4,1.4)}
@keyframes crTap{0%{transform:none}18%{transform:scale(1.12,.84)}45%{transform:translateY(-16px) scale(.94,1.08)}72%{transform:scale(1.05,.95)}100%{transform:none}}
.cr-breathe{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(.985,1.035)}}
.cr-eyes{transform-box:fill-box;transform-origin:50% 50%;animation:blink 4.8s infinite}
@keyframes blink{0%,91%,97%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
.cr-sway{transform-box:view-box;animation:sway 2.6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.cr-wobble{transform-box:fill-box;transform-origin:50% 100%;animation:wobble 3.4s ease-in-out infinite}
.cr-wobble.fast{animation-duration:1.6s}
@keyframes wobble{0%,55%,100%{transform:rotate(0)}65%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}85%{transform:rotate(-3deg)}}
.cr-aura{transform-box:fill-box;transform-origin:50% 50%;animation:aura 2.8s ease-in-out infinite}
@keyframes aura{0%,100%{opacity:.75;transform:scale(.96)}50%{opacity:1;transform:scale(1.04)}}
.cr-rays{transform-box:view-box;animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cr-twinkle{transform-box:fill-box;transform-origin:50% 50%;animation:twinkle 1.8s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(.2);opacity:.2}50%{transform:scale(1);opacity:1}}
.cr-wing{transform-box:view-box;animation:flap 1.4s ease-in-out infinite}
@keyframes flap{0%,100%{transform:rotate(0)}50%{transform:rotate(var(--fl,10deg))}}
.cr-tear{animation:tear 2.2s ease-in infinite}
@keyframes tear{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(14px);opacity:0}}
.cr-z{animation:zz 2.6s ease-out infinite;font-family:var(--font-display);font-weight:800}
@keyframes zz{0%{transform:translate(0,0);opacity:0}20%{opacity:1}100%{transform:translate(10px,-22px);opacity:0}}
.cr.sad{filter:saturate(.6)}
.cr.sleep{filter:saturate(.35) brightness(.95)}
/* Personnalité de chaque espèce : façon de bouger au repos */
.cr-move{transform-box:fill-box;transform-origin:50% 100%}
.m-braise{animation:mBraise 3.4s ease-in-out infinite}
@keyframes mBraise{0%,60%,100%{transform:none}66%{transform:scale(1.07,.9)}75%{transform:translateY(-13px) scale(.95,1.06)}83%{transform:none}87%{transform:scale(1.05,.95)}92%{transform:none}}
.m-nuage{animation:mNuage 4.2s ease-in-out infinite}
@keyframes mNuage{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(2deg)}}
.m-pousse{animation:mPousse 2.6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes mPousse{0%,100%{transform:rotate(-5deg)}25%{transform:rotate(0) translateY(-3px)}50%{transform:rotate(5deg)}75%{transform:rotate(0) translateY(-3px)}}
.m-goutte{animation:mGoutte 1.9s ease-in-out infinite}
@keyframes mGoutte{0%,100%{transform:scale(1,1)}30%{transform:scale(1.07,.93)}60%{transform:scale(.95,1.06)}}
.m-cristal{animation:mCristal 4.8s ease-in-out infinite}
@keyframes mCristal{0%,68%,100%{transform:none}75%{transform:translateY(-7px) rotate(-2deg)}81%{transform:translateY(0) scale(1.06,.94)}86%{transform:none}}
.cr.sad .cr-move{animation:mSad 5s ease-in-out infinite}
@keyframes mSad{0%,100%{transform:rotate(-2deg) scale(1,.98)}50%{transform:rotate(2deg) scale(1,.96)}}
.cr.sleep .cr-move{animation:none}
.cr.sleep .cr-breathe{animation-duration:5s}
.cr-look{transition:transform .3s ease-out}
/* Expressions : yeux rieurs et bouche qui parle */
.cr-eyes-happy,.cr-mouth-o{opacity:0}
.cr-root.joy .cr-eyes{opacity:0}
.cr-root.joy .cr-eyes-happy{opacity:1}
.cr-root.talk .cr-mouth{opacity:0}
.cr-root.talk .cr-mouth-o{opacity:1;transform-box:fill-box;transform-origin:50% 20%;animation:yap .13s ease-in-out infinite alternate}
@keyframes yap{from{transform:scaleY(.35)}to{transform:scaleY(1.15)}}
/* Danse sur le rythme pendant une chorale */
.cr-root.bop{animation:bop .3s ease-out}
@keyframes bop{0%{transform:none}35%{transform:scale(1.06,.92)}70%{transform:translateY(-4px) scale(.98,1.03)}100%{transform:none}}
/* Réactions au toucher, propres à chaque espèce */
.cr-root.tap-braise{transform-origin:50% 62%;animation:tBraise .85s cubic-bezier(.3,.7,.4,1.1)}
@keyframes tBraise{0%{transform:none}15%{transform:scale(1.15,.82)}55%{transform:translateY(-30px) rotate(360deg)}75%{transform:rotate(360deg) scale(1.1,.9)}100%{transform:rotate(360deg)}}
.cr-root.tap-nuage{animation:tNuage .9s ease-out}
@keyframes tNuage{0%{transform:none}22%{transform:scale(1.28,.78)}55%{transform:translateY(-24px) scale(.94,1.1)}80%{transform:translateY(-6px)}100%{transform:none}}
.cr-root.tap-pousse{animation:tPousse .85s ease-out}
@keyframes tPousse{0%{transform:none}18%{transform:rotate(-16deg)}38%{transform:rotate(16deg) translateY(-12px)}58%{transform:rotate(-10deg)}78%{transform:rotate(6deg)}100%{transform:none}}
.cr-root.tap-goutte{animation:tGoutte .9s cubic-bezier(.3,.7,.4,1.4)}
@keyframes tGoutte{0%{transform:none}15%{transform:scale(1.32,.68)}35%{transform:translateY(-14px) scale(.78,1.28)}55%{transform:scale(1.14,.86)}75%{transform:scale(.95,1.05)}100%{transform:none}}
.cr-root.tap-cristal{animation:tCristal .9s ease-in}
@keyframes tCristal{0%{transform:none}30%{transform:translateY(-20px) scale(.96,1.05)}42%{transform:translateY(0) scale(1.14,.85)}52%{transform:translateX(-3px)}62%{transform:translateX(3px)}72%{transform:translateX(-2px)}100%{transform:none}}
.cr-root.idle-hop{animation:crTap .6s cubic-bezier(.3,.7,.4,1.4)}
.heart{position:absolute;pointer-events:none;font-size:18px;color:var(--accent);animation:heart 1s ease-out forwards}
.heart svg{width:18px;height:18px;display:block}
@keyframes heart{0%{transform:translate(0,0) scale(.4);opacity:0}20%{opacity:1;transform:translate(var(--hx),-14px) scale(1.1)}100%{transform:translate(calc(var(--hx)*2),-60px) scale(.8);opacity:0}}
.bubble{position:absolute;left:50%;bottom:92%;transform:translateX(-50%);background:var(--surface);color:var(--ink);border-radius:14px;padding:6px 10px;font-weight:800;font-size:13px;white-space:nowrap;box-shadow:var(--shadow);animation:bubble 1.9s ease forwards;pointer-events:none;z-index:3}
.bubble::after{content:"";position:absolute;left:50%;top:100%;border:7px solid transparent;border-top-color:var(--surface);transform:translateX(-50%)}
@keyframes bubble{0%{opacity:0;transform:translate(-50%,8px) scale(.7)}12%{opacity:1;transform:translate(-50%,0) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-6px)}}

/* Détail objectif */
.hero{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;--gc:var(--accent);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(260px 200px at 50% 38%, color-mix(in srgb,var(--gc) 30%, transparent), transparent 70%);pointer-events:none}
.hero>*{position:relative}
.hero h2{font-size:26px}
.hero .bar{width:100%;max-width:340px}
.evo-path{display:flex;justify-content:center;gap:4px;width:100%;margin-top:6px;flex-wrap:wrap}
.evo-step{display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:800;color:var(--muted);width:60px}
.evo-step .mini{width:48px;height:48px}
.evo-step.locked .mini{filter:brightness(0);opacity:.18}
.evo-step.current{color:var(--ink)}
.evo-step.current .mini{background:color-mix(in srgb,var(--gc) 18%, transparent);border-radius:14px}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;align-items:center}
.do-btn{flex:1;min-width:0;display:flex;align-items:center;gap:10px;justify-content:space-between;text-align:left;border-radius:14px;padding:12px 14px;font-weight:800;color:#fff;background:var(--dc);box-shadow:0 3px 0 color-mix(in srgb,var(--dc) 65%, #000)}
.do-btn span{min-width:0;overflow-wrap:anywhere}
.do-btn small{display:block;font-weight:700;opacity:.85;font-size:11.5px}
.do-btn b{background:rgba(255,255,255,.25);border-radius:8px;padding:2px 8px;font-size:13px;flex:none}
.do-btn:active{transform:translateY(3px);box-shadow:none}
.do-btn.locked{background:var(--surface2);color:var(--muted);box-shadow:none;border:2px dashed var(--line)}
.ms-btn{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;border-radius:14px;padding:11px 12px;background:var(--surface2);border:2px solid var(--line);font-weight:700}
.ms-btn .box{width:24px;height:24px;border-radius:8px;border:2.5px solid var(--line);flex:none;display:grid;place-items:center;background:var(--surface)}
.ms-btn .box svg{width:15px;height:15px}
.ms-btn .mtxt{flex:1;min-width:0;overflow-wrap:anywhere}
.ms-btn b{color:var(--orange);font-size:13px;flex:none}
.ms-btn.done{opacity:.7}
.ms-btn.done .box{background:var(--mint);border-color:var(--mint);color:#fff}
.ms-btn.done .mtxt{text-decoration:line-through}
.ms-btn.final{border-color:var(--gold);background:linear-gradient(135deg,var(--gold-soft),var(--surface2))}
.ms-btn.final b{color:var(--gold)}
.skill{border-radius:16px;background:var(--surface2);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.sk-head{display:flex;align-items:center;gap:8px}
.sk-head b{flex:1;min-width:0;overflow-wrap:anywhere}
.lvl{background:var(--gc,var(--accent));color:#fff;border-radius:10px;padding:2px 8px;font-weight:800;font-size:12.5px;font-family:var(--font-display);flex:none}
.perks{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.perks li{font-size:12px;font-weight:700;border-radius:99px;padding:3px 9px;background:var(--surface);border:1.5px solid var(--line);color:var(--muted);display:inline-flex;gap:4px;align-items:center}
.perks li svg{width:12px;height:12px}
.perks li.on{background:var(--gold-soft);border-color:var(--gold);color:var(--ink)}
.sk-children{display:flex;flex-direction:column;gap:6px;margin-left:10px;padding-left:10px;border-left:3px solid var(--line)}
.skill.locked{opacity:.65}
.skill.locked .lvl{background:var(--muted)}
.add-row{display:flex;align-items:center;justify-content:center;gap:6px;border-radius:14px;padding:10px;border:2px dashed var(--line);color:var(--muted);font-weight:800}
.add-row svg{width:16px;height:16px}

/* Succès */
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ach{border-radius:16px;padding:10px;background:var(--surface2);display:flex;gap:8px;align-items:center;min-width:0}
.ach .medal{width:38px;height:38px;flex:none}
.ach b{display:block;font-size:13.5px;line-height:1.15}
.ach span{font-size:11.5px;color:var(--muted);display:block;line-height:1.2}
.ach.off .medal{filter:grayscale(1);opacity:.35}
.ach.off b{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface2);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--font-display);font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--muted);font-weight:700}
.log{display:flex;flex-direction:column;gap:2px;font-size:13px}
.log div{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}
.log div span:first-child{flex:1;min-width:0;overflow-wrap:anywhere}
.log b{color:var(--mint);font-variant-numeric:tabular-nums}

/* Barre d'onglets */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));background:color-mix(in srgb,var(--surface) 88%, transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.nav-in{max-width:560px;margin:0 auto;display:flex;gap:6px}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:800;color:var(--muted);padding:4px;border-radius:12px}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--accent);background:var(--accent-soft)}

/* Feuilles modales */
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(20,10,40,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px max(18px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));animation:up .28s cubic-bezier(.2,.9,.3,1.1);display:flex;flex-direction:column;gap:14px}
.sheet h2{font-size:22px}
.sheet.nudge{animation:nudge .35s ease}
@keyframes nudge{0%,100%{transform:none}30%{transform:translateY(-10px)}60%{transform:translateY(3px)}}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lbl{font-weight:800;font-size:13.5px}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:6px}
.seg button{border-radius:12px;padding:8px 6px;border:2px solid var(--line);background:var(--surface2);font-weight:800;font-size:13px;line-height:1.2}
.seg button small{display:block;font-weight:700;color:var(--muted);font-size:11.5px}
.seg button.on{border-color:var(--dc,var(--accent));background:color-mix(in srgb,var(--dc,var(--accent)) 16%, var(--surface))}
.species{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.species button{border-radius:14px;border:2px solid var(--line);padding:4px 2px 6px;background:var(--surface2);font-size:11px;font-weight:800;display:flex;flex-direction:column;align-items:center}
.species button .mini{width:52px;height:52px}
.species button.on{border-color:var(--accent);background:var(--accent-soft)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatches button{width:36px;height:36px;border-radius:50%;background:var(--sw);border:3px solid var(--surface);box-shadow:0 0 0 2px var(--line)}
.swatches button.on{box-shadow:0 0 0 3px var(--ink)}
.perk-row{display:grid;grid-template-columns:80px 1fr 34px;gap:6px;align-items:center}
.sheet-actions{display:flex;gap:8px;flex-wrap:wrap}
.sheet-actions .btn{flex:1}
.confirm-box{border:2px solid #E5484D;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}

/* Toasts */
.toasts{position:fixed;top:calc(10px + env(safe-area-inset-top, 0px));left:0;right:0;z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{pointer-events:auto;background:var(--surface);color:var(--ink);border-radius:16px;box-shadow:var(--shadow);padding:10px 14px;display:flex;align-items:center;gap:10px;font-weight:700;max-width:440px;width:100%;animation:toastIn .35s cubic-bezier(.2,.9,.3,1.3);border-left:6px solid var(--tc,var(--accent))}
.toast .ti{width:30px;height:30px;flex:none}
.toast .tt{flex:1;min-width:0;line-height:1.25}
.toast .tt small{display:block;font-weight:600;color:var(--muted)}
.toast button{font-weight:800;color:var(--accent);padding:4px 8px}
.toast.out{animation:toastOut .3s forwards}
@keyframes toastIn{from{transform:translateY(-30px) scale(.9);opacity:0}}
@keyframes toastOut{to{transform:translateY(-20px);opacity:0}}

/* Effets */
#fx{position:fixed;inset:0;pointer-events:none;z-index:70}
.float{position:fixed;z-index:71;pointer-events:none;font-family:var(--font-display);font-weight:800;font-size:22px;color:var(--mint);text-shadow:0 2px 0 rgba(0,0,0,.15);animation:floatUp 1.25s ease-out forwards;transform:translate(-50%,-50%);white-space:nowrap}
.float.crit{color:var(--gold);font-size:30px}
.float.mega{color:var(--accent);font-size:36px}
.float small{display:block;font-size:13px;text-align:center}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}15%{opacity:1;transform:translate(-50%,-80%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-260%) scale(1)}}

/* Grands moments (évolution, coffre) */
.big{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px));background:radial-gradient(circle at 50% 42%, #3B2A7A, #120B2B 70%);color:#fff;text-align:center;animation:fade .3s;overflow:hidden}
.big h2{font-size:28px;max-width:420px}
.big p{max-width:380px;margin:0;color:#D9D0FF}
.big .rays{position:absolute;left:50%;top:42%;width:900px;height:900px;margin:-450px 0 0 -450px;background:repeating-conic-gradient(from 0deg, rgba(255,215,120,.16) 0deg 9deg, transparent 9deg 22deg);animation:spin 14s linear infinite;opacity:0;transition:opacity .6s;pointer-events:none}
.big.shine .rays{opacity:1}
.big .stage{width:min(260px,68vw);height:min(260px,68vw);position:relative}
.big .stage>div{position:absolute;inset:0}
.big .stage .white{filter:brightness(0) invert(1) drop-shadow(0 0 18px #fff)}
.big .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.big .flash.go{animation:flash 0.9s ease-out}
@keyframes flash{0%{opacity:0}10%{opacity:1}100%{opacity:0}}
.big .pop{animation:pop .7s cubic-bezier(.2,.9,.3,1.5)}
@keyframes pop{0%{transform:scale(.3)}100%{transform:scale(1)}}
.big .btn.primary{min-width:180px;font-size:17px}
.big .chest-big{width:min(220px,60vw);cursor:pointer}
.big .chest-big.shake{animation:shake .5s ease-in-out infinite}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
.big .chest-big .lid{transform-box:fill-box;transform-origin:0% 100%;transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.big .chest-big.open .lid{transform:rotate(-38deg) translate(-6px,-10px)}
.reward{font-family:var(--font-display);font-size:34px;font-weight:800;color:#FFD66B}

/* Accueil (premier lancement) */
.welcome{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;padding-top:16px}
.welcome h1{font-size:40px;letter-spacing:-1px}
.welcome .eggs{display:flex;justify-content:center;gap:4px}
.welcome .eggs .cr-wrap{width:100px;height:100px}
.welcome p{max-width:420px;margin:0}
.welcome ul{text-align:left;max-width:420px;margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.sync{display:flex;gap:10px;align-items:center}
.dot{width:12px;height:12px;border-radius:50%;flex:none;background:var(--muted)}
.dot.cloud{background:var(--mint)} .dot.local{background:var(--gold)} .dot.error{background:#E5484D}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700}
.switch button{width:54px;height:30px;border-radius:99px;background:var(--line);position:relative;flex:none}
.switch button::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch button.on{background:var(--mint)}
.switch button.on::after{left:27px}
.help{font-size:13.5px;line-height:1.5}
.help p{margin:0 0 8px}
/* Boutique d'accessoires */
.coin-pill{cursor:pointer}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.shop-item{display:flex;flex-direction:column;align-items:center;gap:5px;border-radius:16px;border:2px solid var(--line);background:var(--surface2);padding:8px 6px;font-size:12.5px;line-height:1.15;text-align:center}
.shop-item .mini{width:74px;height:74px}
.shop-item.on{border-color:var(--mint);background:color-mix(in srgb,var(--mint) 12%,var(--surface2))}
.shop-btn{border-radius:99px;padding:3px 10px;font-weight:800;font-size:12px;background:var(--surface);border:1.5px solid var(--line);display:inline-flex;align-items:center;gap:4px}
.shop-btn svg{width:14px;height:14px}
.shop-btn.buy{background:var(--gold-soft);border-color:var(--gold)}
.shop-btn.poor{opacity:.5}
.shop-btn.on{background:var(--mint);color:#fff;border-color:transparent}
.who{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.who button{flex:none;width:76px;border-radius:14px;border:2px solid var(--line);padding:4px 2px 6px;background:var(--surface2);font-size:11px;font-weight:800;display:flex;flex-direction:column;align-items:center;overflow:hidden}
.who button .mini{width:52px;height:52px}
.who button.on{border-color:var(--accent);background:var(--accent-soft)}
.dress-btn{padding:6px 14px;font-size:13px;border-radius:99px}
.dress-btn svg{width:15px;height:15px}
/* Plan du jour */
.plan{background:linear-gradient(135deg,var(--surface),color-mix(in srgb,var(--violet) 12%,var(--surface)))}
.plan-item{display:flex;align-items:center;gap:10px;border-radius:14px;padding:10px 12px;background:var(--surface);border:2px solid var(--line);text-align:left;width:100%}
.plan-item .pcue{display:block;font-size:12px;color:var(--muted);font-weight:700}
.plan-item .ptxt{flex:1;min-width:0;font-weight:800;overflow-wrap:anywhere}
.plan-item b{font-size:12px;color:var(--violet);flex:none}
.plan-item.done{border-color:var(--mint);background:color-mix(in srgb,var(--mint) 10%,var(--surface))}
.plan-item.done .ptxt{color:var(--muted)}
.stamp{flex:none;font-family:var(--font-display);font-weight:800;font-size:11px;color:var(--mint);border:2px solid var(--mint);border-radius:8px;padding:1px 6px;transform:rotate(-8deg);text-transform:uppercase;letter-spacing:.5px}
.pick-list{display:flex;flex-direction:column;gap:12px;max-height:46vh;overflow:auto}
.pick-goal{display:flex;flex-direction:column;gap:6px}
.pick-goal>span{font-weight:800;font-size:13px;color:var(--muted)}
.pick-goal .chips .chip.off{opacity:.42;box-shadow:none}
.cue-row{display:grid;grid-template-columns:1fr;gap:6px;border-radius:14px;background:var(--surface2);padding:10px}
.cue-row b{font-size:13.5px}
.cue-sugg{display:flex;flex-wrap:wrap;gap:6px}
.cue-sugg button{border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700;border:1.5px solid var(--line);background:var(--surface)}
/* Série en réparation */
.pill.streak.ember svg{animation:ember 1.2s ease-in-out infinite}
@keyframes ember{0%,100%{opacity:.35;transform:scale(.9)}50%{opacity:1;transform:scale(1.1)}}
.repair{border:2px dashed var(--orange);background:color-mix(in srgb,var(--orange) 10%,var(--surface));display:flex;gap:12px;align-items:center}
.repair .ri{width:40px;height:40px;flex:none}
.repair .ri svg{width:100%;height:100%;animation:ember 1.2s ease-in-out infinite}
/* Mesures (records réels) */
.metric{border-radius:16px;background:var(--surface2);padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.metric .mname{font-weight:800;min-width:0;overflow-wrap:anywhere}
.metric .mval{font-family:var(--font-display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;line-height:1}
.metric .mval small{font-size:13px;color:var(--muted);font-family:var(--font-body)}
.metric .tiny{grid-column:1/-1}
.metric svg.spark{grid-column:1/-1;width:100%;height:46px;display:block}
.metric .mbtns{grid-column:1/-1;display:flex;gap:6px}
.metric .mbtns .btn{padding:6px 12px;font-size:13px;border-radius:99px}
.hist{display:flex;flex-direction:column;gap:2px;max-height:30vh;overflow:auto;font-size:13px}
.hist div{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--line)}
.hist div span{flex:1;font-variant-numeric:tabular-nums}
/* Couche Plan : campagne, semaine, bilan */
.camp{--gc:var(--accent)}
.camp .final{font-family:var(--font-display);font-weight:800;font-size:17px;line-height:1.2;overflow-wrap:anywhere}
.camp .why{font-size:13px;color:var(--muted);font-style:italic;overflow-wrap:anywhere}
.camp .wk{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px}
.camp .wk .bar{flex:1}
.kr{border-radius:14px;background:var(--surface2);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.kr-head{display:flex;align-items:center;gap:8px}
.kr-head b{flex:1;min-width:0;overflow-wrap:anywhere}
.kr-type{font-size:11px;font-weight:800;border-radius:99px;padding:1px 8px;flex:none}
.kr-type.process{background:color-mix(in srgb,var(--mint) 18%,transparent);color:color-mix(in srgb,var(--mint) 60%,var(--ink))}
.kr-type.result{background:color-mix(in srgb,var(--gold) 22%,transparent);color:color-mix(in srgb,var(--gold) 45%,var(--ink))}
.rbar{position:relative;height:10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);overflow:visible}
.rbar>i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,var(--gc),color-mix(in srgb,var(--gc) 60%,#fff))}
.rbar>u{position:absolute;top:-4px;bottom:-4px;width:3px;border-radius:2px;background:var(--ink);opacity:.55}
.kr-btns{display:flex;gap:6px;flex-wrap:wrap}
.kr-btns .btn{padding:5px 12px;font-size:12.5px;border-radius:99px}
.wkc{background:linear-gradient(135deg,var(--surface),color-mix(in srgb,var(--sky) 10%,var(--surface)))}
.wk-item{display:grid;grid-template-columns:1fr auto auto;gap:4px 8px;align-items:center;border-radius:14px;background:var(--surface);border:2px solid var(--line);padding:9px 10px}
.wk-item.ok{border-color:var(--mint)}
.wk-item .wt{font-weight:800;min-width:0;overflow-wrap:anywhere;font-size:14px}
.wk-item .wt small{display:block;font-weight:700;font-size:11.5px;color:var(--muted)}
.wk-item .wn{font-family:var(--font-display);font-weight:800;font-variant-numeric:tabular-nums;font-size:15px}
.wk-item .rbar{grid-column:1/-1;--gc:var(--sky)}
.wk-item.ok .rbar{--gc:var(--mint)}
.wk-plus{width:34px;height:34px;border-radius:12px;background:var(--sky);color:#fff;display:grid;place-items:center;font-weight:800}
.wk-plus svg{width:18px;height:18px}
.wk-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.wk-foot .ifthen{flex-basis:100%;color:var(--muted);font-weight:700}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:5px;border-radius:99px;background:var(--line)}
.steps i.on{background:var(--accent)}
.rv-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.rv-row span{flex:1;min-width:0;overflow-wrap:anywhere}
.rv-row b{font-variant-numeric:tabular-nums}
.rv-row b.ok{color:var(--mint)}
.cand{border-radius:14px;border:2px solid var(--line);background:var(--surface2);padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.cand.on{border-color:var(--sky);background:color-mix(in srgb,var(--sky) 10%,var(--surface2))}
.cand-top{display:flex;align-items:center;gap:8px;text-align:left;font-weight:800;width:100%}
.cand-top .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;flex:none;background:var(--surface)}
.cand.on .cand-top .box{background:var(--sky);border-color:var(--sky);color:#fff}
.cand-top .box svg{width:14px;height:14px}
.cand-top span{flex:1;min-width:0;overflow-wrap:anywhere}
.range-row{display:grid;grid-template-columns:70px 20px 70px 1fr;gap:6px;align-items:center;font-size:13px}
.range-row input{padding:7px 8px;text-align:center}
.own{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.own button{border-radius:12px;border:2px solid var(--line);background:var(--surface2);padding:10px 0;font-weight:800;font-size:16px}
.own button.on{border-color:var(--accent);background:var(--accent-soft)}
.chips-s{display:flex;flex-wrap:wrap;gap:6px}
.chips-s button{border-radius:99px;padding:4px 11px;font-size:12.5px;font-weight:700;border:1.5px solid var(--line);background:var(--surface2)}
.chips-s button.on{border-color:var(--accent);background:var(--accent-soft)}
.hint{font-size:12.5px;color:var(--muted);border-left:3px solid var(--line);padding-left:8px}
.warn{font-size:13px;border-radius:12px;padding:8px 10px;background:color-mix(in srgb,var(--gold) 16%,var(--surface2));border:1.5px solid var(--gold)}
/* Objectif en pause (hibernation) */
.gcard.paused{flex-direction:row;align-items:center;gap:12px;padding:10px 14px;opacity:.92}
.gcard.paused::before{display:none}
.gcard.paused .cr-wrap{width:64px;height:64px}
.pause-badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;border-radius:99px;padding:2px 9px;background:color-mix(in srgb,var(--sky) 16%,transparent);color:color-mix(in srgb,var(--sky) 55%,var(--ink))}
.pause-banner{display:flex;align-items:center;gap:10px;border:2px dashed var(--sky);background:color-mix(in srgb,var(--sky) 8%,var(--surface))}
.pause-banner>div{flex:1;min-width:0}
/* Accueil épuré : carte « Aujourd'hui » */
.today{display:flex;flex-direction:column;gap:0;padding:6px 16px}
.today>.tsec{padding:12px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.today>.tsec:first-child{border-top:0}
.thead{display:flex;align-items:center;gap:8px}
.thead h3{font-size:16px;flex:1}
.thead .tiny{flex:none}
.tlink{font-weight:800;font-size:13px;color:var(--accent);padding:2px 4px}
.tline{display:flex;align-items:center;gap:10px}
.tline .grow{flex:1;min-width:0}
.btn.sm{padding:7px 14px;font-size:13px;border-radius:99px}
.qmini{display:flex;flex-direction:column;gap:4px}
.qmini .qrow{padding:2px 0;grid-template-columns:20px 1fr auto}
.qmini .qrow .chk{width:20px;height:20px;border-radius:7px}
.qmini .qtxt{font-weight:700;font-size:13.5px}
.chest-mini{display:flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px 3px 4px;font-weight:800;font-size:12px;border:1.5px solid var(--line);background:var(--surface2)}
.chest-mini svg{width:30px;height:25px}
.chest-mini.ready{border-color:var(--gold);background:var(--gold-soft);color:var(--orange);animation:chestReady 1.1s ease-in-out infinite}
.chest-mini:disabled{cursor:default}
.chest-mini.locked svg{filter:grayscale(.7);opacity:.7}
.trepair{display:flex;align-items:center;gap:8px;border-radius:12px;padding:8px 10px;background:color-mix(in srgb,var(--orange) 12%,var(--surface));border:1.5px dashed var(--orange);font-size:13px;font-weight:700}
.trepair svg{width:22px;height:22px;flex:none;animation:ember 1.2s ease-in-out infinite}
.goals-h{display:flex;align-items:center;margin-top:4px}
.goals-h h2{font-size:20px;flex:1}
.chip.more{background:var(--surface2);color:var(--muted);box-shadow:none;border:2px solid var(--line)}
/* Fiche épurée : onglets */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface);border-radius:16px;padding:4px;box-shadow:var(--shadow);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tabs button{border-radius:12px;padding:9px 4px;font-weight:800;font-size:14px;color:var(--muted)}
.tabs button.on{background:var(--accent-soft);color:var(--accent)}
.hero.compact .cr-wrap.lg{width:min(190px,50vw);height:min(190px,50vw)}
.hero-actions{display:flex;gap:8px;justify-content:center}
/* Check-list du jour */
.cklist{display:flex;flex-direction:column;gap:6px}
.ck{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border-radius:14px;padding:10px 12px;background:var(--surface2);border:2px solid var(--line);border-left:6px solid var(--dc);font-weight:800;font-size:14.5px;transition:transform .08s}
.ck:active{transform:scale(.98)}
.ck .ckbox{width:26px;height:26px;border-radius:9px;border:2.5px solid var(--dc);flex:none;display:grid;place-items:center;background:var(--surface)}
.ck .ckbox svg{width:16px;height:16px}
.ck .cktxt{flex:1;min-width:0;overflow-wrap:anywhere}
.ck .cktxt small{display:block;font-weight:700;font-size:12px;color:color-mix(in srgb,var(--ink) 70%,transparent)}
.ck b{font-size:12px;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.ck .rep{font-style:normal;font-size:11.5px;background:var(--dc);color:#fff;border-radius:8px;padding:1px 6px;margin-left:4px;vertical-align:1px}
.ck.done{background:color-mix(in srgb,var(--dc) 12%,var(--surface))}
.ck.done .ckbox{background:var(--dc);color:#fff}
.ck.done .cktxt>span{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:color-mix(in srgb,var(--dc) 70%,transparent);opacity:.75}
.ck.locked{opacity:.5}
.ck-row{display:flex;gap:6px;align-items:center}
.ck-row .ck{flex:1}
.dayline{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;color:var(--muted)}
.dayline .bar{flex:1;--gc:var(--mint)}
.dayline.full{color:var(--mint)}
.goal-done{display:flex;justify-content:center}
.goal-done .btn{border-color:var(--gold);background:var(--gold-soft)}
/* Accueil : blocs du jour et de la semaine, objectifs repliables */
.blk-h{font-size:12px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin:2px 0 -2px;display:flex;justify-content:space-between}
.fold{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none}
.fold svg{width:20px;height:20px;transition:transform .2s}
.fold.closed svg{transform:rotate(-90deg)}
.yest-link{display:block;margin:0 auto;font-weight:800;font-size:13px;color:var(--muted);text-decoration:underline;padding:6px}
.garden .gname{position:absolute;bottom:-13px;left:50%;transform:translateX(-50%);font-size:10.5px;font-weight:800;color:#2B2350;background:rgba(255,255,255,.85);border-radius:99px;padding:0 6px;white-space:nowrap;pointer-events:none}
/* Niveau de joueur */
.player{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px}
.player .plvl{background:var(--ink);color:var(--bg);border-radius:10px;padding:2px 9px;font-family:var(--font-display);flex:none}
.player .bar{flex:1;--gc:var(--gold)}
.player .tiny{flex:none}
/* Le jardin : toutes les créatures ensemble, ciel selon l'heure */
.garden{position:relative;height:170px;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);background:linear-gradient(var(--sky1),var(--sky2));--sky1:#8FD3FF;--sky2:#E3F6FF;--hill1:#7BD88F;--hill2:#4FC37A;--orb:#FFE07A}
.garden.t-dawn{--sky1:#FFB7A1;--sky2:#FFE9C7;--hill1:#8CD69A;--hill2:#58BE80;--orb:#FFD27A}
.garden.t-dusk{--sky1:#7A5BC9;--sky2:#FFAE8A;--hill1:#5FAF86;--hill2:#3F8F70;--orb:#FFB36B}
.garden.t-night{--sky1:#17173F;--sky2:#3B2F7A;--hill1:#2F6E66;--hill2:#235650;--orb:#F4F1D0}
.garden .orb{position:absolute;top:16px;right:30px;width:42px;height:42px;border-radius:50%;background:var(--orb);box-shadow:0 0 40px 10px color-mix(in srgb,var(--orb) 55%,transparent)}
.garden.t-night .orb{box-shadow:inset -11px -3px 0 0 #C9C4A6, 0 0 26px 4px rgba(244,241,208,.35)}
.garden.t-dusk .orb,.garden.t-dawn .orb{top:64px}
.garden .cloud{position:absolute;left:0;width:70px;height:20px;border-radius:99px;background:rgba(255,255,255,.8);animation:drift 60s linear infinite}
.garden .cloud::before{content:"";position:absolute;left:14px;top:-10px;width:28px;height:24px;border-radius:50%;background:inherit}
.garden .cloud::after{content:"";position:absolute;left:34px;top:-6px;width:22px;height:18px;border-radius:50%;background:inherit}
.garden.t-night .cloud{background:rgba(255,255,255,.18)}
@keyframes drift{from{transform:translateX(-90px)}to{transform:translateX(600px)}}
.garden .gstar{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:twinkle 2.6s ease-in-out infinite}
.garden .hills{position:absolute;left:0;bottom:0;width:100%;height:112px;display:block}
.garden .cr-wrap{position:absolute}
.garden .gtag{position:absolute;left:12px;top:10px;background:rgba(255,255,255,.85);color:#2B2350;border-radius:99px;padding:3px 10px;font-weight:800;font-size:12px}
/* Compteurs sur les actions */
.chip .cnt,.do-btn .cnt{font-style:normal;font-size:11.5px;background:rgba(0,0,0,.2);border-radius:8px;padding:1px 6px;flex:none;font-variant-numeric:tabular-nums}
.chip .cnt.ok,.do-btn .cnt.ok{background:rgba(255,255,255,.9);color:#1B7F5C}
/* Calendrier d'activité */
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--surface2);border:1px solid var(--line)}
.heat i.h1{background:color-mix(in srgb,var(--mint) 35%,var(--surface2));border-color:transparent}
.heat i.h2{background:color-mix(in srgb,var(--mint) 65%,var(--surface2));border-color:transparent}
.heat i.h3{background:var(--mint);border-color:transparent}
.heat i.hf{opacity:.25}
.heat i.today{outline:2px solid var(--ink);outline-offset:1px}
.heat-legend{display:flex;align-items:center;gap:4px;justify-content:flex-end;margin-top:8px}
.heat-legend i{width:12px;height:12px;border-radius:3px;background:var(--surface2);border:1px solid var(--line)}
.heat-legend i.h1{background:color-mix(in srgb,var(--mint) 35%,var(--surface2))}.heat-legend i.h2{background:color-mix(in srgb,var(--mint) 65%,var(--surface2))}.heat-legend i.h3{background:var(--mint)}
/* Effets visuels */
#amb{position:fixed;inset:0;z-index:-1;pointer-events:none}
.bar>i{position:relative;overflow:hidden}
.bar>i::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.6) 50%,transparent 70%);transform:translateX(-100%);animation:shimmer 3s ease-in-out infinite}
@keyframes shimmer{0%,45%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.bar.pulse{animation:barPulse .7s ease-out}
@keyframes barPulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--gc,var(--accent)) 80%,transparent);transform:scaleY(1.5)}40%{transform:scaleY(1)}100%{box-shadow:0 0 0 12px transparent}}
.shake{animation:shakeS .35s}
.shake-big{animation:shakeB .6s}
@keyframes shakeS{0%,100%{transform:none}25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-2px,1px)}}
@keyframes shakeB{0%,100%{transform:none}10%{transform:translate(-9px,4px) rotate(-.6deg)}25%{transform:translate(8px,-5px) rotate(.6deg)}40%{transform:translate(-7px,3px)}55%{transform:translate(6px,-3px)}70%{transform:translate(-3px,2px)}85%{transform:translate(2px,-1px)}}
.vflash{position:fixed;inset:0;pointer-events:none;z-index:69;background:radial-gradient(circle at 50% 50%, transparent 35%, var(--vc,#FFC233) 130%);opacity:0;animation:vflash .6s ease-out forwards}
@keyframes vflash{0%{opacity:0}18%{opacity:.95}100%{opacity:0}}
.music-btn{cursor:pointer}
.music-btn.off{opacity:.5}
.music-btn svg{color:var(--violet)}
input[type=range]{padding:0;border:0;background:transparent;accent-color:var(--accent);height:28px}
@media (prefers-reduced-motion: reduce){
  .cr *,.cr-root,.chest-btn.ready,.big .rays,.bar>i::after,.shake,.shake-big,.bar.pulse,.garden .cloud,.garden .gstar{animation:none !important}
}
</style>

<script>

const PLAN_ACH = new Set(["promise1", "promise25", "record1", "record10", "camp1", "review1", "review4", "week70", "kr1"]);
// Quêtes du jour : elles poussent vers les actions qui font avancer (rien au hasard)
const activeActions = st => st.goals.filter(g=>!g.paused).flatMap(g=>g.actions);

];
function questOf(q){ const m = q.make ? q.make(state) : {}; return {id:q.id, text:m.text||q.text, target:m.target||q.target, key:q.key}; }

/* ===================== Petits outils ===================== */
const $ = s=>document.querySelector(s);
const esc = s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = ()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const pick = a=>a[Math.floor(Math.random()*a.length)];
const pad = n=>String(n).padStart(2,'0');
// La journée commence à 4 h du matin : une action cochée à 1 h compte pour la veille
function gameNow(){ return new Date(Date.now() - 4*3600*1000); }
function dayKey(d){d=d||gameNow();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseDay(k){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);}
function daysBetween(a,b){return Math.round((parseDay(b)-parseDay(a))/864e5);}
function addDays(k,n){const d=parseDay(k);d.setDate(d.getDate()+n);return dayKey(d);}
function weekKey(){const d=gameNow();const wd=(d.getDay()+6)%7;d.setDate(d.getDate()-wd);return dayKey(d);}
function seeded(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19;}return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return (h>>>0)/4294967296;};}
function mix(a,b,t){const pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16);const r=Math.round(((pa>>16)&255)*(1-t)+((pb>>16)&255)*t),g=Math.round(((pa>>8)&255)*(1-t)+((pb>>8)&255)*t),bl=Math.round((pa&255)*(1-t)+(pb&255)*t);return '#'+((1<<24)|(r<<16)|(g<<8)|bl).toString(16).slice(1);}

const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ===================== Icônes ===================== */
const IC = {
  flame:'<svg viewBox="0 0 24 24"><path d="M12 2c1 4 5 5.5 5 11a5 5 0 0 1-10 0c0-2.6 1.3-4 2.4-5.2.3 1.5 1 2.4 2 2.7C11 7.8 11 5 12 2z" fill="#FF7A2F"/><path d="M12 12c.6 2 2.5 2.6 2.5 4.7a2.5 2.5 0 0 1-5 0c0-1.5.9-2.3 1.6-3 .2.6.5.9.9 1 0-1.1-.2-1.8 0-2.7z" fill="#FFD25E"/></svg>',

  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/></svg>',
  trophy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4M12 14v4M8 21h8M9 18h6"/></svg>',

/* ===================== Données & sauvegarde ===================== */
const LS_KEY = 'eclosion.save.v1';
function freshState(){
  return {v:1, started:false, goals:[], streak:{count:0,best:0,lastDay:null,jokers:1,jokerWeek:null,repair:null,lastRepair:null,carry:0},
    daily:null, achievements:{}, stats:{actions:0,crits:0,megas:0,milestones:0,evolutions:0,chests:0,pets:0,perks:0,xp:0,night:false,early:false},
    log:[], days:{}, coins:40, owned:[], actionsUpgrade:null, titlesUpgrade:null, plan:null, week:null, weeks:[], adjustLog:[], reviewSnooze:null, settings:{sound:true, music:true, musicVol:50, planTools:false, skillsSteps:false}, updatedAt:0};
}
function migrate(s){
  const f = freshState();
  if (!s || typeof s!=='object') return f;
  const o = Object.assign(f, s);
  o.streak = Object.assign(freshState().streak, s.streak||{});
  o.stats = Object.assign(freshState().stats, s.stats||{});
  o.settings = Object.assign(freshState().settings, s.settings||{});
  o.achievements = s.achievements||{};
  o.log = Array.isArray(s.log)?s.log:[];
  o.coins = typeof s.coins==='number' ? s.coins : 40;
  o.plan = s.plan && typeof s.plan==='object' ? s.plan : null;
  o.week = s.week && typeof s.week==='object' ? s.week : null;
  o.weeks = Array.isArray(s.weeks) ? s.weeks : [];
  o.adjustLog = Array.isArray(s.adjustLog) ? s.adjustLog : [];
  o.owned = Array.isArray(s.owned) ? s.owned : [];
  if (s.days && typeof s.days==='object') o.days = s.days;
  else { o.days = {}; o.log.forEach(l=>{ const k=dayKey(new Date(l.t)); const d=o.days[k]||(o.days[k]={n:0,xp:0}); d.n++; d.xp+=l.xp||0; }); }
  o.goals = (Array.isArray(s.goals)?s.goals:[]).map(g=>{
    const G = Object.assign({id:uid(),name:'Objectif',creature:'',species:'braise',color:COLORS[0],xp:0,legendary:false,sadNeed:0,createdAt:Date.now(),lastActive:null,skills:[],actions:[],milestones:[]}, g);
    if (!G.acc || typeof G.acc!=='object') G.acc = {};
    G.sadNeed = 0; // l'ancien malus de tristesse n'existe plus
    if (!G.comeback || typeof G.comeback!=='object') G.comeback = null;
    if (!G.campaign || typeof G.campaign!=='object') G.campaign = null;
    if (!G.paused || typeof G.paused!=='object') G.paused = null;
    if (typeof G.deadline!=='string') G.deadline = '';
    G.maxStage = Math.max(G.maxStage||0, (()=>{ const t=(G.curve&&G.curve.t)||[0,100,800,3000]; let s=0; for(let i=1;i<4;i++) if ((G.xp||0)>=t[i]) s=i; return s; })());
    G.pastCampaigns = Array.isArray(G.pastCampaigns) ? G.pastCampaigns : [];
    if (!G.migRelance){ G.actions.forEach(a=>{ if (a.name==='Relancer les candidatures de plus de 7 jours' && !(a.target>0)) a.target=1; }); G.migRelance=true; }
    G.metrics = (Array.isArray(G.metrics)?G.metrics:[]).map(m=>Object.assign({id:uid(),name:'Mesure',unit:'',dir:'up',entries:[],rewardWeek:null},m));
    G.skills = (G.skills||[]).map(k=>Object.assign({id:uid(),name:'Compétence',xp:0,parentId:null,unlockLevel:1,perks:[]},k));
    G.actions = (G.actions||[]).map(a=>Object.assign({id:uid(),name:'Action',diff:'moyen',skillId:null},a));
    G.milestones = (G.milestones||[]).map(m=>Object.assign({id:uid(),name:'Étape',size:'moyenne',skillId:null,done:false},m));
    return G;
  });
  return o;
}
function calibrateAll(st){ let n=0; st.goals.forEach(g=>{ if (!g.curve){ calibrate(g); n++; } }); if (n && st===state) persistLocal(); return n; }
function loadLocal(){ try{ const raw = localStorage.getItem(LS_KEY); return raw? migrate(JSON.parse(raw)) : null; }catch(e){ return null; } }
function persistLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }

let state = loadLocal() || freshState();

// Synchronisation entre appareils (base de données liée à ton compte Claude)
let docRef = null, syncStatus = 'pending', saveTimer = null, writing = false, writeAgain = false;
function setSync(s){ syncStatus = s; if (view==='settings') render(); }
function commit(){
  state.updatedAt = Date.now();
  persistLocal();
  scheduleRemote();
}
function scheduleRemote(){
  if (!docRef) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(pushRemote, 900);
}
async function pushRemote(){
  if (!docRef) return;
  if (writing){ writeAgain = true; return; }
  writing = true;
  try{
    await docRef.set({json: JSON.stringify(state), updatedAt: state.updatedAt});
    if (syncStatus!=='cloud') setSync('cloud');
  }catch(e){
    if (e && e.code==='unavailable'){ setTimeout(scheduleRemote, 1500+Math.random()*1500); }
    else setSync('error');
  }
  writing = false;
  if (writeAgain){ writeAgain = false; scheduleRemote(); }
}
async function initSync(){
  try{
    if (!window.claude || typeof window.claude.use!=='function'){ setSync('local'); return; }
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user){ setSync('local'); return; }
    const id = await user.id();
    if (!id){ setSync('local'); return; }
    docRef = db.doc('data/users/'+id+'/save');
    const t = setTimeout(()=>{ if (syncStatus==='pending') setSync('local'); }, 10000);
    docRef.onSnapshot(snap=>{
      clearTimeout(t);
      if (snap.metadata && snap.metadata.fromCache && !snap.exists) return;
      if (syncStatus!=='cloud') setSync('cloud');
      if (!snap.exists){ if (state.started) scheduleRemote(); return; }
      const b = snap.data();
      if (!b || typeof b.json!=='string') return;
      if ((b.updatedAt||0) > (state.updatedAt||0)){
        try{ state = migrate(JSON.parse(b.json)); calibrateAll(state); persistLocal(); ensureDay(); render(); }catch(e){}
      } else if ((b.updatedAt||0) < (state.updatedAt||0)){
        scheduleRemote();
      }
    }, err=>{ clearTimeout(t); setSync('error'); });
  }catch(e){ setSync('local'); }
}

/* ===================== Règles du jeu ===================== */
function stageTh(g){ return g.curve && Array.isArray(g.curve.t) ? g.curve.t : [0,100,800,3000]; }
function stageOf(g){ if (g.legendary) return 4; const t=stageTh(g); let s=0; for(let i=1;i<4;i++) if (g.xp>=t[i]) s=i; return Math.max(s, g.maxStage||0); }
// Rythme : en gardant ses habitudes (environ 3 jours sur 4), la créature devient Adulte vers l'échéance
const STAGE_FRAC = [0, 0.04, 0.30, 0.93];
function expectedDailyXp(g){
  const listed = g.actions.reduce((sum,a)=> sum + DIFF[a.diff].xp * (a.target>0 ? a.target/7 : 1), 0);
  if (!listed) return 60;
  const perfect = g.actions.filter(a=>!(a.target>0)).length>=2 ? 25*0.4 : 0;
  return (listed*1.24*1.15 + perfect) * 0.75 * 1.35; // critiques, série, journée complète, bonus de la semaine (mesuré par simulation), 3 jours sur 4
}
function calibrate(g){
  const s = Math.min(3, stageOf(g));
  if (s>=3){ g.curve = {at: dayKey(), t: stageTh(g).map((x,i)=> i<=3 ? Math.min(x, g.xp) : x)}; return; }
  const old = stageTh(g);
  const base = g.curve ? Math.min(old[s], g.xp) : g.xp;
  const days = g.deadline ? Math.max(21, daysBetween(dayKey(), g.deadline)) : 84;
  const T = expectedDailyXp(g)*days + Math.max(0, g.xp-base);
  const t = [0,0,0,0];
  for (let k=0;k<=s;k++) t[k] = s ? Math.round(base*k/s) : 0;
  t[s] = base;
  for (let k=s+1;k<4;k++) t[k] = Math.round(base + T*(STAGE_FRAC[k]-STAGE_FRAC[s])/(1-STAGE_FRAC[s]));
  g.curve = {at: dayKey(), t};
}
function eggP(g){ const t=stageTh(g); return Math.max(0, Math.min(1, g.xp / Math.max(1, t[1]))); }
function skillLevel(xp){ let lvl=1, need=40; xp=xp||0; while(xp>=need){ xp-=need; lvl++; need=40+20*(lvl-1);} return {lvl, cur:xp, need}; }
function getGoal(id){ return state.goals.find(g=>g.id===id); }
function getSkill(g,id){ return id? g.skills.find(s=>s.id===id) : null; }
function isLocked(g,sk){ if(!extrasOn() || !sk || !sk.parentId) return false; const p=getSkill(g,sk.parentId); if(!p) return false; return (sk.unlockLevel||1) > skillLevel(p.xp).lvl || isLocked(g,p); }
function daysInactive(g){ const last = g.lastActive || dayKey(new Date(g.createdAt||Date.now())); return Math.max(0, daysBetween(last, dayKey())); }
function moodOf(g){ if (g.paused && stageOf(g)>0) return 'sleep'; if (stageOf(g)===0) return 'happy'; const d=daysInactive(g); if (d>=7) return 'sleep'; if (d>=3) return 'sad'; if (d===2) return 'ok'; return 'happy'; }
function moodText(g){
  if (g.paused) return '';
  const m = moodOf(g), ok = comebackReady(g);
  if (m==='sleep') return ok ? `S'est endormi·e en t'attendant. Ta prochaine action la réveille : bonus de retrouvailles +50 % sur 3 actions.` : `S'est endormi·e en t'attendant. Une action pour la réveiller !`;
  if (m==='sad') return ok ? `Je t'attendais… Reviens : bonus de retrouvailles +30 % sur 2 actions.` : `Je t'attendais… Une action pour me rendre le sourire !`;
  if (m==='ok') return `Se demande où tu es passé·e…`;
  return '';
}
function stageProgress(g){
  const s = stageOf(g);
  if (s===4) return {pct:100, text:'Forme légendaire atteinte'};
  if (s===3) return {pct:100, text: extrasOn() ? `${g.xp} XP · valide l'étape finale pour la forme ultime` : `${g.xp} XP · touche « J’ai atteint mon objectif ! » quand c’est fait`};
  const t=stageTh(g), a=Math.min(t[s], g.xp), b=Math.max(t[s+1], a+1);
  return {pct: Math.max(0, Math.min(100, (g.xp-a)/(b-a)*100)), text:`${g.xp} / ${b} XP vers ${STAGES[s+1].name}`};
}
function creatureName(g){ return g.creature || SPECIES[g.species].name; }
function planOn(){ return !!(state.settings && state.settings.planTools); }
function extrasOn(){ return !!(state.settings && state.settings.skillsSteps); }
const EXTRA_ACH = new Set(['ms1','ms10','lvl5','lvl10','perk']);
// Niveau de joueur : toute l'XP gagnée, tous objectifs confondus
const TITLES = [[1,'Novice'],[3,'Apprenti'],[5,'Aventurier'],[8,'Éleveur'],[12,'Expert'],[16,'Champion'],[20,'Maître'],[30,'Légende']];
function playerLevel(){ let xp=state.stats.xp||0, lvl=1, need=150; while(xp>=need){ xp-=need; lvl++; need=150+75*(lvl-1); } let title='Novice'; TITLES.forEach(([l,t])=>{ if(lvl>=l) title=t; }); return {lvl, cur:xp, need, title}; }

// Suivi par jour (calendrier d'activité) et compteurs par action
function trackDay(xp, n, key){
  const k=key||dayKey(), d=state.days[k]||(state.days[k]={n:0,xp:0}); d.n+=n; d.xp+=xp;
  const keys=Object.keys(state.days); if (keys.length>130) keys.sort().slice(0,keys.length-130).forEach(x=>delete state.days[x]);
}
function todayCount(a){ return a.today && a.today.d>=dayKey() ? a.today.n : 0; }
function yesterdayKey(){ return addDays(dayKey(), -1); }
function yesterdayCount(a){ const y=yesterdayKey(); if (a.today && a.today.d===y) return a.today.n; if (a.prev && a.prev.d===y) return a.prev.n; return 0; }
function weekKeyOf(k){ const d=parseDay(k), wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd); return dayKey(d); }
function weekCount(a){ return a.week && a.week.k===weekKey() ? a.week.n : 0; }
function timeOfDay(){ const h=new Date().getHours(); return h<6?'night':h<9?'dawn':h<18?'day':h<21?'dusk':'night'; }

function ensureDay(){
  const today = dayKey(); let changed=false;
  const S = state.streak;
  const wk = weekKey();
  if (S.jokerWeek!==wk){ if (S.jokerWeek) S.jokers = Math.min(2, (S.jokers||0)+1); S.jokerWeek = wk; changed=true; }
  if (S.repair && today > S.repair.until){ breakStreak(); changed=true; }
  if (!S.repair && S.lastDay && S.count>0){
    const gap = daysBetween(S.lastDay, today);
    if (gap>=2){
      const missed = gap-1;
      const canRepair = !S.lastRepair || daysBetween(S.lastRepair, today)>=7;
      if (missed <= S.jokers){ S.jokers -= missed; S.jokerUse = {day: today, n: missed}; S.lastDay = addDays(today,-1); toast({icon:IC.shield, title:`Joker utilisé`, sub:`Ta série de ${S.count} jours est protégée.`, color:'var(--sky)'}); }
      else if (canRepair && missed <= S.jokers+1){
        // Réparation sous 48 h : les jokers couvrent ce qu'ils peuvent, la flamme devient une braise à rallumer
        S.jokers -= (missed-1);
        S.repair = {need:2, got:0, until: addDays(addDays(S.lastDay, missed), 2)};
        toast({icon:IC.flame, title:'Ta flamme est en braise', sub:'Fais 2 actions (ou 1 difficile) aujourd’hui ou demain pour la rallumer.', color:'var(--orange)', ms:5000});
      }
      else breakStreak();
      changed = true;
    }
  }
  if (!state.daily || state.daily.day!==today){ state.daily = makeDaily(today); changed=true; }
  if (fixDailyQuests()) changed=true;
  if (changed) commit();
}
// Remplace, dans les quêtes du jour déjà tirées, celles qui ne sont plus possibles (ex. outils de planification désactivés)
function fixDailyQuests(){
  const d=state.daily; if (!d || !d.quests) return false;
  let changed=false;
  const out = [];
  const keep = q=>{ const def = QUESTS.find(x=>x.id===q.id); return def && (!def.need || def.need(state)); };
  d.quests.forEach(q=>{
    if (keep(q)) { out.push(q); return; }
    const used = new Set([...out, ...d.quests.filter(keep)].map(x=>x.key));
    const alt = QUESTS.find(x=>!used.has(x.key) && (!x.need || x.need(state)));
    if (!alt) { out.push(q); return; }
    changed=true; out.push(questOf(alt));
  });
  d.quests = out;
  return changed;
}
function makeDaily(day){
  const rnd = seeded(day+'q');
  const pool = QUESTS.filter(q=>!q.need || q.need(state));

  const c=ac(), nowMs=Date.now();

  const first = chorus.count===0;
  chorus.last=nowMs; chorus.count++;
  const st=stageOf(g);
  const now=c?c.currentTime:0, t=c?quantize(now):0, delay=c?Math.max(0,(t-now)*1000):0;

function toast(o){
  const box = $('#toasts');
  const t = document.createElement('div'); t.className='toast'; if (o.color) t.style.setProperty('--tc', o.color);
  t.innerHTML = `${o.icon?`<div class="ti">${o.icon}</div>`:''}<div class="tt">${esc(o.title)}${o.sub?`<small>${esc(o.sub)}</small>`:''}</div>${o.action?`<button type="button">${esc(o.action)}</button>`:''}`;
  if (o.action) t.querySelector('button').onclick = ()=>{ o.onAction(); close(); };
  box.appendChild(t);
  while (box.children.length>3) box.firstChild.remove();
  let gone=false; function close(){ if(gone) return; gone=true; t.classList.add('out'); setTimeout(()=>t.remove(),300); }
  setTimeout(close, o.ms||3200);
  return close;
}

/* ===================== Annuler ===================== */
let undoSnap=null, undoClose=null;
function offerUndo(snap, label){
  undoSnap = snap; if (undoClose) undoClose();
  undoClose = toast({title:label, sub:'Validé', icon:IC.check.replace('currentColor','#22C38E'), color:'var(--mint)', action:'Annuler', ms:5000, onAction:()=>{ if(!undoSnap) return; state = migrate(JSON.parse(undoSnap)); undoSnap=null; sfx.undo(); commit(); render(); toast({title:'Action annulée', color:'var(--muted)'}); }});
}

let bigQ = Promise.resolve();
function queueBig(fn){ bigQ = bigQ.then(()=>new Promise(res=>fn(res))).catch(()=>{}); }
function evolveScene(g, from, to){
  queueBig(done=>{
    const el = document.createElement('div'); el.className='big';
    const oldS = creatureSVG(g.species, g.color, from, 'happy', 1), newS = creatureSVG(g.species, g.color, to, 'happy', 0, g.acc);
    el.innerHTML = `<div class="rays"></div><div class="flash"></div><h2>Quoi ? ${esc(creatureName(g))} ${from===0?'va éclore':'évolue'} !</h2><div class="stage"><div class="o">${oldS}</div><div class="n" hidden>${newS}</div></div><p class="desc">&nbsp;</p><button class="btn primary" type="button" hidden>Génial !</button>`;
    document.body.appendChild(el);
    const o=el.querySelector('.o'), n=el.querySelector('.n'), h=el.querySelector('h2'), p=el.querySelector('.desc'), b=el.querySelector('button'), fl=el.querySelector('.flash');
    let showNew=false, t=0, interval=reduceMotion?400:320;

      t+=interval; interval=Math.max(55, interval*.86); if (t<(reduceMotion?1200:2600)) setTimeout(flip, interval); else finish(); }
    function finish(){
      o.hidden=true; n.hidden=false; n.classList.remove('white'); n.classList.add('pop'); fl.classList.add('go'); el.classList.add('shine');
      sfx.evolve(); buzz([60,40,120]);
      const r = el.querySelector('.stage').getBoundingClientRect();
      confetti(r.left+r.width/2, r.top+r.height/2, 160, null, 1.4);
      setTimeout(()=>confetti(r.left+r.width/2, r.top+r.height/3, 90, ['#FFD66B','#FFFFFF','#FFC233'], 1.2), 500);
      const ex=r.left+r.width/2, ey=r.top+r.height/2;

function handleEvents(res, g){
  res.ev.forEach(e=>{
    if (!extrasOn() && (e.type==='level'||e.type==='perk'||e.type==='unlock')) return;
    if (e.type==='level'){ sfx.level(); stars(innerWidth/2, 50, 14, ['#7CF0C0','#FFFFFF','#FFF3B0'], 1.2); toast({icon:IC.up, title:`${e.sk.name} passe niveau ${e.lvl} !`, color:'var(--mint)'}); }
    if (e.type==='perk'){ toast({icon:IC.spark, title:`Capacité débloquée : ${e.perk.name}`, sub:`${e.sk.name} niv. ${e.perk.level}`, color:'var(--violet)', ms:4500}); }
    if (e.type==='unlock'){ toast({icon:IC.spark, title:`Nouvelle branche : ${e.sk.name}`, sub:`Débloquée grâce à ${e.parent.name}`, color:'var(--violet)', ms:4500}); }
    if (e.type==='evolve'){ evolveScene(g, e.from, e.to); }
  });
  if (res.comebackStart){ sfx.level(); toast({icon:IC.heart.replace('currentColor','#FF5D86'), title:`Tu es revenu·e ! ${creatureName(g)} saute de joie`, sub:`Bonus de retrouvailles +${res.cb} % sur tes ${res.cb===50?3:2} premières actions.`, color:'var(--accent)', ms:4500}); }
}
function checkAchievements(){

      state.achievements[id] = Date.now();
      addCoins(5);
      setTimeout(()=>{ sfx.achv(); toast({icon:IC.medal, title:`Succès : ${name}`, sub:desc+' · +5 éclats', color:'var(--gold)', ms:4200}); }, 450);
    }
  });
}
function logIt(g, label, xp, crit){ state.log.unshift({t:Date.now(), g:g?g.name:'', label, xp, crit}); if (state.log.length>150) state.log.length=150; }

function doAction(gid, aid, e, el){
  ensureDay();
  const g=getGoal(gid); if(!g) return; const a=g.actions.find(x=>x.id===aid); if(!a) return;

  if (res.crit===2){ sfx.mega(); buzz([40,30,40,30,120]); floatText(x,y,`+${res.xp} XP<small>MÉGA CRITIQUE ×5</small>`,'mega'); confetti(x,y,140,null,1.5); vflash('#FF5D86'); shake(true); ring(x,y,'#FF5D86',160,10); setTimeout(()=>ring(x,y,'#FFC233',220,8),120); stars(x,y,26,['#FFF3B0','#FF9BB8','#FFFFFF'],1.6); }
  else if (res.crit===1){ sfx.crit(); buzz([30,30,60]); floatText(x,y,`+${res.xp} XP<small>CRITIQUE ×2</small>`,'crit'); confetti(x,y,70,['#FFC233','#FFD66B','#FF8A5B','#FFFFFF'],1.1); vflash('#FFC233'); shake(false); ring(x,y,'#FFC233',120,8); stars(x,y,16,null,1.2); }
  else { sfx.pop(); buzz(20); floatText(x,y,`+${res.xp} XP${res.cb?`<small>+${res.cb} % retrouvailles</small>`:pItem?'<small>Promesse tenue +25 %</small>':''}`); confetti(x,y,14,null,.7); stars(x,y,6,null,.8); }
  if (newDay===true && state.streak.count>1) setTimeout(()=>toast({icon:IC.flame, title:`Série : ${state.streak.count} jours d'affilée !`, sub:`Bonus XP +${streakBonusPct()} %`, color:'var(--orange)'}), 300);
  streakFx(newDay);

  handleEvents(res, g);

  // La créature réagit quand tu progresses

    document.querySelectorAll(`.cr-wrap[data-g="${g.id}"]`).forEach(w=>{ animCreature(w,'tap-'+g.species,900); animCreature(w,'joy',1200); });
    toast({icon:IC.star, title:`Journée complète pour ${creatureName(g)} !`, sub:'Tout est coché. +25 XP et 5 éclats', color:'var(--mint)', ms:5000}); }, 700);
  offerUndo(snap, a.name);
  if (questsDone() && !state.daily.claimed && !wasDone){ setTimeout(()=>{ sfx.chest(); toast({icon:CHEST(), title:'Quête du jour terminée !', sub:'Ton coffre t’attend sur l’accueil.', color:'var(--gold)', ms:4500}); }, 700); }
  questsDone.__last = questsDone();
}
function doMilestone(gid, mid){
  const g=getGoal(gid); if(!g) return; const m=g.milestones.find(x=>x.id===mid); if(!m) return;
  if (m.done){ openMilestoneEditor(g, m); return; }
  const final = m.size==='finale';
  openSheet(`<h2>${final?'Étape finale':'Valider cette étape ?'}</h2>
    <p style="margin:0">« <b>${esc(m.name)}</b> »${final?`<br><span class="muted">C'est l'objectif accompli : ${esc(creatureName(g))} prendra sa forme légendaire.</span>`:''}</p>
    <p class="tiny" style="margin:0">+${MSIZE[m.size].xp} XP</p>
    <div class="sheet-actions"><button class="btn" data-x="close" type="button">Pas encore</button><button class="btn primary" id="msOk" type="button">Oui, c'est fait !</button></div>`, sh=>{
    sh.querySelector('#msOk').onclick = (e)=>{
      closeSheet(); ensureDay();
      const snap = JSON.stringify(state);
      const pl0 = playerLevel().lvl;
      const nd = touchStreak(2); setTimeout(()=>streakFx(nd), 900);
      const sk = getSkill(g, m.skillId);
      const res = grant(g, sk && !isLocked(g,sk) ? sk : null, MSIZE[m.size].xp, {crit:false, legendary: final});
      m.done = true; m.doneAt = Date.now(); m.gained = {xp:res.xp, skillId: sk?sk.id:null, skXp:res.skXp, parentId:res.parentId, parXp:res.parXp, wasLegendary:false};
      state.stats.milestones++; state.daily.c.milestones++; state.daily.c.xp += res.xp;
      const mCoins = ({petite:15,moyenne:30,grande:50,finale:100})[m.size]; addCoins(mCoins);
      if (!state.daily.c.goals.includes(g.id)) state.daily.c.goals.push(g.id);
      logIt(g, 'Étape : '+m.name, res.xp, 0);
      const [x,y] = [innerWidth/2, innerHeight/2];
      sfx.level(); setTimeout(()=>sfx.crit(),200); buzz([50,40,90]);
      floatText(x,y,`+${res.xp} XP<small>Étape franchie ! +${mCoins} éclats</small>`,'crit'); confetti(x,y,120,null,1.3);
      vflash('#FFC233'); shake(true); ring(x,y,'#FFC233',180,10); setTimeout(()=>ring(x,y,'#FF8A3D',240,7),150); stars(x,y,24,null,1.5); coins(x,y,24);
      trackDay(res.xp, 1);
      handleEvents(res, g); checkAchievements(); checkPlayerLevel(pl0); commit(); render(); offerUndo(snap, 'Étape : '+m.name);
    };
  });
}
function undoMilestone(g, m){
  const G = m.gained || {xp:0};
  g.xp = Math.max(0, g.xp - (G.xp||0)); state.stats.xp = Math.max(0, state.stats.xp-(G.xp||0));
  const sk=getSkill(g,G.skillId); if (sk) sk.xp=Math.max(0,sk.xp-(G.skXp||0));
  const p=getSkill(g,G.parentId); if (p) p.xp=Math.max(0,p.xp-(G.parXp||0));
  if (m.size==='finale' && !g.milestones.some(x=>x!==m && x.done && x.size==='finale')) g.legendary=false;
  m.done=false; delete m.doneAt; delete m.gained;
  state.stats.milestones = Math.max(0, state.stats.milestones-1);
}

  const r=wrap.getBoundingClientRect(), px=r.left+r.width/2, py=r.top+r.height*.5;

    if (st===0){ animCreature(wrap,'tap',700); ring(px,py+r.height*.1,g.color,r.width*.5,4); noteFx(px, r.top+r.height*.2, g.color, 1); }
    else {
      animCreature(wrap,'tap-'+g.species,900);

function openChest(){
  ensureDay();
  if (!questsDone() || state.daily.claimed) return;
  const snapGoals = state.goals.filter(g=>!g.legendary);
  const g = snapGoals.length? pick(snapGoals) : (state.goals.length? pick(state.goals): null);
  const xp = 50 + Math.round(Math.random()*30)*5;
  const joker = Math.random()<.35 && state.streak.jokers<3;
  queueBig(done=>{
    const el = document.createElement('div'); el.className='big';
    el.innerHTML = `<div class="rays"></div><div class="flash"></div><h2>Coffre du jour</h2><p>Touche le coffre pour l'ouvrir</p><div class="chest-big shake">${CHEST()}</div><div class="reward" hidden></div><p class="rdesc" hidden></p><button class="btn primary" type="button" hidden>Récupérer</button>`;
    document.body.appendChild(el);

      el.querySelector('p').hidden = true;
      sfx.chest(); buzz([40,30,100]);
      const r=ch.getBoundingClientRect(); confetti(r.left+r.width/2, r.top+r.height*.4, 110, ['#FFC233','#FFD66B','#FFF3B0','#FF8A5B','#FFFFFF'], 1.4);
      const kx=r.left+r.width/2, ky=r.top+r.height*.45;
      duckMusic(3); coins(kx,ky,45); stars(kx,ky,30,null,1.8); ring(kx,ky,'#FFD66B',220,10); setTimeout(()=>ring(kx,ky,'#FFFFFF',300,7),160); shake(true);
      let res=null;
      state.daily.claimed = true; state.stats.chests++;
      const pl0 = playerLevel().lvl;
      const gems = 10 + Math.floor(Math.random()*16); addCoins(gems);
      if (g){ trackDay(xp, 0); setTimeout(()=>{ checkPlayerLevel(pl0); commit(); }, 0); }
      if (g){ const before=stageOf(g); g.xp+=xp; state.stats.xp+=xp; const after=stageOf(g); res={ev: after>before?[{type:'evolve',g,from:before,to:after}]:[]}; if(after>before) state.stats.evolutions++; logIt(g,'Coffre du jour',xp,0); }
      if (joker) state.streak.jokers++;

      checkAchievements(); commit();
      b.onclick = ()=>{ el.remove(); render(); if (res && g) handleEvents(Object.assign({comforted:false},res), g); done(); };
    };
  });
}

function todayPlan(){ const p=state.plan; return p && p.date===dayKey() ? p : null; }
function planItemFor(gid, aid){ if (!planOn()) return null; const p=todayPlan(); return p ? p.items.find(it=>it.g===gid && it.a===aid && !it.done) : null; }

function openPlanEditor(){

  const CUES = ['mon café','le petit-déjeuner','le déjeuner','le travail','la salle','le dîner'];
  const body = ()=>{
    const cwk = curWeek(), inWk = (gid,aid)=> !!(cwk && cwk.items.some(it=>it.g===gid && it.actionId===aid));
    const groups = state.goals.filter(g=>!g.paused && g.actions.length).map(g=>`<div class="pick-goal"><span>${esc(g.name)}</span><div class="chips">${g.actions.map(a=>{ const on=sel.some(x=>x.g===g.id&&x.a===a.id); return `<button type="button" class="chip d-${a.diff} ${on?'':'off'}" data-pick="${g.id}|${a.id}"><span>${esc(a.name)}</span>${inWk(g.id,a.id)?'<b title="Engagement de la semaine">semaine</b>':''}${on?'<b>✓</b>':''}</button>`; }).join('')}</div></div>`).join('');

    return `<h2>Mes coups du jour</h2><p class="tiny" style="margin:0">Choisis 1 à 3 actions. Préciser <b>après quoi</b> tu les feras augmente nettement tes chances de passer à l’acte.</p>
      <div class="pick-list">${groups}</div>${cues}
      <div class="sheet-actions"><button class="btn" type="button" data-x="close">Annuler</button><button class="btn primary" type="button" id="planSave" ${sel.length?'':'disabled'}>C’est parti (${sel.length}/3)</button></div>`;
  };
  const readCues = sh=>sh.querySelectorAll('[data-cue]').forEach(inp=>{ if (sel[+inp.dataset.cue]) sel[+inp.dataset.cue].cue = inp.value.trim(); });
  openSheet(body(), sh=>{
    sh.addEventListener('click', e=>{
      const pk=e.target.closest('[data-pick]');
      if (pk){ readCues(sh); const [gid,aid]=pk.dataset.pick.split('|'); const i=sel.findIndex(x=>x.g===gid&&x.a===aid);
        if (i>=0) sel.splice(i,1); else if (sel.length<3) sel.push({g:gid,a:aid,cue:'',done:false}); else { toast({title:'3 actions maximum', sub:'Mieux vaut peu, mais tenu.', color:'var(--muted)'}); return; }
        redraw(sh, body()); return; }
      const sg=e.target.closest('[data-sugg]');
