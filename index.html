    });
  }, {sticky:true});
}
function fmtNum(v){ return (Math.round(v*100)/100).toLocaleString('fr-FR'); }
function metricBest(m, entries){ const es=entries||m.entries; if (!es.length) return null; return es.reduce((b,e)=> m.dir==='down' ? Math.min(b,e.v) : Math.max(b,e.v), es[0].v); }
function sparkline(m, color){
  const es=m.entries.slice(-14); if (es.length<2) return '';
  const vs=es.map(e=>e.v), lo=Math.min(...vs), hi=Math.max(...vs), span=(hi-lo)||1;
  const pts=es.map((e,i)=>[ (i/(es.length-1))*92+3, 40-((e.v-lo)/span)*32 ]);
  const line=pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' '), last=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 100 46" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts[0][0].toFixed(1)},44 ${line} ${last[0].toFixed(1)},44" fill="${color}" fill-opacity=".14" stroke="none"/><polyline points="${line}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path d="M${last[0]} ${last[1]} l0.01 0" stroke="${color}" stroke-width="8" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`;
}
function metricCard(g, m){
  const last = m.entries[m.entries.length-1], best = metricBest(m);
  const first = m.entries[0];
  const delta = (last && first && m.entries.length>1) ? last.v-first.v : 0;
  const good = m.dir==='down' ? delta<0 : delta>0;
  return `<div class="metric"><span class="mname">${esc(m.name)}</span><span class="mval">${last?fmtNum(last.v):'—'}<small> ${esc(m.unit)}</small></span>
    ${sparkline(m, g.color)}
    <span class="tiny">${last ? `Record : ${fmtNum(best)} ${esc(m.unit)} · ${m.entries.length} mesure${m.entries.length>1?'s':''}${delta&&good?` · ${delta>0?'+':''}${fmtNum(delta)} depuis le début`:''}` : 'Pas encore de mesure : note ton point de départ.'}</span>
    <div class="mbtns"><button type="button" class="btn primary" data-act="logMetric" data-g="${g.id}" data-m="${m.id}">${IC.plus} Noter</button><button type="button" class="btn" data-act="editMetric" data-g="${g.id}" data-m="${m.id}">${IC.pen}</button></div></div>`;
}
function openMetricEditor(g, m){

  const segs=()=>`<button type="button" data-dir="up" class="${dir==='up'?'on':''}">Plus haut = mieux<small>ex. charge, candidatures</small></button><button type="button" data-dir="down" class="${dir==='down'?'on':''}">Plus bas = mieux<small>ex. temps, hésitations</small></button>`;

    if (del) del.onclick=()=>deleteConfirm(sh,'cette mesure et son historique',()=>{ g.metrics=g.metrics.filter(x=>x.id!==m.id); commit(); closeSheet(); render(); });
  });

function openMetricLog(g, m){
  if (!m) return;
  const body=()=>{ const last=m.entries[m.entries.length-1];
    const hist=m.entries.slice().reverse().slice(0,20).map(e=>{ const idx=m.entries.indexOf(e); return `<div><span>${fmtNum(e.v)} ${esc(m.unit)}</span><span class="tiny">${new Date(e.t).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'})}</span><button type="button" class="icon-btn flat" data-delentry="${idx}" aria-label="Supprimer cette mesure">${IC.x}</button></div>`; }).join('');
    return `<h2>${esc(m.name)}</h2>
      <div class="field"><label for="mvVal">Valeur du jour${m.unit?` (${esc(m.unit)})`:''}</label><input id="mvVal" type="text" inputmode="decimal" autocomplete="off" placeholder="${last?fmtNum(last.v):'Ex. 60'}"></div>
      <div class="sheet-actions"><button class="btn" type="button" data-x="close">Fermer</button><button class="btn primary" type="button" id="mvSave">Noter</button></div>
      ${hist?`<div class="field"><span class="lbl">Historique</span><div class="hist">${hist}</div></div>`:''}`; };
  openSheet(body(), sh=>{
    sh.addEventListener('click', e=>{
      const de=e.target.closest('[data-delentry]');
      if (de){ m.entries.splice(+de.dataset.delentry,1); commit(); redraw(sh, body()); render(); return; }
      if (!e.target.closest('#mvSave')) return;
      const raw=sh.querySelector('#mvVal').value.replace(',','.'), v=parseFloat(raw);
      if (!isFinite(v)){ sh.querySelector('#mvVal').focus(); return; }
      const prevBest = metricBest(m);
      m.entries.push({t:Date.now(), v});
      const isRecord = prevBest!==null && (m.dir==='down' ? v<prevBest : v>prevBest);
      closeSheet();
      if (!isRecord){ commit(); render(); toast({title: prevBest===null?'Point de départ noté':'Mesure notée', sub: prevBest===null?'Bats-le pour décrocher ton premier record !':`Record actuel : ${fmtNum(prevBest)} ${m.unit}`, color:'var(--sky)'}); return; }
      ensureDay();
      const snap=JSON.stringify(state), pl0=playerLevel().lvl, wk=weekKey();
      state.stats.records=(state.stats.records||0)+1;
      let res=null;
      if (m.rewardWeek!==wk){ m.rewardWeek=wk; res=grant(g, null, 75, {crit:false}); addCoins(10); trackDay(res.xp,0); logIt(g,'Record : '+m.name,res.xp,0); state.daily.c.xp+=res.xp; }
      const x=innerWidth/2, y=innerHeight*.42;
      sfx.level(); setTimeout(()=>sfx.crit(),180); buzz([40,30,80]);
      floatText(x,y,`RECORD !<small>${fmtNum(v)} ${esc(m.unit)}${res?` · +${res.xp} XP · +10 éclats`:''}</small>`,'crit');
      confetti(x,y,110,['#FFC233','#FFD66B','#FFF3B0','#FF8A5B'],1.3); ring(x,y,'#FFC233',170,9); stars(x,y,22,null,1.5);
      if (res) handleEvents(res, g);
      checkAchievements(); checkPlayerLevel(pl0); commit(); render();
      document.querySelectorAll(`.cr-wrap[data-g="${g.id}"]`).forEach(w=>{ animCreature(w,'tap-'+g.species,900); animCreature(w,'joy',900); });
      if (!res) toast({title:'Nouveau record !', sub:'La récompense en XP est déjà prise cette semaine pour cette mesure, mais bravo !', color:'var(--gold)'});
      offerUndo(snap, 'Record : '+m.name);
    });
  });
}

/* ===================== Couche Plan : campagne, semaine, bilan ===================== */
function num(v){ const n=parseFloat(String(v).replace(',','.')); return isFinite(n)?n:null; }
function fmtDay(k){ return parseDay(k).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'}); }
function campaignStart(){ const d=new Date(), wd=(d.getDay()+6)%7; d.setDate(d.getDate() + (wd<=2 ? -wd : 7-wd)); return dayKey(d); } // lundi de cette semaine (lun-mer) ou lundi prochain
function campaignWeek(c){ const n=daysBetween(c.start, dayKey()); return n<0 ? 0 : Math.floor(n/7)+1; }
function campaignEnd(c){ return addDays(c.start, c.weeks*7-1); }
function krValue(g, kr){ if (kr.metricId){ const m=g.metrics.find(x=>x.id===kr.metricId); const e=m&&m.entries[m.entries.length-1]; return e?e.v:0; } return kr.value||0; }
function krStatus(g, kr){ const v=krValue(g,kr); return v>=kr.max ? 'over' : v>=kr.min ? 'ok' : 'no'; }
function rbar(v, min, max){ const top=Math.max(max, v, 1); return `<div class="rbar" aria-hidden="true"><i style="width:${Math.min(100, v/top*100)}%"></i><u style="left:calc(${Math.min(100,min/top*100)}% - 1px)"></u><u style="left:calc(${Math.min(100,max/top*100)}% - 2px)"></u></div>`; }
function curWeek(){ const w=state.week; return w && w.k===weekKey() ? w : null; }
function wkTarget(w, it){ return w.minimalMode ? 1 : Math.max(1, it.min||1); }
function weekRate(w){ if (!w || !w.items.length) return null; return w.items.reduce((a,it)=>a+Math.min(1,(it.count||0)/wkTarget(w,it)),0)/w.items.length; }
function weekHit(gid, aid){ if (!planOn()) return null; const w=curWeek(); if (!w) return null; let reached=null; w.items.forEach(it=>{ if (it.g===gid && it.actionId===aid){ const before=it.count||0; it.count=before+1; const eff=wkTarget(w,it); if (before<eff && it.count>=eff) reached=it; } }); return reached; }
function reviewDue(){ return state.goals.some(g=>!g.paused && (g.actions.length||g.campaign)) && !curWeek(); }

let weekOpen = (()=>{ try{ return localStorage.getItem('eclosion.weekOpen')==='1'; }catch(e){ return false; } })();
function simpleTodayCard(){
  const R = state.streak.repair;
  const repair = R ? `<div class="tsec"><div class="trepair">${IC.flame}<span>Rallume ta flamme : encore ${Math.max(0,R.need-(R.got||0))} action${R.need-(R.got||0)>1?'s':''} ${R.until===dayKey()?'aujourd’hui':'aujourd’hui ou demain'} (une difficile compte double).</span></div></div>` : '';
  return `<section class="card today">${repair}${questBox()}</section>`;
}
function todayCard(){
  if (!planOn()) return simpleTodayCard();
  const secs = [];
  // Braise à rallumer
  const R = state.streak.repair;
  const repair = R ? `<div class="trepair">${IC.flame}<span>Rallume ta flamme : encore ${Math.max(0,R.need-(R.got||0))} action${R.need-(R.got||0)>1?'s':''} ${R.until===dayKey()?'aujourd’hui':'aujourd’hui ou demain'} (une difficile compte double).</span></div>` : '';
  // Plan du jour
  const hasActions = state.goals.some(g=>!g.paused && g.actions.length);
  const p = todayPlan();
  if (hasActions && !(p && p.skipped)){
    if (!p) secs.push(`<div class="tsec">${repair}<div class="tline"><div class="grow"><h3 style="font-size:16px">Mes coups du jour</h3><span class="tiny">1 à 3 actions, +25 % d’XP chacune</span></div><button type="button" class="tlink" data-act="planSkip">Pas aujourd’hui</button><button type="button" class="btn primary sm" data-act="planOpen">Choisir</button></div></div>`);
    else {
      const done = p.items.filter(it=>it.done).length;
      const items = p.items.map((it,i)=>{ const g=getGoal(it.g), a=g&&g.actions.find(x=>x.id===it.a); if(!a) return '';
        return `<button type="button" class="plan-item ${it.done?'done':''}" data-act="planDo" data-i="${i}"><span class="ptxt">${it.cue?`<span class="pcue">Après ${esc(it.cue)}</span>`:''}${esc(a.name)}</span>${it.done?'<span class="stamp">Tenue</span>':`<b>+25 %</b>`}</button>`; }).join('');
      secs.push(`<div class="tsec">${repair}<div class="thead"><h3>Mes coups du jour</h3><span class="tiny">${done}/${p.items.length}</span><button type="button" class="icon-btn flat" data-act="planOpen" aria-label="Modifier mon plan">${IC.pen}</button></div>${items}</div>`);
    }
  } else if (repair) secs.push(`<div class="tsec">${repair}</div>`);
  // Quêtes
  secs.push(questBox());
  // Semaine
  if (reviewDue()){
    if (state.reviewSnooze!==dayKey()) secs.push(`<div class="tsec"><div class="tline"><div class="grow"><h3 style="font-size:16px">${state.week?'Bilan du lundi':'Ma semaine'}</h3><span class="tiny">2 min pour choisir tes engagements</span></div><button type="button" class="tlink" data-act="reviewLater">Plus tard</button><button type="button" class="btn primary sm" data-act="reviewOpen">${state.week?'Faire':'Planifier'}</button></div></div>`);
  } else {
    const w = curWeek();
    if (w && w.items.length){
      const rate = weekRate(w)||0, ok = w.items.filter(it=>(it.count||0)>=wkTarget(w,it)).length;
      secs.push(`<div class="tsec"><div class="thead"><h3>Ma semaine</h3><span class="tiny">${ok}/${w.items.length} tenus · ${Math.round(rate*100)} %</span><button type="button" class="tlink" data-act="wkToggle">${weekOpen?'Réduire':'Voir'}</button></div>
        <div class="bar small" style="--gc:var(--sky)"><i style="width:${Math.round(rate*100)}%"></i></div>
        ${weekOpen?weekCard():''}</div>`);
    }
  }
  return `<section class="card today">${secs.join('')}</section>`;
}
function weekCard(){
  if (false){
    if (state.reviewSnooze===dayKey()) return '';
    const first = !state.week;
    return `<section class="card wkc"><div class="section-h"><h2>${first?'Ma semaine':'Bilan du lundi'}</h2><span class="tiny">2 min</span></div>
      <p class="tiny" style="margin:0 0 10px">${first?'Choisis 1 à 3 engagements par objectif pour cette semaine, chacun avec une plage et une version minimale. Des objectifs proches font avancer plus sûrement qu’un but lointain.':'Regarde ta semaine passée, puis choisis tes engagements pour celle-ci. Sans aucune note rouge.'}</p>
      <div class="sheet-actions"><button type="button" class="btn" data-act="reviewLater">Plus tard</button><button type="button" class="btn primary" data-act="reviewOpen">${first?'Planifier ma semaine':'Faire mon bilan'}</button></div></section>`;
  }
  const w = curWeek(); if (!w || !w.items.length) return '';
  const rate = weekRate(w), ved = getGoal(w.vedette);
  const items = w.items.map(it=>{ const g=getGoal(it.g); if (!g) return ''; const eff=wkTarget(w,it), c=it.count||0, ok=c>=eff;
    return `<div class="wk-item ${ok?'ok':''}"><span class="wt">${esc(it.text)}<small>${esc(g.name)}${w.minimalMode&&it.minimal?' · min. : '+esc(it.minimal):''}</small></span><span class="wn">${c}<span class="tiny"> / ${w.minimalMode?1:(it.min===it.max?it.min:it.min+'–'+it.max)}</span></span>
      ${it.actionId?`<button type="button" class="icon-btn flat" data-act="wkAdjust" data-i="${it.id}" aria-label="Ajuster">${IC.pen}</button>`:`<button type="button" class="wk-plus" data-act="wkInc" data-i="${it.id}" aria-label="Ajouter 1">${IC.plus}</button>`}
      ${rbar(c, eff, w.minimalMode?1:Math.max(eff,it.max||eff))}
      ${it.actionId?'':`<span class="tiny" style="grid-column:1/-1"><button type="button" class="tiny" data-act="wkAdjust" data-i="${it.id}" style="text-decoration:underline">Ajuster</button></span>`}</div>`; }).join('');
  return `<div class="rows" style="margin-top:4px">${items}</div>
    <div class="wk-foot" style="margin-top:10px">${ved?`<span>Vedette : <b>${esc(creatureName(ved))}</b> (+15 % d’XP)</span>`:''}
      <button type="button" class="btn" style="padding:5px 12px;font-size:12.5px;border-radius:99px;margin-left:auto" data-act="wkMinimal">${w.minimalMode?'Revenir à la semaine normale':'Semaine difficile ? Mode minimal'}</button>
      ${w.ifthen&&w.ifthen.si?`<span class="ifthen">Si ${esc(w.ifthen.si)}, alors ${esc(w.ifthen.alors||'…')}</span>`:''}</div>`;
}

// Bilan du lundi : regarder, calibrer, choisir, vedette et si-alors
function openReview(){
  const prev = state.week && !curWeek() ? state.week : null;
  const prevRate = prev ? weekRate(prev) : null;
  const hist = state.weeks.slice(-4).map(x=>x.rate).filter(x=>x!==null);
  if (prevRate!==null) hist.push(prevRate);
  const recent = hist.slice(-4), avg = recent.length ? recent.reduce((a,b)=>a+b,0)/recent.length : null;
  const goals = state.goals.filter(g=>!g.paused && (g.actions.length||g.campaign));
  let step = prev ? 1 : 3, note = '', vedette = (prev && prev.vedette && getGoal(prev.vedette)) ? prev.vedette : (goals[0]||{}).id, si='', alors='';
  // Candidats : les actions de chaque objectif, pré-réglées d'après la semaine passée
  const sel = [];
  const prevItem = (gid, aid, text)=> prev && prev.items.find(it=>it.g===gid && (aid ? it.actionId===aid : it.text===text));
  const cands = {};
  goals.forEach(g=>{ cands[g.id] = g.actions.map(a=>{ const pi=prevItem(g.id,a.id); return {key:g.id+'|'+a.id, g:g.id, actionId:a.id, text:a.name, min: pi?pi.min:(a.target>0?Math.max(1,a.target-1):2), max: pi?pi.max:(a.target>0?a.target:3), minimal: pi?pi.minimal:'1 fois'}; });
    if (prev) prev.items.filter(it=>it.g===g.id && !it.actionId).forEach(it=>cands[g.id].push({key:g.id+'|free|'+it.text, g:g.id, actionId:null, text:it.text, min:it.min, max:it.max, minimal:it.minimal||''}));
  });
  if (prev) prev.items.forEach(it=>{ const c=(cands[it.g]||[]).find(c=>c.actionId ? c.actionId===it.actionId : c.text===it.text); if (c && !sel.includes(c)) sel.push(c); });
  const DK = 'review.'+weekKey();
  const dr = draftGet(DK);
  if (dr && dr.cands){
    step = dr.step || step; note = dr.note || ''; si = dr.si || ''; alors = dr.alors || '';
    if (dr.vedette && getGoal(dr.vedette)) vedette = dr.vedette;
    Object.keys(dr.cands).forEach(gid=>{ if (cands[gid]) cands[gid] = dr.cands[gid]; });
    sel.length = 0; (dr.selKeys||[]).forEach(k=>{ const c=Object.values(cands).flat().find(x=>x.key===k); if (c) sel.push(c); });
  }
  let finished = false;
  const saveDraft = ()=>{ if (!finished) draftSet(DK, {step, note, vedette, si, alors, cands, selKeys: sel.map(c=>c.key)}); };
  const STEPS = prev ? 4 : 2;
  const stepIdx = ()=> prev ? step : step-2;
  const readInputs = sh=>{
    const n=sh.querySelector('#rvNote'); if (n) note=n.value;
    sh.querySelectorAll('[data-cmin]').forEach(i=>{ const c=sel.find(x=>x.key===i.dataset.cmin); if (c){ const v=num(i.value); if (v!==null) c.min=Math.max(0,Math.round(v)); } });
    sh.querySelectorAll('[data-cmax]').forEach(i=>{ const c=sel.find(x=>x.key===i.dataset.cmax); if (c){ const v=num(i.value); if (v!==null) c.max=Math.max(0,Math.round(v)); } });
    sh.querySelectorAll('[data-cminimal]').forEach(i=>{ const c=sel.find(x=>x.key===i.dataset.cminimal); if (c) c.minimal=i.value.trim(); });
    const a=sh.querySelector('#rvSi'); if (a) si=a.value.trim(); const b=sh.querySelector('#rvAlors'); if (b) alors=b.value.trim();
  };
  const body = ()=>{
    const bar = `<div class="steps">${Array.from({length:STEPS},(_,i)=>`<i class="${i<stepIdx()?'on':''}"></i>`).join('')}</div>`;
    if (step===1){
      const rows = prev.items.map(it=>{ const g=getGoal(it.g), eff=wkTarget(prev,it), c=it.count||0; return `<div class="rv-row"><span>${esc(it.text)} <span class="tiny">· ${esc(g?g.name:'')}</span></span><b class="${c>=eff?'ok':''}">${c} / ${eff}${c>=eff?' ✓':''}</b></div>`; }).join('') || '<p class="tiny">Aucun engagement la semaine passée.</p>';
      const reward = prevRate===null ? '' : prevRate>=.999 ? 'Semaine tenue à 100 % : coffre de 30 éclats !' : prevRate>=.7 ? 'Semaine tenue : coffre de 20 éclats !' : 'Chaque engagement tenu compte. On ajuste et on repart.';
      return `${bar}<h2>Ta semaine passée</h2><div>${rows}</div>
        <p style="margin:0"><b>${prevRate===null?'':Math.round(prevRate*100)+' % tenu.'}</b> ${reward}</p>
        <div class="field"><label for="rvNote">Qu’est-ce qui a aidé, ou gêné ? (facultatif)</label><input id="rvNote" maxlength="120" placeholder="Une ligne suffit" value="${esc(note)}"></div>
        <div class="sheet-actions"><button class="btn" type="button" data-x="close">Plus tard</button><button class="btn primary" type="button" data-next>Suivant</button></div>`;
    }
    if (step===2){
      const msg = avg===null ? 'Pas encore assez d’historique. Vise des plages que tu tiens environ 3 semaines sur 4.'
        : avg>=.9 ? `Ces dernières semaines, tu tiens en moyenne ${Math.round(avg*100)} % de tes engagements. C’est peut-être un peu facile : tu peux monter d’un cran.`
        : avg<.6 ? `Ces dernières semaines, tu tiens en moyenne ${Math.round(avg*100)} % de tes engagements. Allège un peu : moins d’engagements ou des plages plus basses. Viser 70 à 80 % entretient la motivation.`
        : `Ces dernières semaines, tu tiens en moyenne ${Math.round(avg*100)} % de tes engagements. C’est la bonne zone (70 à 80 %) : garde la même charge.`;
      return `${bar}<h2>Calibrer</h2><p style="margin:0">${msg}</p><p class="hint">On surestime presque toujours ce qu’on fera. Ton propre historique est la meilleure boussole.</p>
        <div class="sheet-actions"><button class="btn" type="button" data-prev>Retour</button><button class="btn primary" type="button" data-next>Choisir mes engagements</button></div>`;
    }
    if (step===3){
      const blocks = goals.map(g=>{ const list = cands[g.id]||[]; const n=sel.filter(c=>c.g===g.id).length;
        return `<div class="field"><span class="lbl">${esc(g.name)} <span class="tiny">(${n}/3)</span></span>${list.map(c=>{ const on=sel.includes(c);
          return `<div class="cand ${on?'on':''}"><button type="button" class="cand-top" data-cand="${esc(c.key)}"><span class="box">${on?IC.check:''}</span><span>${esc(c.text)}</span></button>
            ${on?`<div class="range-row"><input aria-label="Minimum" inputmode="numeric" data-cmin="${esc(c.key)}" value="${c.min}"><span style="text-align:center">à</span><input aria-label="Maximum" inputmode="numeric" data-cmax="${esc(c.key)}" value="${c.max}"><span class="tiny">fois cette semaine</span></div>
            <input data-cminimal="${esc(c.key)}" maxlength="60" placeholder="Version minimale (ex. 1 relance de 5 min)" value="${esc(c.minimal||'')}">`:''}</div>`; }).join('')}
          <div class="range-row" style="grid-template-columns:1fr auto"><input data-free="${g.id}" maxlength="60" placeholder="Autre engagement, avec tes mots"><button type="button" class="btn" style="padding:7px 12px" data-addfree="${g.id}">Ajouter</button></div></div>`; }).join('');
      return `${bar}<h2>Tes engagements</h2><p class="tiny" style="margin:0">1 à 3 par objectif (10 au maximum). Une plage « 3 à 5 » : le bas est ton engagement, le haut ton défi. Les actions cochées se comptent toutes seules quand tu les valides.</p>
        ${blocks}
        <div class="sheet-actions">${prev?'<button class="btn" type="button" data-prev>Retour</button>':'<button class="btn" type="button" data-x="close">Plus tard</button>'}<button class="btn primary" type="button" data-next ${sel.length?'':'disabled'}>Suivant (${sel.length})</button></div>`;
    }
    const who = goals.map(g=>`<button type="button" data-ved="${g.id}" class="${g.id===vedette?'on':''}"><div class="mini">${creatureSVG(g.species,g.color,stageOf(g),'happy',eggP(g),g.acc)}</div>${esc(creatureName(g))}</button>`).join('');
    return `${bar}<h2>Vedette et plan de secours</h2>
      <div class="field"><span class="lbl">Quelle créature veux-tu pousser cette semaine ? (+15 % d’XP)</span><div class="who">${who}</div></div>
      <div class="field"><span class="lbl">Ton plan de secours pour l’obstacle le plus probable (facultatif)</span>
        <input id="rvSi" maxlength="80" placeholder="Si… (ex. je rentre épuisé)" value="${esc(si)}"><input id="rvAlors" maxlength="80" placeholder="alors je… (ex. fais la version minimale)" value="${esc(alors)}"></div>
      <div class="sheet-actions"><button class="btn" type="button" data-prev>Retour</button><button class="btn primary" type="button" id="rvSave">C’est parti !</button></div>`;
  };
  openSheet(body(), sh=>{
    sh.addEventListener('input', ()=>{ readInputs(sh); saveDraft(); });
    sh.addEventListener('click', ()=> setTimeout(saveDraft, 0));
    sh.addEventListener('click', e=>{
      const t=e.target;
      if (t.closest('[data-next]')){ readInputs(sh); step++; sh.innerHTML=body(); sh.scrollTop=0; return; }
      if (t.closest('[data-prev]')){ readInputs(sh); step--; sh.innerHTML=body(); sh.scrollTop=0; return; }
      const cd=t.closest('[data-cand]');
      if (cd){ readInputs(sh); const all=Object.values(cands).flat(); const c=all.find(x=>x.key===cd.dataset.cand); const i=sel.indexOf(c);
        if (i>=0) sel.splice(i,1);
        else if (sel.filter(x=>x.g===c.g).length>=3) toast({title:'3 engagements maximum par objectif', sub:'Mieux vaut peu, mais tenu.', color:'var(--muted)'});
        else if (sel.length>=10) toast({title:'10 engagements maximum', sub:'Garde de la place pour respirer.', color:'var(--muted)'});
        else sel.push(c);
        redraw(sh, body()); return; }
      const af=t.closest('[data-addfree]');
      if (af){ readInputs(sh); const inp=sh.querySelector(`[data-free="${af.dataset.addfree}"]`); const txt=inp&&inp.value.trim(); if (!txt) return;
        const c={key:af.dataset.addfree+'|free|'+txt+'|'+uid(), g:af.dataset.addfree, actionId:null, text:txt, min:1, max:2, minimal:''}; cands[c.g].push(c);
        if (sel.filter(x=>x.g===c.g).length<3 && sel.length<10) sel.push(c); redraw(sh, body()); return; }
      const vd=t.closest('[data-ved]'); if (vd){ readInputs(sh); vedette=vd.dataset.ved; redraw(sh, body()); return; }
      if (t.closest('#rvSave')){
        readInputs(sh); ensureDay(); finished = true; draftDel(DK);
        const pl0 = playerLevel().lvl;
        if (prev){
          state.weeks.push({k:prev.k, rate:prevRate, n:prev.items.length, note:note.slice(0,120)}); if (state.weeks.length>52) state.weeks.shift();
          if (prevRate!==null && prevRate>=.7){ addCoins(prevRate>=.999?30:20); state.stats.goodWeeks=(state.stats.goodWeeks||0)+1; }
        }
        state.week = {k:weekKey(), items: sel.map(c=>({id:uid(), g:c.g, actionId:c.actionId, text:c.text, min:Math.min(c.min,c.max), max:Math.max(c.min,c.max), minimal:c.minimal||'', count:0})), vedette, ifthen:{si, alors}, minimalMode:false};
        state.stats.reviews=(state.stats.reviews||0)+1;
        const vg = getGoal(vedette); let res=null;
        if (vg){ res = grant(vg, null, 25, {crit:false}); trackDay(res.xp,0); logIt(vg,'Bilan du lundi',res.xp,0); }
        closeSheet();
        sfx.chest(); confetti(innerWidth/2, innerHeight*.35, prev&&prevRate>=.7?120:50, null, 1.1);
        toast({icon:IC.star, title:'Ta semaine est prête', sub:`${state.week.items.length} engagement${state.week.items.length>1?'s':''}${res?` · +${res.xp} XP pour ${creatureName(vg)}`:''}`, color:'var(--sky)', ms:4500});
        if (res) handleEvents(res, vg);
        checkAchievements(); checkPlayerLevel(pl0); commit(); render();
      }
    });
  }, {sticky:true});
}

// Campagne de 12 semaines : objectif final, WOOP, résultats clés, propriété
function campaignSection(g){
  const c = g.campaign;
  if (!c) return `<section class="card camp" style="--gc:${g.color}"><div class="section-h"><h2>Campagne</h2><span class="tiny">12 semaines</span></div>
    <p class="tiny" style="margin:0 0 10px">Relie tes actions du jour à un résultat daté : ton objectif final, l’obstacle qui risque de t’arrêter, et 2 à 3 résultats clés à atteindre en 12 semaines. C’est toi qui écris tout.</p>
    <button type="button" class="btn primary block" data-act="campNew" data-g="${g.id}">Lancer ma campagne</button></section>`;
  const wk = campaignWeek(c), ended = wk>c.weeks;
  const krs = c.krs.map(kr=>{ const v=krValue(g,kr), st=krStatus(g,kr); const m=kr.metricId&&g.metrics.find(x=>x.id===kr.metricId);
    return `<div class="kr"><div class="kr-head"><b>${esc(kr.name)}</b><span class="kr-type ${kr.type}">${kr.type==='process'?'processus':'résultat'}</span></div>
      ${rbar(v, kr.min, kr.max)}
      <span class="tiny">${fmtNum(v)} ${esc(kr.unit||'')} · objectif ${fmtNum(kr.min)} à ${fmtNum(kr.max)}${st==='over'?' · dépassé !':st==='ok'?' · atteint ✓':''}${m?` · suit la mesure « ${esc(m.name)} »`:''}</span>
      <div class="kr-btns">${m?'':`<button type="button" class="btn primary" data-act="krUpdate" data-g="${g.id}" data-k="${kr.id}">Mettre à jour</button>`}<button type="button" class="btn" data-act="krAdjust" data-g="${g.id}" data-k="${kr.id}">Ajuster</button></div></div>`; }).join('');
  return `<section class="card camp" style="--gc:${g.color}"><div class="section-h"><h2>Campagne</h2><button type="button" class="icon-btn flat" data-act="campEdit" data-g="${g.id}" aria-label="Modifier la campagne">${IC.pen}</button></div>
    <div class="rows">
      <div class="final">${esc(c.final.text)}${c.final.date?` <span class="tiny">· d’ici le ${fmtDay(c.final.date)}</span>`:''}</div>
      ${c.final.why?`<div class="why">Pourquoi : ${esc(c.final.why)}</div>`:''}
      <div class="wk">${wk===0?`Commence le ${fmtDay(c.start)}`:ended?'Campagne terminée':`Semaine ${wk}/${c.weeks}`}<div class="bar small"><i style="width:${Math.min(100,Math.max(0,wk-(ended?0:1))/c.weeks*100)}%"></i></div><span class="tiny">fin ${fmtDay(campaignEnd(c))}</span></div>
      ${krs}
      ${c.woop&&c.woop.obstacle?`<p class="hint" style="margin:0">Si ${esc(c.woop.obstacle)}, alors ${esc(c.woop.plan||'…')}</p>`:''}
      ${ended?`<button type="button" class="btn primary block" data-act="campReview" data-g="${g.id}">Faire le bilan de campagne</button>`:''}
    </div></section>`;
}
function openCampaignEditor(g, editing){
  const c0 = editing && g.campaign ? JSON.parse(JSON.stringify(g.campaign)) : null;
  const d = c0 || {start: campaignStart(), weeks:12, final:{text:'', date:'', why:''}, woop:{best:'', obstacle:'', plan:''}, own:0,
    krs:[{id:uid(), name:'', type:'process', min:'', max:'', unit:'', metricId:null, value:0},{id:uid(), name:'', type:'process', min:'', max:'', unit:'', metricId:null, value:0}]};
  if (!d.final.date) d.final.date = campaignEnd(d);
  let step = 1, err = '';
  const CK = 'camp.'+g.id;
  if (!editing){ const dr=draftGet(CK); if (dr && dr.d){ Object.assign(d, dr.d); step = dr.step||1; } }
  let finished = false;
  const saveDraft = ()=>{ if (!editing && !finished) draftSet(CK, {d, step}); };
  const read = sh=>{
    const v = id=>{ const el=sh.querySelector('#'+id); return el? el.value.trim() : null; };
    if (step===1){ d.final.text=v('cfText'); d.final.date=v('cfDate')||d.final.date; d.final.why=v('cfWhy'); }
    if (step===2){ d.woop.best=v('cwBest'); d.woop.obstacle=v('cwObs'); d.woop.plan=v('cwPlan'); }
    if (step===3) d.krs.forEach((kr,i)=>{ kr.name=v('krn'+i); const mn=num(v('krmin'+i)), mx=num(v('krmax'+i)); kr.min = mn===null?'':mn; kr.max = mx===null?'':mx; kr.unit=v('kru'+i); const ms=sh.querySelector('#krm'+i); kr.metricId = ms && ms.value ? ms.value : null; });
  };
  const body = ()=>{
    const bar = `<div class="steps">${[1,2,3,4].map(i=>`<i class="${i<=step?'on':''}"></i>`).join('')}</div>`;
    const errHtml = err?`<p class="warn" style="margin:0">${esc(err)}</p>`:'';
    if (step===1) return `${bar}<h2>Ton objectif final</h2><p class="tiny" style="margin:0">Écris-le avec tes mots : un résultat qu’on peut constater, et une date. C’est l’étape finale qui rendra ${esc(creatureName(g))} légendaire.</p>
      <div class="field"><label for="cfText">Objectif final</label><textarea id="cfText" maxlength="160" style="min-height:70px;font-family:inherit;font-size:15px" placeholder="Ex. Promesse d’embauche signée pour le poste que je vise">${esc(d.final.text)}</textarea></div>
      <div class="field"><label for="cfDate">Pour quand ?</label><input id="cfDate" type="date" value="${esc(d.final.date)}"></div>
      <div class="field"><label for="cfWhy">Pourquoi ça compte pour toi ?</label><input id="cfWhy" maxlength="140" placeholder="Avec tes mots" value="${esc(d.final.why)}"></div>
      ${errHtml}<div class="sheet-actions"><button class="btn" type="button" data-x="close">Annuler</button><button class="btn primary" type="button" data-next>Suivant</button></div>`;
    if (step===2) return `${bar}<h2>Meilleur résultat et obstacle</h2><p class="tiny" style="margin:0">Imagine d’abord le meilleur résultat, puis ce qui, <b>en toi</b>, risque de t’arrêter. Enfin, prévois ta parade.</p>
      <div class="field"><label for="cwBest">Le meilleur résultat, ce que tu ressentiras</label><input id="cwBest" maxlength="140" placeholder="Avec tes mots" value="${esc(d.woop.best)}"></div>
      <div class="field"><label for="cwObs">Si… (l’obstacle intérieur le plus probable)</label><input id="cwObs" maxlength="100" placeholder="Ex. je repousse quand je suis fatigué" value="${esc(d.woop.obstacle)}"></div>
      <div class="field"><label for="cwPlan">…alors je (ta parade)</label><input id="cwPlan" maxlength="100" placeholder="Ex. je fais juste la version minimale" value="${esc(d.woop.plan)}"></div>
      ${errHtml}<div class="sheet-actions"><button class="btn" type="button" data-prev>Retour</button><button class="btn primary" type="button" data-next>Suivant</button></div>`;
    if (step===3){
      const mopts = sel=> `<option value="">Je mets à jour moi-même</option>` + g.metrics.map(m=>`<option value="${m.id}" ${m.id===sel?'selected':''}>Suivre la mesure « ${esc(m.name)} »</option>`).join('');
      const rows = d.krs.map((kr,i)=>`<div class="kr"><div class="kr-head"><b>Résultat clé ${i+1}</b>${d.krs.length>1?`<button type="button" class="icon-btn flat" data-krdel="${i}" aria-label="Retirer">${IC.x}</button>`:''}</div>
        <input id="krn${i}" maxlength="70" placeholder="${i===0?'Ex. Candidatures ciblées envoyées':'Ex. Séances faites'}" value="${esc(kr.name)}">
        <div class="chips-s"><button type="button" data-krtype="${i}|process" class="${kr.type==='process'?'on':''}">Processus : dépend de moi</button><button type="button" data-krtype="${i}|result" class="${kr.type==='result'?'on':''}">Résultat : dépend en partie des autres</button></div>
        <div class="range-row"><input id="krmin${i}" inputmode="decimal" placeholder="min" value="${kr.min}"><span style="text-align:center">à</span><input id="krmax${i}" inputmode="decimal" placeholder="max" value="${kr.max}"><input id="kru${i}" maxlength="12" placeholder="unité" value="${esc(kr.unit||'')}"></div>
        ${g.metrics.length?`<select id="krm${i}">${mopts(kr.metricId)}</select>`:''}</div>`).join('');
      return `${bar}<h2>Tes résultats clés</h2><p class="tiny" style="margin:0">2 à 3 résultats à atteindre en 12 semaines, en plage : le bas est ton engagement, le haut ton défi. Au moins un doit dépendre de toi (processus), et au plus un des autres (résultat).</p>
        ${rows}${d.krs.length<3?'<button type="button" class="add-row" data-kradd>'+IC.plus+' Ajouter un résultat clé</button>':''}
        ${errHtml}<div class="sheet-actions"><button class="btn" type="button" data-prev>Retour</button><button class="btn primary" type="button" data-next>Suivant</button></div>`;
    }
    return `${bar}<h2>Est-ce vraiment ton objectif ?</h2><p style="margin:0">« ${esc(d.final.text)} »</p>
      <div class="field"><span class="lbl">De 1 à 5, à quel point c’est le tien ?</span><div class="own">${[1,2,3,4,5].map(n=>`<button type="button" data-own="${n}" class="${d.own===n?'on':''}">${n}</button>`).join('')}</div></div>
      ${d.own && d.own<=3?`<p class="warn" style="margin:0">On s’engage vraiment quand l’objectif nous ressemble. Prends une minute pour le reformuler avec tes mots, ou valide-le tel quel si tu es sûr de toi.</p>`:''}
      <div class="sheet-actions"><button class="btn" type="button" data-prev>${d.own && d.own<=3?'Reformuler':'Retour'}</button><button class="btn primary" type="button" id="cSave" ${d.own?'':'disabled'}>${editing?'Enregistrer':'Lancer la campagne'}</button></div>`;
  };
  const validate = ()=>{
    if (step===1 && !d.final.text) return 'Écris ton objectif final, même en quelques mots.';
    if (step===3){
      const krs = d.krs.filter(k=>k.name);
      if (krs.length<1) return 'Donne un nom à au moins un résultat clé.';
      if (krs.some(k=>k.min==='' || k.max==='')) return 'Indique une plage (minimum et maximum) pour chaque résultat clé.';
      if (!krs.some(k=>k.type==='process')) return 'Au moins un résultat clé doit dépendre de toi (processus).';
      if (krs.filter(k=>k.type==='result').length>1) return 'Garde au plus un résultat qui dépend des autres : les autres doivent dépendre de toi.';
    }
    return '';
  };
  openSheet(body(), sh=>{
    sh.addEventListener('input', ()=>{ read(sh); saveDraft(); });
    sh.addEventListener('click', ()=> setTimeout(saveDraft, 0));
    sh.addEventListener('click', e=>{
      const t=e.target;

/* ===================== Cocher une action oubliée hier ===================== */
function yesterdayStreak(){
  const S=state.streak, today=dayKey(), y=addDays(today,-1), actedToday = S.lastDay===today;
  // Série cassée ce matin parce qu'hier manquait : on la restaure (et on compte aujourd'hui si déjà actif)
  if (S.broken && S.broken.day===today && S.broken.lastDay===addDays(y,-1)){
    S.count = S.broken.prev + 1 + (actedToday?1:0); S.lastDay = actedToday?today:y; S.carry=0; S.broken=null; S.best=Math.max(S.best,S.count); return;
  }
  // Flamme en braise pour hier : hier est rempli, et aujourd'hui compte si une action a déjà été faite
  if (S.repair){ const todayToo = (S.repair.got||0)>0 || actedToday; S.repair=null; S.count += 1 + (todayToo?1:0); S.lastDay = todayToo?today:y; S.best=Math.max(S.best,S.count); return; }
  // Flamme déjà rallumée aujourd'hui pour le jour d'hier : hier compte en plus
  if (S.repairedDay===y && actedToday){ S.count++; S.repairedDay=null; S.best=Math.max(S.best,S.count); return; }
  // Joker dépensé ce matin pour hier : on le rend
  if (S.jokerUse && S.jokerUse.day===today && S.lastDay && S.lastDay>=y){ S.jokers++; S.jokerUse=null; return; }
  if (actedToday && S.count===1){ S.count=2; S.best=Math.max(S.best,2); return; }
  if (S.lastDay && S.lastDay>=y) return;
  S.count = (S.lastDay===addDays(y,-1) && S.count>0) ? S.count+1 : 1; S.lastDay=y; S.best=Math.max(S.best,S.count);
}
function doYesterday(gid, aid){
  const g=getGoal(gid); if(!g) return; const a=g.actions.find(x=>x.id===aid); if(!a || yesterdayCount(a)>0) return;
  const y=yesterdayKey(), pl0=playerLevel().lvl;
  const sk = getSkill(g, a.skillId);
  const res = grant(g, sk && !isLocked(g,sk) ? sk : null, DIFF[a.diff].xp, {crit:false});
  if (a.today && a.today.d===y) a.today.n++;
  else if (a.today && a.today.d>y) a.prev={d:y, n:1};
  else { if (a.today) a.prev={d:a.today.d, n:a.today.n}; a.today={d:y, n:1}; }
  if (weekKeyOf(y)===weekKey()){
    if (!a.week || a.week.k!==weekKey()) a.week={k:weekKey(), n:0, done:false};
    a.week.n++;
    if (a.target>0 && !a.week.done && a.week.n>=a.target){ a.week.done=true; addCoins(10); const b=grant(g, sk, 60, {crit:false}); res.ev.push(...b.ev); }
  }
  state.stats.actions++; trackDay(res.xp, 1, y); logIt(g, a.name+' (hier)', res.xp, 0);
  yesterdayStreak();
  sfx.pop(); handleEvents(res, g); checkAchievements(); checkPlayerLevel(pl0); commit();
  const sh=document.querySelector('#sheetBg .sheet'); if (sh) redraw(sh, yesterdayBody());
  render();
  toast({icon:IC.check.replace('currentColor','#22C38E'), title:'Coché pour hier', sub:`${a.name} · +${res.xp} XP`, color:'var(--mint)'});
}
function yesterdayBody(){
  const goals = state.goals.filter(g=>!g.paused && g.actions.length);
  return `<h2>Oublié de cocher hier ?</h2><p class="tiny" style="margin:0">Coche ce que tu as fait hier. Chaque action ne peut être cochée qu’une fois pour hier.</p>
    ${goals.map(g=>`<div class="field"><span class="lbl">${esc(g.name)}</span><div class="cklist">${g.actions.map(a=>{ const done=yesterdayCount(a)>0;

function playerRow(){ const p=playerLevel(); return `<div class="player"><span class="plvl">Niv. ${p.lvl}</span><span>${p.title}</span><div class="bar small"><i style="width:${p.cur/p.need*100}%"></i></div><span class="tiny">${p.cur}/${p.need}</span></div>`; }
function heatmap(){
  const today=dayKey(), wd=(new Date().getDay()+6)%7, start=addDays(today, -(11*7+wd));
  let cells='', active=0;
  for(let i=0;i<84;i++){ const k=addDays(start,i), fut=k>today, d=state.days[k], n=d?d.n:0; if(n) active++;
    cells += `<i class="${fut?'hf':n===0?'':n<3?'h1':n<6?'h2':'h3'}${k===today?' today':''}" title="${k} : ${n} action${n>1?'s':''}"></i>`; }
  return {html:`<div class="heat">${cells}</div><div class="heat-legend tiny">moins <i></i><i class="h1"></i><i class="h2"></i><i class="h3"></i> plus</div>`, active};
}
// Les 3 actions les plus utiles : celles de la semaine et du plan d'abord, puis les plus utilisées
function topActions(g){
  const w=curWeek(), p=todayPlan();
  const score = a => (w && w.items.some(it=>it.g===g.id && it.actionId===a.id) ? 100 : 0) + (p && p.items.some(it=>it.g===g.id && it.a===a.id && !it.done) ? 50 : 0) + weekCount(a)*2 + todayCount(a);
  return g.actions.map((a,i)=>({a,i,s:score(a)})).sort((x,y)=> y.s-x.s || x.i-y.i).slice(0,3).map(x=>x.a);
}

function skillTree(g, parentId){
  const list = g.skills.filter(s=>(s.parentId||null)===(parentId||null) || (!parentId && s.parentId && !getSkill(g,s.parentId)));
  return list.map(s=>{
    const L=skillLevel(s.xp), locked=isLocked(g,s), par=getSkill(g,s.parentId);
    const perks=(s.perks||[]).map(p=>{ const on=L.lvl>=p.level && !locked; return `<li class="${on?'on':''}">${on?IC.star:IC.lock}Niv. ${p.level} · ${esc(p.name)}</li>`; }).join('');
    const kids = g.skills.some(c=>c.parentId===s.id) ? `<div class="sk-children">${skillTree(g,s.id)}</div>` : '';
    return `<div class="skill ${locked?'locked':''}">
      <div class="sk-head"><span class="lvl">${locked?'🔒':'Niv. '+L.lvl}</span><b>${esc(s.name)}</b><button type="button" class="icon-btn flat" data-act="editSkill" data-g="${g.id}" data-s="${s.id}" aria-label="Modifier">${IC.pen}</button></div>
      ${locked?`<div class="tiny">Se débloque au niveau ${s.unlockLevel} de ${esc(par?par.name:'')}</div>`:`<div class="bar small"><i style="width:${L.cur/L.need*100}%"></i></div><div class="tiny">${L.cur} / ${L.need} XP vers niv. ${L.lvl+1}</div>`}
      ${perks?`<ul class="perks">${perks}</ul>`:''}
      ${kids}
    </div>`;
  }).join('');
}

async function doExport(){
  const json = JSON.stringify(state, null, 1);
  const name = 'eclosion-sauvegarde-'+dayKey()+'.json';
  try{
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if (dl){ await dl.save({filename:name, data:json}); toast({title:'Sauvegarde exportée', color:'var(--mint)'}); return; }
  }catch(err){ if (err && err.code==='declined') return; }
  // Version autonome (fichier ouvert directement) : téléchargement classique
  if (!window.claude){ try{ const u=URL.createObjectURL(new Blob([json],{type:'application/json'})); const l=document.createElement('a'); l.href=u; l.download=name; document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(u),2000); toast({title:'Sauvegarde téléchargée', color:'var(--mint)'}); return; }catch(e){} }
  const box = $('#exportBox'); if(!box) return;
  box.innerHTML = `<div class="field"><span class="lbl">Copie ce texte et garde-le précieusement</span><textarea id="expTxt" readonly></textarea><button type="button" class="btn" id="cpy">Copier</button></div>`;
  const ta=$('#expTxt'); ta.value=json;
  $('#cpy').onclick = ()=>{ navigator.clipboard && navigator.clipboard.writeText(json).then(()=>toast({title:'Copié !',color:'var(--mint)'}), ()=>{ ta.select(); }); if(!navigator.clipboard) ta.select(); };
}
function doImport(){
  const file = $('#impFile').files[0], txt = $('#impTxt').value.trim(), zone=$('#impZone');

    let data; try{ data = JSON.parse(raw); }catch(e){ zone.innerHTML='<p class="mood">Ce fichier n’est pas une sauvegarde valide (format JSON attendu).</p>'; return; }
    if (!data || !Array.isArray(data.goals)){ zone.innerHTML='<p class="mood">Sauvegarde invalide : aucun objectif trouvé.</p>'; return; }
    zone.innerHTML = `<div class="confirm-box"><b>Remplacer tes données actuelles par cette sauvegarde (${data.goals.length} objectif${data.goals.length>1?'s':''}) ?</b><div class="sheet-actions"><button class="btn" type="button" id="impNo">Non</button><button class="btn danger" type="button" id="impYes">Oui, remplacer</button></div></div>`;

  if (file){ const r=new FileReader(); r.onload=()=>apply(r.result); r.readAsText(file); }

  else zone.innerHTML='<p class="tiny">Choisis un fichier ou colle le contenu d’une sauvegarde.</p>';

function openShop(gid){
  let sel = gid || ((state.goals.find(g=>stageOf(g)>0) || state.goals[0] || {}).id);
  const body = ()=>{
    const g=getGoal(sel), st=g?stageOf(g):0, coins=state.coins||0;
    const who = state.goals.map(x=>`<button type="button" data-who="${x.id}" class="${x.id===sel?'on':''}"><div class="mini">${creatureSVG(x.species,x.color,stageOf(x),'happy',x.xp/100,x.acc)}</div>${esc(creatureName(x))}</button>`).join('');
    const items = Object.keys(ACC).map(id=>{
      const it=ACC[id], owned=(state.owned||[]).includes(id), on=!!(g && g.acc && g.acc[it.slot]===id);
      const prev = g ? creatureSVG(g.species, g.color, Math.max(1,st), 'happy', 0, {[it.slot]:id}) : '';
      const btn = owned ? `<span class="shop-btn ${on?'on':''}">${on?'Porté ✓':'Équiper'}</span>` : `<span class="shop-btn buy ${coins>=it.price?'':'poor'}">${IC.coin}${it.price}</span>`;
      return `<button type="button" class="shop-item ${on?'on':''}" data-item="${id}"><div class="mini">${prev}</div><b>${it.name}</b>${btn}</button>`;
    }).join('');
    return `<div class="section-h"><h2>Boutique</h2><span class="pill">${IC.coin}${coins}</span></div>
      <p class="tiny" style="margin:0">Tu gagnes des éclats avec les coffres, les étapes, les succès, tes objectifs de la semaine et tes niveaux. Un accessoire acheté peut être porté par toutes tes créatures.</p>
      ${state.goals.length?`<div class="field"><span class="lbl">Pour qui ?</span><div class="who">${who}</div></div>`:'<p class="mood" style="margin:0">Crée d’abord un objectif pour avoir une créature à habiller.</p>'}
      ${g&&st===0?'<p class="mood" style="margin:0">Cet œuf doit d’abord éclore pour porter un accessoire. Tu peux déjà acheter pour plus tard.</p>':''}
      <div class="shop-grid">${items}</div>
      <button class="btn block" data-x="close" type="button">Fermer</button>`;
  };
  openSheet(body(), sh=>{
    sh.addEventListener('click', e=>{
      const w=e.target.closest('[data-who]'); if (w){ sel=w.dataset.who; redraw(sh, body()); return; }
      const el=e.target.closest('[data-item]'); if (!el) return;
      const id=el.dataset.item, it=ACC[id], g=getGoal(sel);
      state.owned = state.owned||[];
      if (!state.owned.includes(id)){
        if ((state.coins||0) < it.price){ toast({icon:IC.coin, title:'Pas assez d’éclats', sub:`Il t'en manque ${it.price-(state.coins||0)}.`, color:'var(--muted)'}); return; }
        state.coins -= it.price; state.owned.push(id);
        if (g && stageOf(g)>0){ g.acc=g.acc||{}; g.acc[it.slot]=id; }
        const r=el.getBoundingClientRect(); sfx.chest(); confetti(r.left+r.width/2, r.top+r.height/2, 50, null, .9); stars(r.left+r.width/2, r.top+r.height/2, 12, null, 1.2);
      } else {
        if (!g) return;
        if (stageOf(g)===0){ toast({icon:IC.egg, title:'Pas encore éclos', sub:'Cet œuf ne peut pas encore porter d’accessoire.', color:'var(--muted)'}); return; }
        g.acc=g.acc||{};
        if (g.acc[it.slot]===id) delete g.acc[it.slot]; else g.acc[it.slot]=id;
        sfx.boop();
      }
      commit(); redraw(sh, body()); render();
    });
  });
}

let ptr=null, ptrT=0, lookRaf=0;
function inView(w){ const r=w.getBoundingClientRect(); return r.bottom>0 && r.top<innerHeight && r.width>0; }
function onPtr(e){ ptr={x:e.clientX,y:e.clientY}; ptrT=Date.now(); if(!lookRaf) lookRaf=requestAnimationFrame(updateLooks); }
function updateLooks(){
  lookRaf=0; if(!ptr) return;
  document.querySelectorAll('.cr-wrap .cr-look').forEach(L=>{
    const w=L.closest('.cr-wrap'); if(!inView(w)) return;
    const r=w.getBoundingClientRect(), dx=ptr.x-(r.left+r.width/2), dy=ptr.y-(r.top+r.height*.5), d=Math.hypot(dx,dy)||1, m=Math.min(1,d/160)*3.6;

  });
}

function lookAround(w){
  if (Date.now()-ptrT < 2500) return;
  const L=w.querySelector('.cr-look'); if(!L) return;
  const s = Math.random()<.5?-1:1;
  L.style.transform=`translate(${3.4*s}px,0)`;
  setTimeout(()=>{ L.style.transform=`translate(${-3*s}px,-1px)`; }, 700);
  setTimeout(()=>{ L.style.transform=''; }, 1500);
}
// Comportements au repos : regarder autour, sautiller, faire son petit numéro, émettre des particules
setInterval(()=>{
  if (document.hidden || reduceMotion || document.querySelector('.big')) return;
  document.querySelectorAll('.cr-wrap[data-sp]').forEach(w=>{
    if (!inView(w)) return;
    const st=+w.dataset.st, mood=w.dataset.mood;
    if (st===0 || mood==='sleep') return;
    if (Math.random() < (w.classList.contains('lg')?.6:.25)) ambientFx(w);
    if (Math.random() < .07){
      const r=Math.random();
      if (r<.45) lookAround(w);
      else if (r<.75 && mood!=='sad'){ animCreature(w,'idle-hop',650); animCreature(w,'joy',700); }
      else if (mood!=='sad'){ animCreature(w,'tap-'+w.dataset.sp,900); const rr=w.getBoundingClientRect(); speciesFx(w.dataset.sp, rr.left+rr.width/2, rr.top+rr.height/2, 4, w.dataset.col, mood); }
    }
  });
}, 900);

/* ===================== Démarrage ===================== */
calibrateAll(state);
if (state.started) ensureDay();
render();
initSync();
})();
</script>

<script>
// Fonctionnement hors connexion + installation comme une vraie app
if ('serviceWorker' in navigator) window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
// Demande au navigateur de ne jamais effacer la sauvegarde
document.addEventListener('click', function once(){ document.removeEventListener('click', once); try{ if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){} });
// Bouton « Installer l'app » (Android et ordinateur)
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  if (document.getElementById('installBtn')) return;
  var b = document.createElement('button'); b.id = 'installBtn'; b.type = 'button'; b.textContent = "Installer l'app";
  b.onclick = function(){ b.remove(); e.prompt(); };
  document.body.appendChild(b);
});
window.addEventListener('appinstalled', function(){ var b=document.getElementById('installBtn'); if (b) b.remove(); });
</script>
