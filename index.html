<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3EFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Éclosion">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}
#installBtn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;border:0;border-radius:99px;padding:12px 20px;font:800 15px "Nunito",system-ui,sans-serif;background:#FF5D86;color:#fff;box-shadow:0 6px 20px rgba(70,45,140,.3);cursor:pointer}</style>
<title>Éclosion</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout : une colonne d'app mobile (max 560px) centrée, barre d'onglets fixe en bas, feuilles modales qui montent du bas. */
:root{
  --bg:#F3EFFF; --bg-glow1:#FFE3EC; --bg-glow2:#DDF3FF;
  --surface:#FFFFFF; --surface2:#F6F2FF; --line:#E7E0FA;
  --ink:#2B2350; --muted:#6F6893;
  --accent:#FF5D86; --accent-soft:#FFE4EC; --on-accent:#FFFFFF;
  --gold:#FFB52E; --gold-soft:#FFF1D2; --mint:#22C38E; --sky:#3F8CFF; --violet:#9B6BFF; --orange:#FF8A3D;
  --shadow:0 8px 24px rgba(70,45,140,.10), 0 1px 2px rgba(70,45,140,.08);
  --font-display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --font-body:"Nunito", "Segoe UI", system-ui, sans-serif;
  --r:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16122A; --bg-glow1:#2B1838; --bg-glow2:#13243A;
  --surface:#231D3F; --surface2:#2C2550; --line:#3A3266;
  --ink:#F4F0FF; --muted:#ABA3D1;
  --accent:#FF7298; --accent-soft:#4A2440; --on-accent:#FFFFFF;
  --gold:#FFC24D; --gold-soft:#4A3A1A; --mint:#38D9A2; --sky:#69A6FF; --violet:#B08CFF; --orange:#FF9A55;
  --shadow:0 8px 24px rgba(0,0,0,.35), 0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#16122A; --bg-glow1:#2B1838; --bg-glow2:#13243A;
  --surface:#231D3F; --surface2:#2C2550; --line:#3A3266;
  --ink:#F4F0FF; --muted:#ABA3D1;
  --accent:#FF7298; --accent-soft:#4A2440; --on-accent:#FFFFFF;
  --gold:#FFC24D; --gold-soft:#4A3A1A; --mint:#38D9A2; --sky:#69A6FF; --violet:#B08CFF; --orange:#FF9A55;
  --shadow:0 8px 24px rgba(0,0,0,.35), 0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{min-height:100%}
body{
  background:var(--bg);
  background-image:radial-gradient(60vmax 50vmax at 0% 0%, var(--bg-glow1), transparent 60%),radial-gradient(60vmax 50vmax at 100% 30%, var(--bg-glow2), transparent 60%);
  background-attachment:fixed;
  color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.45;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface2);border:2px solid var(--line);border-radius:14px;padding:10px 12px;width:100%}
textarea{min-height:110px;resize:vertical;font-size:12px;font-family:ui-monospace,monospace}
h1,h2,h3{font-family:var(--font-display);line-height:1.1;margin:0;text-wrap:balance}
.app{max-width:560px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:10px calc(96px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.top{display:flex;align-items:center;gap:10px;padding-top:6px}
.brand{font-family:var(--font-display);font-weight:800;font-size:24px;letter-spacing:-.5px;flex:1;display:flex;align-items:center;gap:6px}
.brand svg{width:30px;height:30px}
.top h1{flex:1;font-size:22px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pills{display:flex;gap:5px}
.pill{display:inline-flex;align-items:center;gap:4px;background:var(--surface);box-shadow:var(--shadow);border-radius:999px;padding:5px 9px 5px 7px;font-weight:800;font-variant-numeric:tabular-nums}
.pill svg{width:18px;height:18px}
.pill.streak.off{opacity:.55}
.icon-btn{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);flex:none}
.icon-btn svg{width:20px;height:20px}
.icon-btn.flat{box-shadow:none;background:transparent;width:34px;height:34px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:16px;padding:12px 18px;font-weight:800;background:var(--surface2);border:2px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent;box-shadow:0 4px 0 color-mix(in srgb, var(--accent) 70%, #000)}
.btn.primary:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb, var(--accent) 70%, #000)}
.btn.danger{color:#fff;background:#E5484D;border-color:transparent}
.btn.block{width:100%}
.btn svg{width:18px;height:18px}
.muted{color:var(--muted)}
.tiny{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gc,var(--accent)),color-mix(in srgb,var(--gc,var(--accent)) 60%, #fff));transition:width .6s cubic-bezier(.2,.9,.3,1.2)}
.bar.small{height:7px}
.section-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.section-h h2{font-size:20px;flex:1}
.section-h{flex-wrap:wrap}
.section-h .tiny{flex:0 1 auto;min-width:0;text-align:right}

/* Quête du jour */
.quest{background:linear-gradient(135deg,var(--surface),var(--gold-soft))}
.qrow{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:8px;padding:5px 0}
.qrow .chk{width:22px;height:22px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;background:var(--surface)}
.qrow.done .chk{background:var(--mint);border-color:var(--mint);color:#fff}
.qrow.done .qtxt{text-decoration:line-through;color:var(--muted)}
.qrow .chk svg{width:14px;height:14px}
.qtxt{font-weight:700;min-width:0}
.quest-body{display:flex;gap:12px;align-items:center}
.quest-list{flex:1;min-width:0}
.chest-btn{width:86px;flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;font-size:12px;border-radius:16px;padding:6px 4px}
.chest-btn svg{width:70px;height:58px}
.chest-btn.ready{animation:chestReady 1.1s ease-in-out infinite;background:var(--gold-soft)}
.chest-btn.ready .chest-lbl{color:var(--orange)}
.chest-btn:disabled{cursor:default}
.chest-btn.locked svg{filter:grayscale(.7);opacity:.7}
@keyframes chestReady{0%,100%{transform:rotate(0) scale(1)}20%{transform:rotate(-6deg) scale(1.06)}40%{transform:rotate(6deg) scale(1.06)}60%{transform:rotate(0) scale(1)}}

/* Cartes objectifs */
.gcard{--gc:var(--accent);background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.gcard::before{content:"";position:absolute;inset:0 0 auto 0;height:96px;background:radial-gradient(120px 90px at 56px 50px, color-mix(in srgb,var(--gc) 26%, transparent), transparent 70%);pointer-events:none}
.gtop{display:flex;gap:12px;align-items:center;position:relative}
.ginfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;text-align:left;cursor:pointer}
.ginfo h3{font-size:18px}
.sub{font-size:13px;font-weight:700;color:var(--muted)}
.stage-badge{display:inline-block;padding:1px 8px;border-radius:99px;background:color-mix(in srgb,var(--gc) 18%, transparent);color:color-mix(in srgb,var(--gc) 70%, var(--ink));font-weight:800;font-size:12px}
.mood{font-size:12.5px;font-weight:700;color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;border-radius:14px;padding:9px 12px;font-weight:800;font-size:14px;color:#fff;background:var(--dc);box-shadow:0 3px 0 color-mix(in srgb,var(--dc) 65%, #000);transition:transform .08s;max-width:100%;text-align:left}
.chip span{min-width:0;overflow-wrap:anywhere}
.chip b{background:rgba(255,255,255,.25);border-radius:8px;padding:1px 6px;font-size:12px;flex:none;font-variant-numeric:tabular-nums}
.chip:active{transform:translateY(3px);box-shadow:0 0 0 transparent}
.chip.locked{background:var(--surface2);color:var(--muted);box-shadow:none;border:2px dashed var(--line)}
.chip.locked svg{width:14px;height:14px}
.d-facile{--dc:var(--mint)} .d-moyen{--dc:var(--sky)} .d-difficile{--dc:var(--orange)} .d-epique{--dc:var(--violet)}
.add-goal{border:3px dashed var(--line);border-radius:var(--r);padding:18px;font-weight:800;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px;background:color-mix(in srgb,var(--surface) 50%, transparent)}
.add-goal svg{width:20px;height:20px}
.empty{text-align:center;padding:14px;color:var(--muted)}

/* Créatures */
.cr-wrap{position:relative;flex:none;cursor:pointer;touch-action:manipulation}
.cr-wrap.sm{width:92px;height:92px}
.cr-wrap.md{width:120px;height:120px}
.cr-wrap.lg{width:min(250px,64vw);height:min(250px,64vw);margin:0 auto}
.cr{width:100%;height:100%;display:block;overflow:visible}
.cr-root{transform-box:fill-box;transform-origin:50% 100%}
.cr-root.tap{animation:crTap .65s cubic-bezier(.3,.7,.4,1.4)}
@keyframes crTap{0%{transform:none}18%{transform:scale(1.12,.84)}45%{transform:translateY(-16px) scale(.94,1.08)}72%{transform:scale(1.05,.95)}100%{transform:none}}
.cr-breathe{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(.985,1.035)}}
.cr-eyes{transform-box:fill-box;transform-origin:50% 50%;animation:blink 4.8s infinite}
@keyframes blink{0%,91%,97%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
.cr-sway{transform-box:view-box;animation:sway 2.6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.cr-wobble{transform-box:fill-box;transform-origin:50% 100%;animation:wobble 3.4s ease-in-out infinite}
.cr-wobble.fast{animation-duration:1.6s}
@keyframes wobble{0%,55%,100%{transform:rotate(0)}65%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}85%{transform:rotate(-3deg)}}
.cr-aura{transform-box:fill-box;transform-origin:50% 50%;animation:aura 2.8s ease-in-out infinite}
@keyframes aura{0%,100%{opacity:.75;transform:scale(.96)}50%{opacity:1;transform:scale(1.04)}}
.cr-rays{transform-box:view-box;animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cr-twinkle{transform-box:fill-box;transform-origin:50% 50%;animation:twinkle 1.8s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(.2);opacity:.2}50%{transform:scale(1);opacity:1}}
.cr-wing{transform-box:view-box;animation:flap 1.4s ease-in-out infinite}
@keyframes flap{0%,100%{transform:rotate(0)}50%{transform:rotate(var(--fl,10deg))}}
.cr-tear{animation:tear 2.2s ease-in infinite}
@keyframes tear{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(14px);opacity:0}}
.cr-z{animation:zz 2.6s ease-out infinite;font-family:var(--font-display);font-weight:800}
@keyframes zz{0%{transform:translate(0,0);opacity:0}20%{opacity:1}100%{transform:translate(10px,-22px);opacity:0}}
.cr.sad{filter:saturate(.6)}
.cr.sleep{filter:saturate(.35) brightness(.95)}
/* Personnalité de chaque espèce : façon de bouger au repos */
.cr-move{transform-box:fill-box;transform-origin:50% 100%}
.m-braise{animation:mBraise 3.4s ease-in-out infinite}
@keyframes mBraise{0%,60%,100%{transform:none}66%{transform:scale(1.07,.9)}75%{transform:translateY(-13px) scale(.95,1.06)}83%{transform:none}87%{transform:scale(1.05,.95)}92%{transform:none}}
.m-nuage{animation:mNuage 4.2s ease-in-out infinite}
@keyframes mNuage{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(2deg)}}
.m-pousse{animation:mPousse 2.6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes mPousse{0%,100%{transform:rotate(-5deg)}25%{transform:rotate(0) translateY(-3px)}50%{transform:rotate(5deg)}75%{transform:rotate(0) translateY(-3px)}}
.m-goutte{animation:mGoutte 1.9s ease-in-out infinite}
@keyframes mGoutte{0%,100%{transform:scale(1,1)}30%{transform:scale(1.07,.93)}60%{transform:scale(.95,1.06)}}
.m-cristal{animation:mCristal 4.8s ease-in-out infinite}
@keyframes mCristal{0%,68%,100%{transform:none}75%{transform:translateY(-7px) rotate(-2deg)}81%{transform:translateY(0) scale(1.06,.94)}86%{transform:none}}
.cr.sad .cr-move{animation:mSad 5s ease-in-out infinite}
@keyframes mSad{0%,100%{transform:rotate(-2deg) scale(1,.98)}50%{transform:rotate(2deg) scale(1,.96)}}
.cr.sleep .cr-move{animation:none}
.cr.sleep .cr-breathe{animation-duration:5s}
.cr-look{transition:transform .3s ease-out}
/* Expressions : yeux rieurs et bouche qui parle */
.cr-eyes-happy,.cr-mouth-o{opacity:0}
.cr-root.joy .cr-eyes{opacity:0}
.cr-root.joy .cr-eyes-happy{opacity:1}
.cr-root.talk .cr-mouth{opacity:0}
.cr-root.talk .cr-mouth-o{opacity:1;transform-box:fill-box;transform-origin:50% 20%;animation:yap .13s ease-in-out infinite alternate}
@keyframes yap{from{transform:scaleY(.35)}to{transform:scaleY(1.15)}}
/* Danse sur le rythme pendant une chorale */
.cr-root.bop{animation:bop .3s ease-out}
@keyframes bop{0%{transform:none}35%{transform:scale(1.06,.92)}70%{transform:translateY(-4px) scale(.98,1.03)}100%{transform:none}}
/* Réactions au toucher, propres à chaque espèce */
.cr-root.tap-braise{transform-origin:50% 62%;animation:tBraise .85s cubic-bezier(.3,.7,.4,1.1)}
@keyframes tBraise{0%{transform:none}15%{transform:scale(1.15,.82)}55%{transform:translateY(-30px) rotate(360deg)}75%{transform:rotate(360deg) scale(1.1,.9)}100%{transform:rotate(360deg)}}
.cr-root.tap-nuage{animation:tNuage .9s ease-out}
@keyframes tNuage{0%{transform:none}22%{transform:scale(1.28,.78)}55%{transform:translateY(-24px) scale(.94,1.1)}80%{transform:translateY(-6px)}100%{transform:none}}
.cr-root.tap-pousse{animation:tPousse .85s ease-out}
@keyframes tPousse{0%{transform:none}18%{transform:rotate(-16deg)}38%{transform:rotate(16deg) translateY(-12px)}58%{transform:rotate(-10deg)}78%{transform:rotate(6deg)}100%{transform:none}}
.cr-root.tap-goutte{animation:tGoutte .9s cubic-bezier(.3,.7,.4,1.4)}
@keyframes tGoutte{0%{transform:none}15%{transform:scale(1.32,.68)}35%{transform:translateY(-14px) scale(.78,1.28)}55%{transform:scale(1.14,.86)}75%{transform:scale(.95,1.05)}100%{transform:none}}
.cr-root.tap-cristal{animation:tCristal .9s ease-in}
@keyframes tCristal{0%{transform:none}30%{transform:translateY(-20px) scale(.96,1.05)}42%{transform:translateY(0) scale(1.14,.85)}52%{transform:translateX(-3px)}62%{transform:translateX(3px)}72%{transform:translateX(-2px)}100%{transform:none}}
.cr-root.idle-hop{animation:crTap .6s cubic-bezier(.3,.7,.4,1.4)}
.heart{position:absolute;pointer-events:none;font-size:18px;color:var(--accent);animation:heart 1s ease-out forwards}
.heart svg{width:18px;height:18px;display:block}
@keyframes heart{0%{transform:translate(0,0) scale(.4);opacity:0}20%{opacity:1;transform:translate(var(--hx),-14px) scale(1.1)}100%{transform:translate(calc(var(--hx)*2),-60px) scale(.8);opacity:0}}
.bubble{position:absolute;left:50%;bottom:92%;transform:translateX(-50%);background:var(--surface);color:var(--ink);border-radius:14px;padding:6px 10px;font-weight:800;font-size:13px;white-space:nowrap;box-shadow:var(--shadow);animation:bubble 1.9s ease forwards;pointer-events:none;z-index:3}
.bubble::after{content:"";position:absolute;left:50%;top:100%;border:7px solid transparent;border-top-color:var(--surface);transform:translateX(-50%)}
@keyframes bubble{0%{opacity:0;transform:translate(-50%,8px) scale(.7)}12%{opacity:1;transform:translate(-50%,0) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-6px)}}

/* Détail objectif */
.hero{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;--gc:var(--accent);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(260px 200px at 50% 38%, color-mix(in srgb,var(--gc) 30%, transparent), transparent 70%);pointer-events:none}
.hero>*{position:relative}
.hero h2{font-size:26px}
.hero .bar{width:100%;max-width:340px}
.evo-path{display:flex;justify-content:center;gap:4px;width:100%;margin-top:6px;flex-wrap:wrap}
.evo-step{display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:800;color:var(--muted);width:60px}
.evo-step .mini{width:48px;height:48px}
.evo-step.locked .mini{filter:brightness(0);opacity:.18}
.evo-step.current{color:var(--ink)}
.evo-step.current .mini{background:color-mix(in srgb,var(--gc) 18%, transparent);border-radius:14px}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;align-items:center}
.do-btn{flex:1;min-width:0;display:flex;align-items:center;gap:10px;justify-content:space-between;text-align:left;border-radius:14px;padding:12px 14px;font-weight:800;color:#fff;background:var(--dc);box-shadow:0 3px 0 color-mix(in srgb,var(--dc) 65%, #000)}
.do-btn span{min-width:0;overflow-wrap:anywhere}
.do-btn small{display:block;font-weight:700;opacity:.85;font-size:11.5px}
.do-btn b{background:rgba(255,255,255,.25);border-radius:8px;padding:2px 8px;font-size:13px;flex:none}
.do-btn:active{transform:translateY(3px);box-shadow:none}
.do-btn.locked{background:var(--surface2);color:var(--muted);box-shadow:none;border:2px dashed var(--line)}
.ms-btn{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;border-radius:14px;padding:11px 12px;background:var(--surface2);border:2px solid var(--line);font-weight:700}
.ms-btn .box{width:24px;height:24px;border-radius:8px;border:2.5px solid var(--line);flex:none;display:grid;place-items:center;background:var(--surface)}
.ms-btn .box svg{width:15px;height:15px}
.ms-btn .mtxt{flex:1;min-width:0;overflow-wrap:anywhere}
.ms-btn b{color:var(--orange);font-size:13px;flex:none}
.ms-btn.done{opacity:.7}
.ms-btn.done .box{background:var(--mint);border-color:var(--mint);color:#fff}
.ms-btn.done .mtxt{text-decoration:line-through}
.ms-btn.final{border-color:var(--gold);background:linear-gradient(135deg,var(--gold-soft),var(--surface2))}
.ms-btn.final b{color:var(--gold)}
.skill{border-radius:16px;background:var(--surface2);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.sk-head{display:flex;align-items:center;gap:8px}
.sk-head b{flex:1;min-width:0;overflow-wrap:anywhere}
.lvl{background:var(--gc,var(--accent));color:#fff;border-radius:10px;padding:2px 8px;font-weight:800;font-size:12.5px;font-family:var(--font-display);flex:none}
.perks{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.perks li{font-size:12px;font-weight:700;border-radius:99px;padding:3px 9px;background:var(--surface);border:1.5px solid var(--line);color:var(--muted);display:inline-flex;gap:4px;align-items:center}
.perks li svg{width:12px;height:12px}

/* Succès */

/* Barre d'onglets */

#fx{position:fixed;inset:0;pointer-events:none;z-index:70}
.float{position:fixed;z-index:71;pointer-events:none;font-family:var(--font-display);font-weight:800;font-size:22px;color:var(--mint);text-shadow:0 2px 0 rgba(0,0,0,.15);animation:floatUp 1.25s ease-out forwards;transform:translate(-50%,-50%);white-space:nowrap}

.dot{width:12px;height:12px;border-radius:50%;flex:none;background:var(--muted)}

.shop-btn.on{background:var(--mint);color:#fff;border-color:transparent}
.who{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.who button{flex:none;width:76px;border-radius:14px;border:2px solid var(--line);padding:4px 2px 6px;background:var(--surface2);font-size:11px;font-weight:800;display:flex;flex-direction:column;align-items:center;overflow:hidden}
.who button .mini{width:52px;height:52px}
.who button.on{border-color:var(--accent);background:var(--accent-soft)}

.dress-btn svg{width:15px;height:15px}

.plan{background:linear-gradient(135deg,var(--surface),color-mix(in srgb,var(--violet) 12%,var(--surface)))}
.plan-item{display:flex;align-items:center;gap:10px;border-radius:14px;padding:10px 12px;background:var(--surface);border:2px solid var(--line);text-align:left;width:100%}
.plan-item .pcue{display:block;font-size:12px;color:var(--muted);font-weight:700}
.plan-item .ptxt{flex:1;min-width:0;font-weight:800;overflow-wrap:anywhere}
.plan-item b{font-size:12px;color:var(--violet);flex:none}
.plan-item.done{border-color:var(--mint);background:color-mix(in srgb,var(--mint) 10%,var(--surface))}

.stamp{flex:none;font-family:var(--font-display);font-weight:800;font-size:11px;color:var(--mint);border:2px solid var(--mint);border-radius:8px;padding:1px 6px;transform:rotate(-8deg);text-transform:uppercase;letter-spacing:.5px}

.cue-sugg{display:flex;flex-wrap:wrap;gap:6px}

.garden{position:relative;height:200px;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);background:linear-gradient(var(--sky1),var(--sky2));--sky1:#8FD3FF;--sky2:#E3F6FF;--hill1:#7BD88F;--hill2:#4FC37A;--orb:#FFE07A}

    const star=(x,y,s,d)=>`<path class="cr-twinkle" style="animation-delay:${d}s" transform="translate(${x} ${y}) scale(${s})" d="M0 -10 L2.5 -2.5 L10 0 L2.5 2.5 L0 10 L-2.5 2.5 L-10 0 L-2.5 -2.5Z" fill="#FFF3B0"/>`;
    extra += star(30,50,1,0)+star(172,62,1.2,-.6)+star(160,160,.8,-1.1)+star(36,150,.9,-.3);
  }
  const defs = `<defs><radialGradient id="${id}b" cx="${100-rx*.35}" cy="${cy-ry*.5}" r="${rx*1.7}" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="${L}"/><stop offset=".55" stop-color="${color}"/><stop offset="1" stop-color="${D}"/></radialGradient><linearGradient id="${id}f" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#FF5E3A"/><stop offset=".6" stop-color="#FF9F3A"/><stop offset="1" stop-color="#FFE07A"/></linearGradient><linearGradient id="${id}c" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E6F8FF"/><stop offset="1" stop-color="${L}"/></linearGradient><radialGradient id="${id}a"><stop offset="0" stop-color="#FFE9A8" stop-opacity=".9"/><stop offset="1" stop-color="#FFE9A8" stop-opacity="0"/></radialGradient></defs>`;
  face += accSVG(A, {rx, ry, cy, top, ey, dx, e, my, sp});

/* ===================== Données & sauvegarde ===================== */
const LS_KEY = 'eclosion.save.v1';
function freshState(){
  return {v:1, started:false, goals:[], streak:{count:0,best:0,lastDay:null,jokers:1,jokerWeek:null,repair:null,lastRepair:null,carry:0},
    daily:null, achievements:{}, stats:{actions:0,crits:0,megas:0,milestones:0,evolutions:0,chests:0,pets:0,perks:0,xp:0,night:false,early:false},
    log:[], days:{}, coins:40, owned:[], plan:null, settings:{sound:true, music:true, musicVol:50}, updatedAt:0};
}
function migrate(s){
  const f = freshState();
  if (!s || typeof s!=='object') return f;
  const o = Object.assign(f, s);
  o.streak = Object.assign(freshState().streak, s.streak||{});
  o.stats = Object.assign(freshState().stats, s.stats||{});
  o.settings = Object.assign(freshState().settings, s.settings||{});
  o.achievements = s.achievements||{};
  o.log = Array.isArray(s.log)?s.log:[];
  o.coins = typeof s.coins==='number' ? s.coins : 40;
  o.plan = s.plan && typeof s.plan==='object' ? s.plan : null;
  o.owned = Array.isArray(s.owned) ? s.owned : [];
  if (s.days && typeof s.days==='object') o.days = s.days;
  else { o.days = {}; o.log.forEach(l=>{ const k=dayKey(new Date(l.t)); const d=o.days[k]||(o.days[k]={n:0,xp:0}); d.n++; d.xp+=l.xp||0; }); }
  o.goals = (Array.isArray(s.goals)?s.goals:[]).map(g=>{
    const G = Object.assign({id:uid(),name:'Objectif',creature:'',species:'braise',color:COLORS[0],xp:0,legendary:false,sadNeed:0,createdAt:Date.now(),lastActive:null,skills:[],actions:[],milestones:[]}, g);
    if (!G.acc || typeof G.acc!=='object') G.acc = {};
    G.sadNeed = 0; // l'ancien malus de tristesse n'existe plus
    if (!G.comeback || typeof G.comeback!=='object') G.comeback = null;
    G.metrics = (Array.isArray(G.metrics)?G.metrics:[]).map(m=>Object.assign({id:uid(),name:'Mesure',unit:'',dir:'up',entries:[],rewardWeek:null},m));
    G.skills = (G.skills||[]).map(k=>Object.assign({id:uid(),name:'Compétence',xp:0,parentId:null,unlockLevel:1,perks:[]},k));
    G.actions = (G.actions||[]).map(a=>Object.assign({id:uid(),name:'Action',diff:'moyen',skillId:null},a));
    G.milestones = (G.milestones||[]).map(m=>Object.assign({id:uid(),name:'Étape',size:'moyenne',skillId:null,done:false},m));
    return G;
  });
  return o;
}
function loadLocal(){ try{ const raw = localStorage.getItem(LS_KEY); return raw? migrate(JSON.parse(raw)) : null; }catch(e){ return null; } }
function persistLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }

let state = loadLocal() || freshState();

// Synchronisation entre appareils (base de données liée à ton compte Claude)
let docRef = null, syncStatus = 'pending', saveTimer = null, writing = false, writeAgain = false;
function setSync(s){ syncStatus = s; if (view==='settings') render(); }
function commit(){
  state.updatedAt = Date.now();
  persistLocal();
  scheduleRemote();
}
function scheduleRemote(){
  if (!docRef) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(pushRemote, 900);
}
async function pushRemote(){
  if (!docRef) return;
  if (writing){ writeAgain = true; return; }
  writing = true;
  try{
    await docRef.set({json: JSON.stringify(state), updatedAt: state.updatedAt});
    if (syncStatus!=='cloud') setSync('cloud');
  }catch(e){
    if (e && e.code==='unavailable'){ setTimeout(scheduleRemote, 1500+Math.random()*1500); }
    else setSync('error');
  }
  writing = false;
  if (writeAgain){ writeAgain = false; scheduleRemote(); }
}
async function initSync(){
  try{
    if (!window.claude || typeof window.claude.use!=='function'){ setSync('local'); return; }
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user){ setSync('local'); return; }
    const id = await user.id();
    if (!id){ setSync('local'); return; }
    docRef = db.doc('data/users/'+id+'/save');
    const t = setTimeout(()=>{ if (syncStatus==='pending') setSync('local'); }, 10000);
    docRef.onSnapshot(snap=>{
      clearTimeout(t);
      if (snap.metadata && snap.metadata.fromCache && !snap.exists) return;
      if (syncStatus!=='cloud') setSync('cloud');
      if (!snap.exists){ if (state.started) scheduleRemote(); return; }
      const b = snap.data();
      if (!b || typeof b.json!=='string') return;
      if ((b.updatedAt||0) > (state.updatedAt||0)){
        try{ state = migrate(JSON.parse(b.json)); persistLocal(); ensureDay(); render(); }catch(e){}
      } else if ((b.updatedAt||0) < (state.updatedAt||0)){
        scheduleRemote();
      }
    }, err=>{ clearTimeout(t); setSync('error'); });
  }catch(e){ setSync('local'); }
}

/* ===================== Règles du jeu ===================== */
function stageOf(g){ if (g.legendary) return 4; let s=0; for(let i=1;i<4;i++) if (g.xp>=STAGES[i].xp) s=i; return s; }
function skillLevel(xp){ let lvl=1, need=40; xp=xp||0; while(xp>=need){ xp-=need; lvl++; need=40+20*(lvl-1);} return {lvl, cur:xp, need}; }
function getGoal(id){ return state.goals.find(g=>g.id===id); }
function getSkill(g,id){ return id? g.skills.find(s=>s.id===id) : null; }
function isLocked(g,sk){ if(!sk||!sk.parentId) return false; const p=getSkill(g,sk.parentId); if(!p) return false; return (sk.unlockLevel||1) > skillLevel(p.xp).lvl || isLocked(g,p); }
function daysInactive(g){ const last = g.lastActive || dayKey(new Date(g.createdAt||Date.now())); return Math.max(0, daysBetween(last, dayKey())); }
function moodOf(g){ if (stageOf(g)===0) return 'happy'; const d=daysInactive(g); if (d>=7) return 'sleep'; if (d>=3) return 'sad'; if (d===2) return 'ok'; return 'happy'; }
function moodText(g){
  const m = moodOf(g), ok = comebackReady(g);
  if (m==='sleep') return ok ? `S'est endormi·e en t'attendant. Ta prochaine action la réveille : bonus de retrouvailles +50 % sur 3 actions.` : `S'est endormi·e en t'attendant. Une action pour la réveiller !`;
  if (m==='sad') return ok ? `Je t'attendais… Reviens : bonus de retrouvailles +30 % sur 2 actions.` : `Je t'attendais… Une action pour me rendre le sourire !`;
  if (m==='ok') return `Se demande où tu es passé·e…`;
  return '';
}
function stageProgress(g){
  const s = stageOf(g);
  if (s===4) return {pct:100, text:'Forme légendaire atteinte'};
  if (s===3) return {pct:100, text:`${g.xp} XP · valide l'étape finale pour la forme ultime`};
  const a=STAGES[s].xp, b=STAGES[s+1].xp;
  return {pct: Math.min(100, (g.xp-a)/(b-a)*100), text:`${g.xp} / ${b} XP vers ${STAGES[s+1].name}`};
}
function creatureName(g){ return g.creature || SPECIES[g.species].name; }
// Niveau de joueur : toute l'XP gagnée, tous objectifs confondus
const TITLES = [[1,'Novice'],[3,'Apprenti'],[5,'Aventurier'],[8,'Éleveur'],[12,'Expert'],[16,'Champion'],[20,'Maître'],[30,'Légende']];
function playerLevel(){ let xp=state.stats.xp||0, lvl=1, need=150; while(xp>=need){ xp-=need; lvl++; need=150+75*(lvl-1); } let title='Novice'; TITLES.forEach(([l,t])=>{ if(lvl>=l) title=t; }); return {lvl, cur:xp, need, title}; }
function addCoins(n){
  state.coins = (state.coins||0) + n;

// Suivi par jour (calendrier d'activité) et compteurs par action
function trackDay(xp, n){
  const k=dayKey(), d=state.days[k]||(state.days[k]={n:0,xp:0}); d.n+=n; d.xp+=xp;
  const keys=Object.keys(state.days); if (keys.length>130) keys.sort().slice(0,keys.length-130).forEach(x=>delete state.days[x]);
}
function todayCount(a){ return a.today && a.today.d===dayKey() ? a.today.n : 0; }
function weekCount(a){ return a.week && a.week.k===weekKey() ? a.week.n : 0; }
function timeOfDay(){ const h=new Date().getHours(); return h<6?'night':h<9?'dawn':h<18?'day':h<21?'dusk':'night'; }

function ensureDay(){
  const today = dayKey(); let changed=false;
  const S = state.streak;
  const wk = weekKey();
  if (S.jokerWeek!==wk){ if (S.jokerWeek) S.jokers = Math.min(2, (S.jokers||0)+1); S.jokerWeek = wk; changed=true; }
  if (S.repair && today > S.repair.until){ breakStreak(); changed=true; }
  if (!S.repair && S.lastDay && S.count>0){
    const gap = daysBetween(S.lastDay, today);
    if (gap>=2){
      const missed = gap-1;
      const canRepair = !S.lastRepair || daysBetween(S.lastRepair, today)>=7;
      if (missed <= S.jokers){ S.jokers -= missed; S.lastDay = addDays(today,-1); toast({icon:IC.shield, title:`Joker utilisé`, sub:`Ta série de ${S.count} jours est protégée.`, color:'var(--sky)'}); }
      else if (canRepair && missed <= S.jokers+1){
        // Réparation sous 48 h : les jokers couvrent ce qu'ils peuvent, la flamme devient une braise à rallumer
        S.jokers -= (missed-1);
        S.repair = {need:2, got:0, until: addDays(addDays(S.lastDay, missed), 2)};
        toast({icon:IC.flame, title:'Ta flamme est en braise', sub:'Fais 2 actions (ou 1 difficile) aujourd’hui ou demain pour la rallumer.', color:'var(--orange)', ms:5000});
      }
      else breakStreak();
      changed = true;
    }
  }
  if (!state.daily || state.daily.day!==today){ state.daily = makeDaily(today); changed=true; }
  if (changed) commit();
}
function makeDaily(day){
  const rnd = seeded(day+'q');
  const pool = QUESTS.filter(q=>!q.need || q.need(state));
  const chosen=[], keys=new Set();
  let guard=0;
  while(chosen.length<3 && guard++<100){ const q = pool[Math.floor(rnd()*pool.length)]; if (keys.has(q.key)) continue; keys.add(q.key); chosen.push({id:q.id,text:q.text,target:q.target,key:q.key}); }
  return {day, quests:chosen, c:{actions:0,xp:0,hard:0,goals:[],pets:0,milestones:0,crits:0}, claimed:false};
}
function qProgress(q){ const c=state.daily.c; return q.key==='goals'? c.goals.length : (c[q.key]||0); }
function questsDone(){ return state.daily && state.daily.quests.every(q=>qProgress(q)>=q.target); }
// Retrouvailles : un bonus au retour au lieu d'un malus (au plus une fois tous les 14 jours par objectif)
function comebackReady(g){ return !g.lastComebackAt || daysBetween(g.lastComebackAt, dayKey())>=14; }
// Jours qui comptent pour le bonus de série : la série, ou la moitié gardée après une rupture
function streakBonusDays(){ const S=state.streak; return Math.max(S.count||0, S.carry||0); }
function streakBonusPct(){ return Math.round(Math.min(.3, streakBonusDays()*.02)*100); }
function breakStreak(){
  const S=state.streak, prev=S.count;
  S.carry = Math.floor(Math.min(prev,15)/2); S.count=0; S.repair=null;
  if (prev>1) toast({icon:IC.flame, title:'Nouvelle série, nouveau départ', sub: S.carry ? `Tu gardes la moitié de ton bonus : +${S.carry*2} % d'XP.` : 'Une action aujourd’hui pour lancer ta flamme !', color:'var(--orange)'});
}
function touchStreak(w){
  const S=state.streak, today=dayKey();
  if (S.repair){
    if (today > S.repair.until){ breakStreak(); }
    else {
      S.repair.got = (S.repair.got||0) + (w||1);
      if (S.repair.got < S.repair.need) return 'repairing';
      S.count++; S.lastDay=today; S.best=Math.max(S.best,S.count); S.lastRepair=today; S.repair=null;
      state.stats.repairs=(state.stats.repairs||0)+1;
      return 'repaired';
    }
  }
  if (S.lastDay===today) return false;
  if (S.lastDay && daysBetween(S.lastDay,today)===1 && S.count>0) S.count++; else S.count=1;
  S.lastDay = today; S.best = Math.max(S.best, S.count);
  if (S.carry && S.count>=S.carry) S.carry=0;
  return true;
}
function addSkillXp(g, sk, amt, ev){
  const before = skillLevel(sk.xp).lvl;
  sk.xp = (sk.xp||0) + amt;
  const after = skillLevel(sk.xp).lvl;
  if (after>before){
    ev.push({type:'level', sk, lvl:after});
    (sk.perks||[]).filter(p=>p.level>before && p.level<=after).forEach(p=>{ ev.push({type:'perk', sk, perk:p}); state.stats.perks++; });
    g.skills.filter(c=>c.parentId===sk.id && (c.unlockLevel||1)>before && (c.unlockLevel||1)<=after).forEach(c=>{ ev.push({type:'unlock', sk:c, parent:sk}); state.stats.perks++; });
  }
}
function grant(g, sk, base, opts){
  let mult=1, crit=0;
  if (opts.crit){ const r=Math.random(); if (r<0.03){mult=5;crit=2;} else if (r<0.15){mult=2;crit=1;} }
  const inactive = daysInactive(g);
  let comebackStart = false;
  if (stageOf(g)>0 && inactive>=3 && comebackReady(g)){
    g.comeback = inactive>=7 ? {n:3, pct:50} : {n:2, pct:30};
    g.lastComebackAt = dayKey(); comebackStart = true;
    state.stats.comebacks = (state.stats.comebacks||0)+1;
  }
  const cb = g.comeback && g.comeback.n>0 ? g.comeback.pct : 0;
  const planPct = opts.plan ? 25 : 0;
  const bonus = Math.min(0.3, streakBonusDays()*0.02);
  const xp = Math.max(1, Math.round(base*mult*(1+bonus+cb/100+planPct/100)));
  if (cb){ g.comeback.n--; if (g.comeback.n<=0) g.comeback=null; }
  g.lastActive = dayKey();
  const before = stageOf(g);
  g.xp += xp; state.stats.xp += xp;
  const ev=[];
  let skXp = 0, parXp = 0, parentId = null;
  if (sk){ addSkillXp(g, sk, xp, ev); skXp = xp; if (sk.parentId){ const p=getSkill(g,sk.parentId); if(p){ parXp=Math.round(xp*.5); parentId=p.id; addSkillXp(g,p,parXp,ev);} } }
  if (opts.legendary) g.legendary = true;
  const after = stageOf(g);
  if (after>before){ ev.push({type:'evolve', g, from:before, to:after}); state.stats.evolutions++; }
  return {xp, crit, cb, planPct, comebackStart, ev, skXp, parXp, parentId};
}

let actx=null;

function unlockAudio(){

function tone(f, d, o){ o=o||{}; const c=o.force?ctxGet():ac(); if(!c) return; const t=c.currentTime+(o.at||0); const osc=c.createOscillator(), g=c.createGain(); osc.type=o.type||'sine'; osc.frequency.setValueAtTime(f,t); if(o.to) osc.frequency.exponentialRampToValueAtTime(o.to,t+d); const v=o.vol||.18; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+.012); g.gain.exponentialRampToValueAtTime(0.0001,t+d); osc.connect(g); g.connect(c.destination); osc.start(t); osc.stop(t+d+.05); }

/* ===================== Voix des créatures ===================== */
// Chaque espèce a sa voix. Plus la créature grandit, plus sa voix est grave. Triste, elle descend.
let vNoiseBuf=null;
function noiseBuf(c){ if(!vNoiseBuf){ vNoiseBuf=c.createBuffer(1,Math.floor(c.sampleRate*.6),c.sampleRate); const d=vNoiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; } return vNoiseBuf; }
function vOsc(c, type, t, d, path, vol, o){
  o=o||{}; const osc=c.createOscillator(), g=c.createGain();
  osc.type=type; osc.frequency.setValueAtTime(path[0][1], t);
  for(let i=1;i<path.length;i++) osc.frequency.exponentialRampToValueAtTime(Math.max(20,path[i][1]), t+path[i][0]);
  g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(vol, t+(o.a||.012)); g.gain.exponentialRampToValueAtTime(.0001, t+d);
  if (o.vib){ const l=c.createOscillator(), lg=c.createGain(); l.frequency.value=o.vib[0]; lg.gain.value=o.vib[1]; l.connect(lg); lg.connect(osc.frequency); l.start(t); l.stop(t+d+.05); }

  g.connect(c.destination); osc.start(t); osc.stop(t+d+.05);
}
function vNoise(c, t, d, vol, type, freq, q){ const n=c.createBufferSource(); n.buffer=noiseBuf(c); const f=c.createBiquadFilter(); f.type=type; f.frequency.value=freq; if(q) f.Q.value=q; const g=c.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(vol,t+.005); g.gain.exponentialRampToValueAtTime(.0001,t+d); n.connect(f); f.connect(g); g.connect(c.destination); n.start(t, Math.random()*.3); n.stop(t+d+.02); }
const VOICES = {
  // Renard de braise : petits jappements vifs « kyu-kyu ! » et crépitements de feu
  braise(c,t,k,v,sad){
    if (sad){ vOsc(c,'triangle',t,.38,[[0,950*k],[.36,480*k]],.16*v); return .4; }
    const n=2+(Math.random()<.4?1:0);
    for(let i=0;i<n;i++){ const ti=t+i*.11, j=1+(Math.random()-.5)*.12; vOsc(c,'triangle',ti,.1,[[0,640*k*j],[.07,1180*k*j]],.17*v); vOsc(c,'square',ti,.07,[[0,1280*k*j],[.06,2300*k*j]],.025*v); }
    for(let i=0;i<4;i++) vNoise(c,t+Math.random()*.3,.03,.05*v,'highpass',3500);
    return n*.11+.05; },
  // Chat-nuage : miaulement doux qui ondule, suivi d'un ronronnement
  nuage(c,t,k,v,sad){
    if (sad){ vOsc(c,'sine',t,.8,[[0,700*k],[.75,400*k]],.18*v,{vib:[5,14],a:.08}); return .8; }
    vOsc(c,'sine',t,.6,[[0,600*k],[.2,900*k],[.55,520*k]],.2*v,{vib:[7,16*k],a:.05});
    vOsc(c,'triangle',t,.6,[[0,1200*k],[.2,1800*k],[.55,1040*k]],.03*v,{a:.05});
    vOsc(c,'sawtooth',t+.15,.7,[[0,52],[.7,48]],.07*v,{lp:260,vib:[24,6]});
    return .6; },
  // Esprit des feuilles : notes boisées de marimba « pip-pop ! »
  pousse(c,t,k,v,sad){
    const notes = sad? [1320,1047,880] : (Math.random()<.5?[880,1175,1568]:[988,1319,1760]);
    notes.forEach((f,i)=>{ const ti=t+i*(sad?.16:.09); vOsc(c,'sine',ti,.2,[[0,f*k],[.2,f*k*.985]],.2*v,{a:.003}); vOsc(c,'triangle',ti,.05,[[0,f*k*3]],.025*v,{a:.002}); vNoise(c,ti,.015,.04*v,'highpass',6000); });
    return notes.length*(sad?.16:.09)+.1; },
  // Phoque des marées : « bloup-bloup » de bulles
  goutte(c,t,k,v,sad){
    const n=sad?1:2;
    for(let i=0;i<n;i++){ const ti=t+i*.17; vOsc(c,'sine',ti,sad?.4:.17,sad?[[0,700*k],[.38,260*k]]:[[0,280*k],[.07,950*k],[.16,620*k]],.22*v); vNoise(c,ti+.02,.08,.025*v,'bandpass',1300,6); }
    return n*.17+.05; },
  // Golem de cristal : tintement de cloche cristalline et pas lourd
  cristal(c,t,k,v,sad){
    const f0 = 520*k*(sad?.84:1);
    const bell=(ti,f,vv)=>{ [[1,.15,1.3],[2.76,.06,.7],[5.4,.03,.35]].forEach(([m,vol,d])=>vOsc(c,'sine',ti,d,[[0,f*m]],vol*vv*v,{a:.003})); };

};
function voice(sp, stage, mood){
  const c = ac(); if(!c) return 0;
  const t = c.currentTime+.02;
  if (stage===0){ [0,.16].forEach(d=>{ vNoise(c,t+d,.05,.12,'bandpass',900,2); vOsc(c,'sine',t+d,.07,[[0,320],[.06,150]],.18); }); return 0; }
  if (mood==='sleep'){ vNoise(c,t,.7,.06,'lowpass',380); vOsc(c,'sine',t,.7,[[0,85],[.7,70]],.08,{a:.3}); return 0; }
  const k = [1,1.45,1.22,1,.94][stage];
  const fn = VOICES[sp]||VOICES.braise;
  const d = fn(c,t,k,1,mood==='sad');
  if (stage===4) fn(c,t+.22,k*2,.28,false); // écho féerique de la forme légendaire

/* ===================== Musique d'ambiance (générée en direct) ===================== */
// Une petite boucle douce : nappe d'accords, basse, arpège, percussions légères et une mélodie qui revient.
const music = {on:false, timer:null, next:0, step:0, gain:null, noise:null, phr:null, resume:false};
const mtof = m=>440*Math.pow(2,(m-69)/12);
const CHORDS = [[48,55,64,71],[45,52,60,67],[41,48,57,64],[43,50,59,62]]; // Do maj7, La m7, Fa maj7, Sol
const PENTA = [60,62,64,67,69,72,74,76,79];
const BEAT = 60/86/2; // croches à 86 BPM
function mVol(){ const v = state.settings.musicVol==null?50:state.settings.musicVol; return v/100*.6; }
function startMusic(){
  if (music.on || !state.settings.music || document.hidden) return;
  const c = ctxGet(); if (!c) return;
  if (!music.gain){
    music.gain = c.createGain(); music.gain.gain.value = 0;
    const comp = c.createDynamicsCompressor(); music.gain.connect(comp); comp.connect(c.destination);
    const b = c.createBuffer(1, Math.floor(c.sampleRate*.5), c.sampleRate); const d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; music.noise=b;
    const rnd = seeded('eclosion-melodie');
    music.phr = Array.from({length:4},()=>Array.from({length:8},(_,i)=> (rnd()<(i%2?.55:.25)) ? null : Math.floor(rnd()*PENTA.length)));
  }
  const g = music.gain.gain; g.cancelScheduledValues(c.currentTime); g.setTargetAtTime(mVol(), c.currentTime, .9);
  music.on = true; music.next = c.currentTime + .1; music.t0 = music.next - music.step*BEAT; music.timer = setInterval(schedMusic, 25);
}
function stopMusic(){ if (!music.on) return; music.on=false; clearInterval(music.timer); if (actx && music.gain){ const g=music.gain.gain; g.cancelScheduledValues(actx.currentTime); g.setTargetAtTime(0, actx.currentTime, .15); } }
function duckMusic(sec){ if (!music.on || !actx) return; const t=actx.currentTime, g=music.gain.gain; g.cancelScheduledValues(t); g.setTargetAtTime(mVol()*.18, t, .08); g.setTargetAtTime(mVol(), t+sec, .7); }
function mNote(f, t, d, type, vol, dest, attack){
  const o=actx.createOscillator(), g=actx.createGain(); o.type=type; o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol, t+(attack||.01)); g.gain.exponentialRampToValueAtTime(0.0001, t+d);
  o.connect(g); g.connect(dest||music.gain); o.start(t); o.stop(t+d+.05);
}
function mNoise(t, d, vol, type, freq){ const n=actx.createBufferSource(); n.buffer=music.noise; const f=actx.createBiquadFilter(); f.type=type; f.frequency.value=freq; const g=actx.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+d); n.connect(f); f.connect(g); g.connect(music.gain); n.start(t); n.stop(t+d+.02); }

function playStep(s, t){
  const bar=Math.floor(s/8), st=s%8, ch=CHORDS[bar%4];
  if (st===0){ const f=actx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=950; f.connect(music.gain); ch.forEach(m=>{ mNote(mtof(m),t,BEAT*8+.5,'triangle',.032,f,.4); mNote(mtof(m)*1.004,t,BEAT*8+.5,'sine',.02,f,.5); }); }
  if (st===0||st===3||st===4||st===6) mNote(mtof((st===3||st===6? ch[1] : ch[0])-12), t, BEAT*1.7, 'sine', .15);
  mNote(mtof(ch[[0,1,2,3,2,1,2,3][st]]+12), t, BEAT*1.9, 'triangle', .02);
  if (st===0||st===4){ const o=actx.createOscillator(), g=actx.createGain(); o.frequency.setValueAtTime(115,t); o.frequency.exponentialRampToValueAtTime(42,t+.14); g.gain.setValueAtTime(.2,t); g.gain.exponentialRampToValueAtTime(.0001,t+.2); o.connect(g); g.connect(music.gain); o.start(t); o.stop(t+.22); }

  if (st%2===1) mNoise(t, .04, .016, 'highpass', 7500);
  const sec=Math.floor(bar/4)%4;
  if (sec===1||sec===3){ const idx = music.phr[(bar + (sec===3?2:0))%4][st]; if (idx!=null) mNote(mtof(PENTA[idx]+12), t, BEAT*2.4, 'sine', .05, null, .02); }

  if (st%2===0 && Date.now()-chorus.last < 5000) setTimeout(beatBop, Math.max(0,(t-actx.currentTime)*1000));
}

/* ===================== Chorale des créatures ===================== */
// Chaque toucher fait chanter une note. Les notes viennent d'une gamme qui sonne toujours juste,
// se calent sur le rythme de la musique, et les autres créatures harmonisent puis te répondent.
const SCALE = [0,2,4,7,9];
const REG = {cristal:5, braise:3, pousse:2, goutte:0, nuage:-2}; // registre de chaque espèce
const chorus = {deg:2, count:0, last:0, phrase:[], answerTimer:null};
function degToMidi(d){ const o=Math.floor(d/5), i=((d%5)+5)%5; return 60+o*12+SCALE[i]; }
function chordNow(t){ if (!music.on) return null; const s=Math.floor((t-music.t0)/BEAT); return CHORDS[Math.floor(s/8)%4]; }
function quantize(now){ if (!music.on) return now+.01; const g=BEAT/2; return music.t0 + Math.ceil((now+.03-music.t0)/g)*g; }
function snapToChord(midi, ch){ if (!ch) return midi; const pcs=ch.map(m=>m%12); for (const d of [0,-1,1,-2,2,-3,3]){ if (pcs.includes((((midi+d)%12)+12)%12)) return midi+d; } return midi; }
function nearestTonic(m){ const b=m-(((m%12)+12)%12); return [b-12,b,b+12].reduce((a,c)=>Math.abs(c-m)<Math.abs(a-m)?c:a); }
// Le timbre de chaque espèce, chanté sur une note
function singNote(sp, midi, t, vol){
  const c=ac(); if(!c) return; const f=mtof(midi); vol=vol||1;
  if (sp==='braise'){ vOsc(c,'triangle',t,.35,[[0,f*1.5],[.04,f]],.16*vol,{a:.005}); vOsc(c,'square',t,.12,[[0,f*2]],.025*vol); vNoise(c,t,.02,.03*vol,'highpass',4000); }
  else if (sp==='nuage'){ vOsc(c,'sine',t,.7,[[0,f*.94],[.08,f]],.18*vol,{vib:[6,f*.012],a:.06}); vOsc(c,'triangle',t,.7,[[0,f*2]],.025*vol,{a:.08}); }
  else if (sp==='pousse'){ vOsc(c,'sine',t,.45,[[0,f]],.2*vol,{a:.003}); vOsc(c,'sine',t,.12,[[0,f*4]],.04*vol,{a:.002}); vNoise(c,t,.012,.04*vol,'highpass',6000); }
  else if (sp==='goutte'){ vOsc(c,'sine',t,.32,[[0,f*.5],[.05,f*1.03],[.12,f]],.22*vol); }
  else { [[1,.13,1.2],[2.76,.05,.6],[5.4,.025,.3]].forEach(([m,v,d])=>vOsc(c,'sine',t,d,[[0,f*m]],v*vol,{a:.003})); }
}
function woodBlock(t){ const c=ac(); if(!c) return; vNoise(c,t,.04,.12,'bandpass',1100,4); vOsc(c,'sine',t,.06,[[0,700],[.05,500]],.14); }
function pickSinger(excludeGid){ const ws=[...document.querySelectorAll('.cr-wrap[data-sp]')].filter(w=>w.dataset.g!==excludeGid && +w.dataset.st>0 && w.dataset.mood!=='sleep' && inView(w)); return ws.length? pick(ws) : null; }
function creatureSings(w, g, big){
  if (!w.isConnected) return;
  animCreature(w, big?'tap-'+g.species:'idle-hop', big?900:600); animCreature(w,'talk',350);
  if (moodOf(g)!=='sad') animCreature(w,'joy',600);
  const r=w.getBoundingClientRect(); noteFx(r.left+r.width/2, r.top+r.height*.2, g.color, big?3:1);
}
function beatBop(){
  document.querySelectorAll('.cr-wrap[data-sp]').forEach(w=>{
    if (+w.dataset.st===0 || w.dataset.mood==='sleep' || !inView(w)) return;
    const root=w.querySelector('.cr-root'); if (!root || /tap|idle/.test(root.getAttribute('class'))) return;
    animCreature(w,'bop',300);
  });
}
function chorusTap(g, m){
  const c=ac(), nowMs=Date.now();
  if (nowMs-chorus.last > 2500){ chorus.count=0; chorus.phrase=[]; chorus.deg=1+Math.floor(Math.random()*3); }
  const first = chorus.count===0;
  chorus.last=nowMs; chorus.count++;
  const st=stageOf(g);
  const now=c?c.currentTime:0, t=c?quantize(now):0, delay=c?Math.max(0,(t-now)*1000):0;
  if (st===0){ woodBlock(t); return {delay, first}; }
  if (m==='sleep'){ voice(g.species, st, 'sleep'); chorus.count--; return {delay:0, first}; }
  if (!first) chorus.deg = Math.max(-2, Math.min(7, chorus.deg + pick([-2,-1,-1,1,1,2])));
  const midi = snapToChord(degToMidi(Math.min(11, chorus.deg + (REG[g.species]||0))), chordNow(t));
  singNote(g.species, midi, t, m==='sad'?.6:1);
  chorus.phrase.push({midi, at:nowMs, gid:g.id}); if (chorus.phrase.length>8) chorus.phrase.shift();
  // Une autre créature chante en harmonie avec toi
  if (chorus.count>=3 && Math.random()<.55){
    const w=pickSinger(g.id); const hg=w&&getGoal(w.dataset.g);
    if (hg){ singNote(hg.species, snapToChord(midi+(Math.random()<.5?4:-5), chordNow(t)), t, .45); setTimeout(()=>creatureSings(w,hg,false), delay); }
  }
  state.stats.chorusBest = Math.max(state.stats.chorusBest||0, chorus.count);
  clearTimeout(chorus.answerTimer);
  if (chorus.phrase.length>=3) chorus.answerTimer = setTimeout(answerPhrase, 1200);
  return {delay, first, combo: chorus.count>=4 && chorus.count%4===0};
}
// Quand tu t'arrêtes, une autre créature rejoue ta mélodie et la termine
function answerPhrase(){
  const ph = chorus.phrase.slice(-6); if (ph.length<3) return;
  const w = pickSinger(ph[ph.length-1].gid); if (!w) return;
  const g = getGoal(w.dataset.g); if (!g) return;
  chorus.phrase=[]; chorus.count=0;
  const c = ac(); const shift = g.species==='cristal'?12 : g.species==='nuage'?-12 : 0;
  let t = c? quantize(c.currentTime+.08) : 0, off = 0;
  ph.forEach((n,i)=>{
    if (i>0){ const gap=Math.max(BEAT, Math.min(BEAT*2, Math.round(((n.at-ph[i-1].at)/1000)/BEAT)*BEAT)); t+=gap; off+=gap; }
    const midi = i===ph.length-1 ? nearestTonic(n.midi+shift) : n.midi+shift;
    singNote(g.species, midi, t, .9);
    const dl = c? (t-c.currentTime)*1000 : off*1000;
    setTimeout(()=>creatureSings(w, g, i===ph.length-1), Math.max(0,dl));
  });
  const endMs = c? (t-c.currentTime)*1000 : off*1000;
  setTimeout(()=>{
    if (!w.isConnected) return;
    const r=w.getBoundingClientRect(), x=r.left+r.width/2, y=r.top+r.height*.3;
    floatText(x, y, 'Duo !', 'crit'); stars(x, y, 14, null, 1.2); confetti(x, y, 30, null, .8);
    state.stats.duets=(state.stats.duets||0)+1; checkAchievements(); commit();
  }, endMs+300);
}
function buzz(p){ try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} }

/* ===================== Confettis & effets ===================== */
const cv = $('#fx'), cx2 = cv.getContext('2d'); let parts=[], raf=0;
const amb = $('#amb'), ax = amb.getContext('2d'); let motes=[];
function sizeCanvas(){ const r=window.devicePixelRatio||1; [[cv,cx2],[amb,ax]].forEach(([c,x])=>{ c.width=innerWidth*r; c.height=innerHeight*r; c.style.width=innerWidth+'px'; c.style.height=innerHeight+'px'; x.setTransform(r,0,0,r,0,0); }); }
sizeCanvas(); addEventListener('resize', ()=>{ sizeCanvas(); if (reduceMotion) drawAmb(); });
function spawn(p){ parts.push(p); if (!raf) raf = requestAnimationFrame(tick); }
function confetti(x, y, n, colors, power){
  if (reduceMotion) n = Math.min(n, 12);
  colors = colors || ['#FF5D86','#FFC233','#2FC98C','#3F8CFF','#9B6BFF','#FF8A5B'];
  power = power || 1;
  for(let i=0;i<n;i++){ const a = -Math.PI/2 + (Math.random()-.5)*Math.PI*1.3; const v=(4+Math.random()*7)*power;
    spawn({k:'conf',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:.22+Math.random()*.1,s:4+Math.random()*5,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:pick(colors),life:90+Math.random()*50,shape:Math.random()<.3?'c':'r'}); }
}
// Onde de choc
function ring(x, y, color, max, w){ if (reduceMotion) return; spawn({k:'ring',x,y,r:6,max:max||80,w:w||6,c:color||'#FFC233',life:1}); }
// Étoiles scintillantes
function stars(x, y, n, colors, power){
  if (reduceMotion) n = Math.min(n, 4);
  colors = colors || ['#FFF3B0','#FFD66B','#FFFFFF']; power = power||1;
  for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, v=(1.5+Math.random()*4.5)*power; spawn({k:'star',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,s:5+Math.random()*7,rot:Math.random()*3,vr:(Math.random()-.5)*.25,c:pick(colors),life:40+Math.random()*35}); }
}
// Pièces d'or qui tournent
function coins(x, y, n){ if (reduceMotion) n=Math.min(n,8); for(let i=0;i<n;i++){ const a=-Math.PI/2+(Math.random()-.5)*Math.PI*1.1, v=6+Math.random()*8; spawn({k:'coin',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:.3,s:6+Math.random()*4,ph:Math.random()*6,life:120}); } }
// Orbes d'XP qui volent vers une cible
function orbs(x, y, tx, ty, n, color, onArrive){
  if (reduceMotion) n = Math.min(n, 3);
  for(let i=0;i<n;i++) spawn({k:'orb',sx:x,sy:y,mx:x+(Math.random()-.5)*280,my:Math.min(y,ty)-50-Math.random()*150,tx:tx+(Math.random()-.5)*16,ty:ty+(Math.random()-.5)*6,t:-i*.07,sp:.02+Math.random()*.012,c:color||'#6FF2C2',cb:onArrive});
}
function drawStar(s){ cx2.beginPath(); for(let j=0;j<8;j++){ const r=j%2?s*.38:s, a=j*Math.PI/4; cx2.lineTo(Math.cos(a)*r, Math.sin(a)*r); } cx2.closePath(); cx2.fill(); }
function glow(ctx, x, y, r, c, a){ const g=ctx.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,c); g.addColorStop(1,c+'00'); ctx.globalAlpha=Math.max(0,Math.min(1,a)); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill(); }
const bez=(a,b,c,t)=>(1-t)*(1-t)*a+2*(1-t)*t*b+t*t*c;
const ease=t=>t*t*(3-2*t);
function tick(){
  cx2.clearRect(0,0,innerWidth,innerHeight);
  const alive=[];
  for(const p of parts){
    cx2.save();
    if (p.k==='conf'){
      p.vy+=p.g; p.vx*=.985; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.life--;
      cx2.globalAlpha=Math.min(1,p.life/30); cx2.translate(p.x,p.y); cx2.rotate(p.r); cx2.fillStyle=p.c;
      if(p.shape==='c'){cx2.beginPath();cx2.arc(0,0,p.s/2,0,7);cx2.fill();} else cx2.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);
      if (p.life>0 && p.y<innerHeight+40) alive.push(p);
    } else if (p.k==='ring'){
      p.r += (p.max-p.r)*.13+.8; p.life -= .04;
      cx2.globalAlpha=Math.max(0,p.life); cx2.strokeStyle=p.c; cx2.lineWidth=p.w*p.life+1; cx2.shadowColor=p.c; cx2.shadowBlur=14;
      cx2.beginPath(); cx2.arc(p.x,p.y,p.r,0,7); cx2.stroke();
      if (p.life>0) alive.push(p);
    } else if (p.k==='star'){
      p.x+=p.vx; p.y+=p.vy; p.vx*=.94; p.vy*=.94; p.vy+=.035; p.rot+=p.vr; p.life--;
      const a=Math.min(1,p.life/25); cx2.globalCompositeOperation='lighter'; glow(cx2,p.x,p.y,p.s*2.4,p.c,a*.55);
      cx2.globalAlpha=a; cx2.fillStyle=p.c; cx2.translate(p.x,p.y); cx2.rotate(p.rot); drawStar(p.s*(.5+.5*a));
      if (p.life>0) alive.push(p);
    } else if (p.k==='coin'){
      p.vy+=p.g; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.ph+=.28; p.life--;
      cx2.globalAlpha=Math.min(1,p.life/30); cx2.translate(p.x,p.y); cx2.scale(Math.max(.15,Math.abs(Math.cos(p.ph))),1);
      cx2.fillStyle='#E09A00'; cx2.beginPath(); cx2.arc(0,0,p.s,0,7); cx2.fill(); cx2.fillStyle='#FFD54A'; cx2.beginPath(); cx2.arc(0,0,p.s*.72,0,7); cx2.fill(); cx2.fillStyle='#FFF3B0'; cx2.fillRect(-p.s*.15,-p.s*.45,p.s*.3,p.s*.9);
      if (p.life>0 && p.y<innerHeight+30) alive.push(p);
    } else if (p.k==='orb'){
      p.t += p.sp;
      if (p.t>=1){ if (p.cb) p.cb(); }
      else {
        if (p.t>0){
          cx2.globalCompositeOperation='lighter';
          for(let j=4;j>=0;j--){ const tt=ease(Math.max(0,p.t-j*.03)); glow(cx2, bez(p.sx,p.mx,p.tx,tt), bez(p.sy,p.my,p.ty,tt), 12-j*2, p.c, 1-j*.18); }
          const tt=ease(p.t); cx2.globalAlpha=1; cx2.fillStyle='#fff'; cx2.beginPath(); cx2.arc(bez(p.sx,p.mx,p.tx,tt), bez(p.sy,p.my,p.ty,tt), 2.8, 0, 7); cx2.fill();
        }
        alive.push(p);
      }
    } else if (p.k==='ember'){
      p.ph+=.2; p.x+=p.vx+Math.sin(p.ph)*.4; p.y+=p.vy; p.vy*=.985; p.life--;
      const a=Math.min(1,p.life/30)*(.7+.3*Math.sin(p.ph*3)); cx2.globalCompositeOperation='lighter'; glow(cx2,p.x,p.y,p.s*4,p.c,a*.6); cx2.globalAlpha=a; cx2.fillStyle='#FFF3B0'; cx2.beginPath(); cx2.arc(p.x,p.y,p.s*.6,0,7); cx2.fill();
      if (p.life>0) alive.push(p);
    } else if (p.k==='puff'){
      p.r+=p.vr; p.vr*=.97; p.x+=p.vx; p.y+=p.vy; p.life-=.022;
      glow(cx2,p.x,p.y,p.r*1.6,p.c,p.life*.9); cx2.globalAlpha=Math.max(0,p.life*.8); cx2.fillStyle=p.c; cx2.beginPath(); cx2.arc(p.x,p.y,p.r*.8,0,7); cx2.fill();
      if (p.life>0) alive.push(p);
    } else if (p.k==='leaf'){
      p.ph+=.08; p.vy=Math.min(1.4,p.vy+.08); p.vx*=.96; p.x+=p.vx+Math.sin(p.ph)*1.1; p.y+=p.vy; p.rot+=p.vr+Math.cos(p.ph)*.04; p.life--;
      cx2.globalAlpha=Math.min(1,p.life/30); cx2.translate(p.x,p.y); cx2.rotate(p.rot); cx2.fillStyle=p.c; cx2.beginPath(); cx2.ellipse(0,0,p.s,p.s*.45,0,0,7); cx2.fill(); cx2.strokeStyle='rgba(0,0,0,.18)'; cx2.lineWidth=1; cx2.beginPath(); cx2.moveTo(-p.s,0); cx2.lineTo(p.s,0); cx2.stroke();
      if (p.life>0 && p.y<innerHeight+20) alive.push(p);
    } else if (p.k==='bubble'){
      p.ph+=.1; p.x+=Math.sin(p.ph)*.7; p.y+=p.vy; p.life--;
      const a=Math.min(1,p.life/25); cx2.globalAlpha=a*.9; cx2.strokeStyle='#5AB4FF'; cx2.lineWidth=1.8; cx2.fillStyle='rgba(124,200,255,.18)'; cx2.beginPath(); cx2.arc(p.x,p.y,p.r,0,7); cx2.fill(); cx2.stroke(); cx2.fillStyle='#FFFFFF'; cx2.beginPath(); cx2.arc(p.x-p.r*.35,p.y-p.r*.35,p.r*.25,0,7); cx2.fill();
      if (p.life>0) alive.push(p);
    } else if (p.k==='note'){
      p.ph+=.08; p.x+=p.vx+Math.sin(p.ph)*.6; p.y+=p.vy; p.vy*=.99; p.life--;
      cx2.globalAlpha=Math.min(1,p.life/25); cx2.font=`800 ${p.s}px "Baloo 2", sans-serif`; cx2.textAlign='center'; cx2.textBaseline='middle';
      cx2.translate(p.x,p.y); cx2.rotate(Math.sin(p.ph)*.25); cx2.lineWidth=4; cx2.strokeStyle='rgba(255,255,255,.95)'; cx2.strokeText(p.ch,0,0); cx2.fillStyle=p.c; cx2.fillText(p.ch,0,0);
      if (p.life>0) alive.push(p);
    } else if (p.k==='drop'){
      p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.life--;
      cx2.globalAlpha=Math.min(1,p.life/20); cx2.fillStyle='#5AB4FF'; cx2.beginPath(); cx2.arc(p.x,p.y,2.6,0,7); cx2.fill();
      if (p.life>0) alive.push(p);
    }
    cx2.restore();
  }
  parts = alive;
  raf = parts.length? requestAnimationFrame(tick) : 0;
}
// Petites lucioles qui flottent en fond
function initMotes(){ const n = innerWidth<600? 18 : 28; motes = Array.from({length:n},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:3+Math.random()*11,vy:-(.1+Math.random()*.3),vx:(Math.random()-.5)*.2,ph:Math.random()*6,c:pick(['#FF5D86','#FFC233','#3F8CFF','#9B6BFF','#2FC98C'])})); }
function drawAmb(){ ax.clearRect(0,0,innerWidth,innerHeight); for(const m of motes){ glow(ax, m.x, m.y, m.r*2.2, m.c, .2+.14*Math.sin(m.ph)); ax.globalAlpha=.35+.25*Math.sin(m.ph); ax.fillStyle='#ffffff'; ax.beginPath(); ax.arc(m.x,m.y,Math.max(1,m.r*.18),0,7); ax.fill(); } }
let ambF=0;
function ambTick(){ ambF++; if (ambF%2===0){ for(const m of motes){ m.x+=m.vx*2+Math.sin(m.ph*.7)*.3; m.y+=m.vy*2; m.ph+=.04; if (m.y<-30){ m.y=innerHeight+30; m.x=Math.random()*innerWidth; } } drawAmb(); } requestAnimationFrame(ambTick); }
initMotes(); if (reduceMotion) drawAmb(); else requestAnimationFrame(ambTick);
function shake(big){ const a=$('#app'); a.classList.remove('shake','shake-big'); void a.offsetWidth; a.classList.add(big?'shake-big':'shake'); setTimeout(()=>a.classList.remove('shake','shake-big'), 650); }

// Particules propres à chaque espèce
function speciesFx(sp, x, y, n, color, mood){
  if (reduceMotion) n=Math.min(n,3);
  const L = mix(color||'#FFFFFF','#ffffff',.55), rnd=Math.random;
  for(let i=0;i<n;i++){
    if (sp==='braise') spawn({k:'ember',x:x+(rnd()-.5)*30,y:y+(rnd()-.5)*20,vx:(rnd()-.5)*1.6,vy:-(1.2+rnd()*2.4),s:2+rnd()*3,life:50+rnd()*40,ph:rnd()*6,c:pick(['#FF7A2F','#FFC233','#FF5E3A','#FFE07A'])});
    else if (sp==='nuage') spawn({k:'puff',x:x+(rnd()-.5)*70,y:y+(rnd()-.2)*40,r:6+rnd()*8,vr:.5+rnd()*.7,vx:(rnd()-.5)*1.2,vy:-(rnd()*.6),life:1,c:L});
    else if (sp==='pousse') spawn({k:'leaf',x:x+(rnd()-.5)*30,y:y-10,vx:(rnd()-.5)*5,vy:-(2+rnd()*3),rot:rnd()*6,vr:(rnd()-.5)*.3,s:5+rnd()*4,life:90+rnd()*40,ph:rnd()*6,c:rnd()<.25?'#FF8FB8':pick(['#5BD48A','#47C27A','#8BE07A'])});
    else if (sp==='goutte') spawn({k:'bubble',x:x+(rnd()-.5)*50,y:y+(rnd()-.5)*20,vy:-(.7+rnd()*1.4),r:3+rnd()*6,ph:rnd()*6,life:70+rnd()*40});
    else spawn({k:'star',x,y,vx:(rnd()-.5)*7,vy:(rnd()-.5)*7,s:4+rnd()*6,rot:rnd()*3,vr:(rnd()-.5)*.3,c:pick(['#BDF3FF','#FFFFFF','#9FE3FF','#E0D4FF']),life:35+rnd()*30});
  }
  if (sp==='goutte' && n>2) for(let i=0;i<Math.ceil(n/2);i++){ const a=-Math.PI/2+(rnd()-.5)*2; spawn({k:'drop',x,y,vx:Math.cos(a)*4,vy:Math.sin(a)*5,g:.25,life:60}); }
  if (sp==='nuage' && mood==='sad') for(let i=0;i<6;i++) spawn({k:'drop',x:x+(rnd()-.5)*60,y:y+10,vx:0,vy:2+rnd()*2,g:.15,life:40});
  if (sp==='cristal' && n>2) ring(x,y,'#9FE3FF',70,4);
}
// Petites particules que chaque créature émet tranquillement au repos

  else if (sp==='nuage'){ const [x,y]=at(.5+(rnd()-.5)*.6,.82); spawn({k:'puff',x,y,r:2+rnd()*3,vr:.25,vx:(rnd()-.5)*.4,vy:-.2,life:.7,c:mix(col,'#ffffff',.6)}); }

function flyXp(g, x, y, oldPct, evolved, n, color){

function toast(o){

  t.innerHTML = `${o.icon?`<div class="ti">${o.icon}</div>`:''}<div class="tt">${esc(o.title)}${o.sub?`<small>${esc(o.sub)}</small>`:''}</div>${o.action?`<button type="button">${esc(o.action)}</button>`:''}`;
  if (o.action) t.querySelector('button').onclick = ()=>{ o.onAction(); close(); };

      rd.hidden=false; rd.textContent = (g? `pour ${creatureName(g)} (${g.name})` : '') + (joker? (g?' · ':'')+'+1 joker de série' : '') + ` · +${gems} éclats`;
      b.hidden=false; b.focus();
      checkAchievements(); commit();
      b.onclick = ()=>{ el.remove(); render(); if (res && g) handleEvents(Object.assign({comforted:false},res), g); done(); };
    };
  });
}

function fmtNum(v){ return (Math.round(v*100)/100).toLocaleString('fr-FR'); }
function metricBest(m, entries){ const es=entries||m.entries; if (!es.length) return null; return es.reduce((b,e)=> m.dir==='down' ? Math.min(b,e.v) : Math.max(b,e.v), es[0].v); }
function sparkline(m, color){
  const es=m.entries.slice(-14); if (es.length<2) return '';
  const vs=es.map(e=>e.v), lo=Math.min(...vs), hi=Math.max(...vs), span=(hi-lo)||1;
  const pts=es.map((e,i)=>[ (i/(es.length-1))*92+3, 40-((e.v-lo)/span)*32 ]);
  const line=pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' '), last=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 100 46" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts[0][0].toFixed(1)},44 ${line} ${last[0].toFixed(1)},44" fill="${color}" fill-opacity=".14" stroke="none"/><polyline points="${line}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path d="M${last[0]} ${last[1]} l0.01 0" stroke="${color}" stroke-width="8" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`;
}
function metricCard(g, m){
  const last = m.entries[m.entries.length-1], best = metricBest(m);
  const first = m.entries[0];
  const delta = (last && first && m.entries.length>1) ? last.v-first.v : 0;
  const good = m.dir==='down' ? delta<0 : delta>0;
  return `<div class="metric"><span class="mname">${esc(m.name)}</span><span class="mval">${last?fmtNum(last.v):'—'}<small> ${esc(m.unit)}</small></span>
    ${sparkline(m, g.color)}
    <span class="tiny">${last ? `Record : ${fmtNum(best)} ${esc(m.unit)} · ${m.entries.length} mesure${m.entries.length>1?'s':''}${delta&&good?` · ${delta>0?'+':''}${fmtNum(delta)} depuis le début`:''}` : 'Pas encore de mesure : note ton point de départ.'}</span>
    <div class="mbtns"><button type="button" class="btn primary" data-act="logMetric" data-g="${g.id}" data-m="${m.id}">${IC.plus} Noter</button><button type="button" class="btn" data-act="editMetric" data-g="${g.id}" data-m="${m.id}">${IC.pen}</button></div></div>`;
}

function openMetricLog(g, m){

      offerUndo(snap, 'Record : '+m.name);

function heatmap(){
  const today=dayKey(), wd=(new Date().getDay()+6)%7, start=addDays(today, -(11*7+wd));

function render(){

/* ===================== Clics ===================== */
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act, g = el.dataset.g? getGoal(el.dataset.g) : null;
  switch(act){
    case 'do': doAction(el.dataset.g, el.dataset.a, e, el); break;
    case 'pet': pet(el.dataset.g, el); break;
    case 'petEgg': { const r=el.querySelector('.cr-root'); if(r){ r.classList.remove('tap'); r.getBoundingClientRect(); r.classList.add('tap'); } sfx.boop(); break; }
    case 'open': go('goal:'+el.dataset.g); break;
    case 'home': go('home'); break;
    case 'trophies': go('trophies'); break;
    case 'settings': go('settings'); break;
    case 'chest': openChest(); break;
    case 'planOpen': openPlanEditor(); break;
    case 'planSkip': state.plan={date:dayKey(), items:[], skipped:true}; commit(); render(); break;
    case 'planDo': { const it=(state.plan&&state.plan.items||[])[+el.dataset.i]; if (it && !it.done) doAction(it.g, it.a, e, el); break; }
    case 'addMetric': openMetricEditor(g, null); break;
    case 'editMetric': openMetricEditor(g, g.metrics.find(m=>m.id===el.dataset.m)); break;
    case 'logMetric': openMetricLog(g, g.metrics.find(m=>m.id===el.dataset.m)); break;
    case 'shop': openShop(el.dataset.g); break;
    case 'resetProg': doResetProgress(); break;
    case 'newGoal': openGoalEditor(null); break;
    case 'editGoal': openGoalEditor(g); break;
    case 'addAction': openActionEditor(g, null); break;
    case 'editAction': openActionEditor(g, g.actions.find(a=>a.id===el.dataset.a)); break;
    case 'addMs': openMilestoneEditor(g, null); break;
    case 'editMs': openMilestoneEditor(g, g.milestones.find(m=>m.id===el.dataset.m)); break;
    case 'ms': doMilestone(el.dataset.g, el.dataset.m); break;
    case 'addSkill': openSkillEditor(g, null); break;
    case 'editSkill': openSkillEditor(g, g.skills.find(s=>s.id===el.dataset.s)); break;
    case 'starter': state.goals = starterGoals().map(x=>migrate({goals:[x]}).goals[0]); state.started=true; ensureDay(); commit(); sfx.level(); confetti(innerWidth/2, innerHeight/2, 120); go('home'); toast({icon:IC.egg, title:'Tes 3 œufs sont prêts !', sub:'Valide une action pour commencer.', color:'var(--accent)'}); break;
    case 'blank': state.started=true; ensureDay(); commit(); render(); openGoalEditor(null); break;
    case 'sound': state.settings.sound=!state.settings.sound; commit(); render(); if(state.settings.sound) sfx.pop(); break;
    case 'soundTest': {
      unlockAudio();
      [523,659,784,1047].forEach((f,i)=>tone(f,.25,{at:i*.12,type:'triangle',vol:.25,force:true}));
      const box=$('#audioDiag');
      setTimeout(()=>{ if(!box) return; const s = actx? actx.state : 'none';
        box.innerHTML = s==='running'
          ? `<b>Moteur audio : actif.</b> Le son est bien envoyé. Si tu n'entends rien : monte le volume de l'appareil. Sur iPhone, vérifie aussi le bouton silencieux sur le côté (la page essaie de passer outre, mais pas toujours). Les sons sont ${state.settings.sound?'activés':'coupés'}, la musique est ${state.settings.music?'activée':'coupée'}${music.on?' et joue':''}.`
          : s==='none' ? `<b>Moteur audio : indisponible.</b> Ce navigateur ou cette app ne permet pas le son. Essaie d'ouvrir le lien dans Chrome ou Safari.`
          : `<b>Moteur audio : bloqué (${esc(s)}).</b> Touche encore une fois « Tester le son ». Si ça reste bloqué, ouvre le lien dans Chrome ou Safari plutôt que dans l'app Claude.`;
      }, 400);
      break;
    }
    case 'music': state.settings.music=!state.settings.music; commit(); if(state.settings.music) startMusic(); else stopMusic(); render(); break;
    case 'export': doExport(); break;
    case 'import': doImport(); break;
    case 'reset': doReset(); break;
  }
});

async function doExport(){
  const json = JSON.stringify(state, null, 1);
  const name = 'eclosion-sauvegarde-'+dayKey()+'.json';
  try{
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if (dl){ await dl.save({filename:name, data:json}); toast({title:'Sauvegarde exportée', color:'var(--mint)'}); return; }
  }catch(err){ if (err && err.code==='declined') return; }
  // Version autonome (fichier ouvert directement) : téléchargement classique
  if (!window.claude){ try{ const u=URL.createObjectURL(new Blob([json],{type:'application/json'})); const l=document.createElement('a'); l.href=u; l.download=name; document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(u),2000); toast({title:'Sauvegarde téléchargée', color:'var(--mint)'}); return; }catch(e){} }
  const box = $('#exportBox'); if(!box) return;
  box.innerHTML = `<div class="field"><span class="lbl">Copie ce texte et garde-le précieusement</span><textarea id="expTxt" readonly></textarea><button type="button" class="btn" id="cpy">Copier</button></div>`;
  const ta=$('#expTxt'); ta.value=json;
  $('#cpy').onclick = ()=>{ navigator.clipboard && navigator.clipboard.writeText(json).then(()=>toast({title:'Copié !',color:'var(--mint)'}), ()=>{ ta.select(); }); if(!navigator.clipboard) ta.select(); };
}
function doImport(){
  const file = $('#impFile').files[0], txt = $('#impTxt').value.trim(), zone=$('#impZone');
  const apply = raw=>{
    let data; try{ data = JSON.parse(raw); }catch(e){ zone.innerHTML='<p class="mood">Ce fichier n’est pas une sauvegarde valide (format JSON attendu).</p>'; return; }
    if (!data || !Array.isArray(data.goals)){ zone.innerHTML='<p class="mood">Sauvegarde invalide : aucun objectif trouvé.</p>'; return; }
    zone.innerHTML = `<div class="confirm-box"><b>Remplacer tes données actuelles par cette sauvegarde (${data.goals.length} objectif${data.goals.length>1?'s':''}) ?</b><div class="sheet-actions"><button class="btn" type="button" id="impNo">Non</button><button class="btn danger" type="button" id="impYes">Oui, remplacer</button></div></div>`;
    $('#impNo').onclick=()=>zone.innerHTML='';
    $('#impYes').onclick=()=>{ state = migrate(data); state.started=true; ensureDay(); commit(); toast({title:'Sauvegarde importée',color:'var(--mint)'}); go('home'); };
  };
  if (file){ const r=new FileReader(); r.onload=()=>apply(r.result); r.readAsText(file); }
  else if (txt) apply(txt);
  else zone.innerHTML='<p class="tiny">Choisis un fichier ou colle le contenu d’une sauvegarde.</p>';
}
function doResetProgress(){
  const z=$('#resetProgZone'); if(!z) return;
  z.innerHTML = `<div class="confirm-box"><b>Remettre ta progression à zéro ?</b><span class="tiny">Tes objectifs, compétences, actions et étapes restent. Tout le reste repart de zéro, sur tous tes appareils. C'est définitif.</span><div class="sheet-actions"><button class="btn" type="button" id="rpNo">Annuler</button><button class="btn danger" type="button" id="rpYes">Oui, repartir de zéro</button></div></div>`;
  $('#rpNo').onclick=()=>render();
  $('#rpYes').onclick=()=>{
    const f=freshState(), now=Date.now();
    state.goals.forEach(g=>{
      g.xp=0; g.legendary=false; g.sadNeed=0; g.lastActive=null; g.createdAt=now; g.acc={};
      g.skills.forEach(k=>{ k.xp=0; });
      g.actions.forEach(a=>{ delete a.today; delete a.week; });
      g.milestones.forEach(m=>{ m.done=false; delete m.doneAt; delete m.gained; });
    });
    state.streak=f.streak; state.daily=null; state.achievements={}; state.stats=f.stats; state.log=[]; state.days={}; state.coins=f.coins; state.owned=[];
    undoSnap=null; ensureDay(); commit(); go('home');
    toast({icon:IC.egg, title:'Progression remise à zéro', sub:'Tes objectifs sont toujours là. À toi de jouer !', color:'var(--accent)'});
  };
}
// Boutique : acheter des accessoires avec des éclats et habiller ses créatures
function openShop(gid){
  let sel = gid || ((state.goals.find(g=>stageOf(g)>0) || state.goals[0] || {}).id);
  const body = ()=>{
    const g=getGoal(sel), st=g?stageOf(g):0, coins=state.coins||0;
    const who = state.goals.map(x=>`<button type="button" data-who="${x.id}" class="${x.id===sel?'on':''}"><div class="mini">${creatureSVG(x.species,x.color,stageOf(x),'happy',x.xp/100,x.acc)}</div>${esc(creatureName(x))}</button>`).join('');
    const items = Object.keys(ACC).map(id=>{
      const it=ACC[id], owned=(state.owned||[]).includes(id), on=!!(g && g.acc && g.acc[it.slot]===id);
      const prev = g ? creatureSVG(g.species, g.color, Math.max(1,st), 'happy', 0, {[it.slot]:id}) : '';
      const btn = owned ? `<span class="shop-btn ${on?'on':''}">${on?'Porté ✓':'Équiper'}</span>` : `<span class="shop-btn buy ${coins>=it.price?'':'poor'}">${IC.coin}${it.price}</span>`;
      return `<button type="button" class="shop-item ${on?'on':''}" data-item="${id}"><div class="mini">${prev}</div><b>${it.name}</b>${btn}</button>`;
    }).join('');
    return `<div class="section-h"><h2>Boutique</h2><span class="pill">${IC.coin}${coins}</span></div>
      <p class="tiny" style="margin:0">Tu gagnes des éclats avec les coffres, les étapes, les succès, tes objectifs de la semaine et tes niveaux. Un accessoire acheté peut être porté par toutes tes créatures.</p>
      ${state.goals.length?`<div class="field"><span class="lbl">Pour qui ?</span><div class="who">${who}</div></div>`:'<p class="mood" style="margin:0">Crée d’abord un objectif pour avoir une créature à habiller.</p>'}
      ${g&&st===0?'<p class="mood" style="margin:0">Cet œuf doit d’abord éclore pour porter un accessoire. Tu peux déjà acheter pour plus tard.</p>':''}
      <div class="shop-grid">${items}</div>
      <button class="btn block" data-x="close" type="button">Fermer</button>`;
  };
  openSheet(body(), sh=>{
    sh.addEventListener('click', e=>{
      const w=e.target.closest('[data-who]'); if (w){ sel=w.dataset.who; sh.innerHTML=body(); return; }
      const el=e.target.closest('[data-item]'); if (!el) return;
      const id=el.dataset.item, it=ACC[id], g=getGoal(sel);
      state.owned = state.owned||[];
      if (!state.owned.includes(id)){
        if ((state.coins||0) < it.price){ toast({icon:IC.coin, title:'Pas assez d’éclats', sub:`Il t'en manque ${it.price-(state.coins||0)}.`, color:'var(--muted)'}); return; }
        state.coins -= it.price; state.owned.push(id);
        if (g && stageOf(g)>0){ g.acc=g.acc||{}; g.acc[it.slot]=id; }
        const r=el.getBoundingClientRect(); sfx.chest(); confetti(r.left+r.width/2, r.top+r.height/2, 50, null, .9); stars(r.left+r.width/2, r.top+r.height/2, 12, null, 1.2);
      } else {
        if (!g) return;
        if (stageOf(g)===0){ toast({icon:IC.egg, title:'Pas encore éclos', sub:'Cet œuf ne peut pas encore porter d’accessoire.', color:'var(--muted)'}); return; }
        g.acc=g.acc||{};
        if (g.acc[it.slot]===id) delete g.acc[it.slot]; else g.acc[it.slot]=id;
        sfx.boop();
      }
      commit(); sh.innerHTML=body(); render();
    });
  });
}

  else { if (audioUnlocked) unlockAudio(); if (music.resume){ music.resume=false; startMusic(); } }
});
document.addEventListener('visibilitychange', ()=>{ if (!document.hidden && state.started){ const before = state.daily && state.daily.day; ensureDay(); if (!state.daily || state.daily.day!==before) render(); } });

/* ===================== Vie des créatures ===================== */
// Les yeux suivent ton doigt ou ta souris
let ptr=null, ptrT=0, lookRaf=0;
function inView(w){ const r=w.getBoundingClientRect(); return r.bottom>0 && r.top<innerHeight && r.width>0; }
function onPtr(e){ ptr={x:e.clientX,y:e.clientY}; ptrT=Date.now(); if(!lookRaf) lookRaf=requestAnimationFrame(updateLooks); }
function updateLooks(){
  lookRaf=0; if(!ptr) return;
  document.querySelectorAll('.cr-wrap .cr-look').forEach(L=>{
    const w=L.closest('.cr-wrap'); if(!inView(w)) return;
    const r=w.getBoundingClientRect(), dx=ptr.x-(r.left+r.width/2), dy=ptr.y-(r.top+r.height*.5), d=Math.hypot(dx,dy)||1, m=Math.min(1,d/160)*3.6;
    L.style.transform=`translate(${(dx/d*m).toFixed(2)}px,${(dy/d*m*.8).toFixed(2)}px)`;
  });
}
addEventListener('pointermove', onPtr, {passive:true});
addEventListener('pointerdown', onPtr, {passive:true});
function lookAround(w){
  if (Date.now()-ptrT < 2500) return;
  const L=w.querySelector('.cr-look'); if(!L) return;
  const s = Math.random()<.5?-1:1;
  L.style.transform=`translate(${3.4*s}px,0)`;
  setTimeout(()=>{ L.style.transform=`translate(${-3*s}px,-1px)`; }, 700);
  setTimeout(()=>{ L.style.transform=''; }, 1500);
}
// Comportements au repos : regarder autour, sautiller, faire son petit numéro, émettre des particules
setInterval(()=>{
  if (document.hidden || reduceMotion || document.querySelector('.big')) return;
  document.querySelectorAll('.cr-wrap[data-sp]').forEach(w=>{
    if (!inView(w)) return;
    const st=+w.dataset.st, mood=w.dataset.mood;
    if (st===0 || mood==='sleep') return;
    if (Math.random() < (w.classList.contains('lg')?.6:.25)) ambientFx(w);
    if (Math.random() < .07){
      const r=Math.random();
      if (r<.45) lookAround(w);
      else if (r<.75 && mood!=='sad'){ animCreature(w,'idle-hop',650); animCreature(w,'joy',700); }
      else if (mood!=='sad'){ animCreature(w,'tap-'+w.dataset.sp,900); const rr=w.getBoundingClientRect(); speciesFx(w.dataset.sp, rr.left+rr.width/2, rr.top+rr.height/2, 4, w.dataset.col, mood); }
    }
  });
}, 900);

/* ===================== Démarrage ===================== */
if (state.started) ensureDay();
render();
initSync();
})();
</script>

<script>
// Fonctionnement hors connexion + installation comme une vraie app
if ('serviceWorker' in navigator) window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
// Demande au navigateur de ne jamais effacer la sauvegarde
document.addEventListener('click', function once(){ document.removeEventListener('click', once); try{ if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){} });
// Bouton « Installer l'app » (Android et ordinateur)
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  if (document.getElementById('installBtn')) return;
  var b = document.createElement('button'); b.id = 'installBtn'; b.type = 'button'; b.textContent = "Installer l'app";
  b.onclick = function(){ b.remove(); e.prompt(); };
  document.body.appendChild(b);
});
window.addEventListener('appinstalled', function(){ var b=document.getElementById('installBtn'); if (b) b.remove(); });
</script>
